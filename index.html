<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mirtillo</title>
<meta name="description" content="La dispensa, le ricette e la spesa, sempre in tasca.">
<meta name="theme-color" content="#F2F8FF">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icona-192.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mirtillo">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: colonna singola da 480px, header morbido e tab bar fissa in basso.
   Niente angoli vivi: raggi larghi, bolle organiche per le emoji, ombre diffuse. Solo tema chiaro. */
:root{
  color-scheme: light;
  --verde:#2A7BE4;        /* principale / CTA */
  --verde-scuro:#102A4C;  /* titoli ed elementi scuri */
  --crema:#F2F8FF;        /* fondo */
  --salvia:#D8E9FB;       /* card e sezioni secondarie */
  --nero:#102A4C;         /* testo */
  --terra:#FFA64D;        /* accenti e dettagli */
  --ambra:#F2711C;        /* accento forte */
  /* derivati */
  --su-verde:#FFFFFF;
  /* "ok" è separato dal brand: così il principale può essere di qualsiasi colore
     senza che una scorta piena sembri un allarme */
  --ok:#2F9158; --ok-su:#FFFFFF;
  --mirtillo:#4A56B5;      /* le bacche piene della difficoltà */
  --surface:#FFFFFF; --surface-2:#E6EFF9;
  --ink:#102A4C; --ink-2:#42587A; --ink-3:#5A6E85;
  --line:#DCE7F3; --line-strong:#102A4C;
  --verde-bg:#DAF0E2; --verde-ink:#1F7045;
  --terra-bg:#FFEDD8; --terra-ink:#9A5410;
  --alert:#C2560D; --alert-bg:#FEE3CC;
  --salvia-soft:#E9F2FC;
  /* tutto il colore passa da qui: cambiare questo blocco cambia l'app intera */
  --ombra:20,60,110;
  --ombra-scura:16,42,76;
  --verde-rgb:42,123,228;
  --crema-rgb:242,248,255;
  --menu-bg:rgba(255,255,255,.86);
  --velo:rgba(16,42,76,.46);
  --fuori:#E2EDF8;
  --bordo-ingr:#CFE2F5; --box-ingr:#B9D6F0; --ingr-on:#E2F0FB;
  --pat-c1:#6FA8E0; --pat-c2:#E8B35A; --pat-c3:#8FB47A; --pat-c4:#4F8FD6;
  --pat-o1:.14; --pat-o2:.12; --pat-o3:.11; --pat-o4:.09;
  /* Il movimento: la famiglia cubic, quella standard.
     La curva di prima (.32,.72,0,1) partiva quasi di scatto e poi aveva una
     coda lunghissima: negli ultimi due decimi la cosa si muoveva di tre
     pixel, e lì i fotogrammi si contano a uno a uno — è quello che si vede
     come "a scatti". La cubic distribuisce il movimento in modo più
     uniforme: parte già in moto e arriva senza strisciare. */
  --mov:cubic-bezier(.33,1,.68,1);          /* cubic in uscita */
  --mov-dentro:cubic-bezier(.65,0,.35,1);   /* cubic in entrata e uscita */
  --mov-entra:cubic-bezier(.32,0,.67,0);    /* cubic in entrata: accelera */
  --mov-molla:cubic-bezier(.34,1.18,.64,1); /* un filo di rimbalzo, misurato */
  --t-tocco:.16s; --t-cambio:.34s; --t-pannello:.48s;
  --shadow:0 8px 22px rgba(var(--ombra),.13);
  --shadow-sm:0 4px 14px rgba(var(--ombra),.10);
  --r-xl:32px; --r-lg:26px; --r-md:20px; --r-sm:16px;
  --blob:58% 42% 45% 55% / 48% 56% 44% 52%;
  --blob2:45% 55% 60% 40% / 55% 45% 55% 45%;
  /* forme larghe: stesso spirito del blob, ma per blocchi bassi e larghi */
  --blob-w:72px 44px 60px 52px / 46% 55% 45% 54%;
  --blob-w2:44px 72px 52px 60px / 55% 46% 54% 45%;
  --blob-t:54px 34px 46px 40px / 44px 58px 36px 52px;
  --blob-s:34px 16px 28px 20px / 24px 32px 18px 30px;
  --blob-s2:16px 34px 20px 28px / 32px 20px 30px 22px;
  --blob-s3:30px 24px 16px 32px / 28px 16px 32px 22px;
  /* festone: una fila di gobbe, usata sul bordo basso della fascia spesa */
  --onda:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='40'%20height='13'%20viewBox='0%200%2040%2013'%20preserveAspectRatio='none'%3E%3Cellipse%20cx='20'%20cy='0'%20rx='20'%20ry='13'%20fill='%23000'/%3E%3C/svg%3E");
  /* i pattern veri li genera lo script: forme sparse, mai la stessa griglia */
  --font-display:'Baloo 2','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
/* niente zoom: è un'app, non una pagina da sfogliare */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{touch-action:manipulation}
body{background-color:var(--crema);
  color:var(--ink);font-family:var(--font-body);font-weight:600;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--crema)}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:800;margin:0;letter-spacing:-.01em;
  color:var(--verde-scuro);text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
/* 16px esatti: sotto questa misura iOS ingrandisce la pagina appena tocchi
   un campo, e da lì resta storta. È la vera causa, non lo zoom col pizzico. */
input,select,textarea{font:inherit;color:inherit;font-size:16px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- guscio ---------- */
/* il pattern sta qui, non su body: così scorre insieme al contenuto */
.app{max-width:480px;margin:0 auto;background-image:var(--pat-bg);
  min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  padding-top:calc(22px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
/* ---------- mattoni ---------- */
.card{background-color:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.soft{background-color:var(--salvia);border-radius:var(--r-lg)}
.sec{margin-block:24px 0}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.sec-h h2{font-size:20px}
.sec-h span{font-size:12.5px;color:var(--ink-3);font-weight:700}
.sec-h .more{margin-left:auto;font-size:13px;font-weight:800;color:var(--verde-ink);
  display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 4px}
.sec-h .more::after{content:"›";font-size:17px;line-height:1}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.muted{color:var(--ink-3);font-size:13px;font-weight:700}
.small{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;border-radius:99px;
  padding:5px 10px;max-width:100%;text-align:left;overflow-wrap:anywhere}
.pill.ok{background:var(--verde-bg);color:var(--verde-ink)}
.pill.warn{background:var(--terra-bg);color:var(--terra-ink)}
.pill.bad{background:var(--alert-bg);color:var(--alert)}
.pill.flat{background:var(--surface-2);color:var(--ink-2)}
.pill.dark{background:var(--verde-scuro);color:var(--crema)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-display);
  font-weight:800;font-size:16px;padding:14px 20px;border-radius:99px;background:var(--surface-2);
  color:var(--verde-scuro);
  transition:transform .36s var(--mov-molla),filter .3s var(--mov)}
/* sotto il dito scende subito, quando lo lasci risale con calma: è questo
   scarto fra andata e ritorno che fa sembrare vivo un tasto */
.btn:active{transform:scale(.96);transition-duration:.1s;transition-timing-function:var(--mov-dentro)}
.btn.primary{background:var(--verde);color:var(--su-verde);box-shadow:0 5px 16px rgba(var(--verde-rgb),.42)}
.btn.dark{background:var(--verde-scuro);color:var(--crema)}
.btn.terra{background:var(--terra);color:var(--verde-scuro)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.btn.wide{width:100%}
.btn.sm{font-size:14px;padding:10px 15px;min-height:44px}
.btn[disabled]{opacity:.4;pointer-events:none}
.blob{flex:0 0 auto;display:grid;place-items:center;border-radius:var(--blob);background:var(--salvia-soft)}
.blob.b2{border-radius:var(--blob2)}
.av{width:52px;height:52px;font-size:28px}
.av-sm{width:42px;height:42px;font-size:22px}
.av-lg{width:76px;height:76px;font-size:42px}
.bar{height:9px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:99px;background:var(--ok);
  transform-origin:left;transform:scaleX(var(--p,0))}
.bar.warn i{background:var(--terra)} .bar.bad i{background:var(--ambra)}
/* difficoltà: cinque mirtilli, pieni fino al livello della ricetta */
.diff{display:inline-flex;align-items:center;gap:3px}
.diff i{width:12px;height:12px;display:block;color:rgba(var(--ombra),.22)}
.diff i svg{width:100%;height:100%;display:block;fill:currentColor}
.diff i svg path{fill:rgba(255,255,255,.55)}
.diff i.on{color:var(--mirtillo)}
.diff b{margin-left:6px;font-size:11.5px;font-weight:800;color:var(--ink-2)}
.diff.big{gap:3.5px}
.diff.big i{width:14px;height:14px}
.diff.big b{font-size:12.5px;margin-left:7px}
.scroller{display:flex;gap:12px;overflow-x:auto;padding-block:4px 10px;scroll-snap-type:x mandatory;
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px));
  /* senza questo lo snap allinea la prima card al bordo dello schermo
     e si mangia il padding di sinistra */
  scroll-padding-inline:max(16px,env(safe-area-inset-left,0px))}
.scroller>*{scroll-snap-align:start}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px 10px;
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px))}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  min-height:44px;font-size:13.5px;font-weight:800;padding:9px 15px;border-radius:99px;
  background:var(--surface-2);color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--verde-scuro);color:var(--crema)}
.chip[aria-pressed="true"] .diff i{color:rgba(255,255,255,.34)}
.chip[aria-pressed="true"] .diff i.on{color:#8E97E8}
.chip[aria-pressed="true"] i.on{background:var(--terra)}

/* ---------- fascia scadenza spesa ---------- */
.band{position:relative;overflow:hidden;padding:19px 22px 29px;margin-top:4px;
  border-radius:22px 22px 4px 4px;
  -webkit-mask-image:linear-gradient(#000,#000),var(--onda);
  mask-image:linear-gradient(#000,#000),var(--onda);
  -webkit-mask-size:100% calc(100% - 14px),14.2857% 15px;
  mask-size:100% calc(100% - 14px),14.2857% 15px;
  -webkit-mask-position:top left,bottom left;
  mask-position:top left,bottom left;
  -webkit-mask-repeat:no-repeat,repeat-x;
  mask-repeat:no-repeat,repeat-x}
.band .big{position:absolute;right:-8px;bottom:-6px;font-size:92px;opacity:.35;transform:rotate(-8deg);pointer-events:none}
.band h3{font-size:19px;line-height:1.2;max-width:72%}
.band.urgent{background-color:var(--terra-bg)}
.days{display:flex;gap:5px;margin-top:12px;max-width:78%}
.days i{flex:1;height:10px;border-radius:99px;background:#FFFFFF9E}
.days i.on{background:var(--verde-scuro)}
.days i.today{background:var(--ambra)}

/* ---------- home ---------- */
.hello{font-size:28px;line-height:1.14;margin-bottom:2px}
.meal{display:flex;align-items:center;gap:13px;padding:13px 14px;width:100%;text-align:left;
  border-radius:var(--r-lg);background-color:var(--surface);
  box-shadow:var(--shadow-sm);margin-bottom:10px}
.meal .slot{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
.meal .name{font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.15;color:var(--verde-scuro)}
.meal .meta{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.meal .go{width:34px;height:34px;flex:0 0 auto;border-radius:50%;background:var(--surface-2);
  display:grid;place-items:center;font-size:15px;color:var(--ink-2)}
.meal.empty{background:transparent;box-shadow:none;border:2px dashed var(--line);color:var(--ink-3)}
.meal.miss{background-color:var(--alert-bg);background-image:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{padding:15px 8px 16px;border-radius:var(--blob-s);text-align:center;background-color:var(--salvia);
  border:0;font:inherit;color:inherit;cursor:pointer;display:block;width:100%}
.stat:active{transform:scale(.97)}
.stat:nth-child(2){border-radius:var(--blob-s2)}
.stat:nth-child(3){border-radius:var(--blob-s3)}
.stat .ic{display:block;font-size:30px;line-height:1;font-style:normal;margin-bottom:5px}
.stat b{display:block;font-family:var(--font-display);font-size:23px;line-height:1.1;color:var(--verde-scuro)}
.stat span{font-size:11px;font-weight:800;line-height:1.25;display:block;margin-top:1px;color:var(--ink-2)}
.rcard{flex:0 0 216px;padding:15px;display:flex;flex-direction:column;gap:9px;text-align:left}
.rcard .thumb{height:104px;border-radius:var(--blob2);display:grid;place-items:center;font-size:58px;
  background-color:var(--salvia-soft)}
.rcard h4{font-size:16.5px;line-height:1.2}

/* ---------- piano ---------- */
.day{padding:4px 0 2px;margin-bottom:18px;scroll-margin-top:78px}
.day-h{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.day-h h3{font-size:16px;text-transform:capitalize}
.day-h .tag{font-size:11px;font-weight:800;color:var(--crema);background:var(--verde-scuro);
  border-radius:99px;padding:3px 10px}
.alert{padding:18px 26px;background-color:var(--alert-bg);border-radius:var(--blob-w2);margin-top:4px}
.alert h3{color:var(--alert)}
/* calendario della settimana */
.cal{display:flex;gap:6px;overflow-x:auto;padding-block:4px 10px;
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px))}
.calday{flex:1 0 44px;min-width:44px;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:9px 4px 9px;border-radius:19px;background-color:var(--surface);box-shadow:var(--shadow-sm)}
.calday .dow{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3)}
.calday .dnum{font-family:var(--font-display);font-size:18px;line-height:1;color:var(--verde-scuro)}
.calday.today{background-color:var(--verde-scuro)}
.calday.sel{box-shadow:0 0 0 2.5px var(--verde), var(--shadow-sm)}
.piano-list{position:relative;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.piano-inner{background-image:var(--pat-bg);padding-bottom:132px}
body.no-pad .app{padding-bottom:0;background-image:none}
.calday.today .dow{color:#FFFFFFA6}
.calday.today .dnum{color:var(--crema)}
.dot{width:7px;height:7px;border-radius:50%;background:transparent;display:block;flex:0 0 auto}
.dot.ko{background:var(--ambra)}
.dot.free{background:var(--salvia)}
.calday.today .dot.free{background:#FFFFFF59}
.callegend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;font-weight:800;color:var(--ink-3);
  margin:-2px 0 18px}
.callegend span{display:flex;align-items:center;gap:6px}
.callegend .dot{width:9px;height:9px}

/* ---------- dispensa ---------- */
/* la ricerca resta attaccata in alto mentre scorri la dispensa */
.searchbar{position:sticky;top:0;z-index:28;
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-left,0px)) 12px;
  background:rgba(var(--crema-rgb),.97)}
.search{display:flex;align-items:center;gap:10px;padding:0 16px;border-radius:99px;
  background-color:var(--surface);box-shadow:var(--shadow-sm)}
.search input{border:0;background:none;outline:none;width:100%;font-weight:700;font-size:16px;
  padding:16px 0;min-height:54px}
.search input::placeholder{color:var(--ink-3)}
.group-h{display:flex;align-items:center;gap:9px;margin:22px 0 10px}
.group-h h3{font-size:16px}
.group-h .count{font-size:12px;font-weight:800;color:var(--ink-2);background:var(--surface-2);
  border-radius:99px;padding:3px 10px}
.inv{display:flex;flex-direction:column;gap:10px}
.item{padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.item .name{font-family:var(--font-display);font-weight:700;font-size:16.5px;line-height:1.15;color:var(--verde-scuro)}
.item .meta{display:flex;align-items:center;gap:7px;margin-top:3px;flex-wrap:wrap}
.item .qty{font-size:13px;font-weight:800;color:var(--ink-2)}
.item.out{opacity:.7}
.item .bar{margin-top:8px}

/* ---------- ricetta ---------- */
.rhero{padding:20px 24px;display:flex;gap:15px;align-items:center;border-radius:var(--blob-w)}
.stepper{display:flex;align-items:center;gap:4px;border-radius:99px;background:var(--surface-2);padding:4px}
.stepper button{width:36px;height:36px;border-radius:50%;background:var(--surface);
  font-size:19px;font-weight:800;display:grid;place-items:center;color:var(--verde-scuro)}
.stepper b{min-width:58px;text-align:center;font-family:var(--font-display);font-size:15px}
/* versione compatta, per le righe della spesa a mano */
.quanto{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.quanto input{width:78px;text-align:right;font-weight:800;font-size:16px;
  border:0;outline:none;background:var(--surface);color:var(--ink);
  border-radius:12px;padding:8px 9px;box-shadow:inset 0 0 0 1.5px var(--box-ingr)}
.quanto input:focus{box-shadow:inset 0 0 0 2px var(--verde)}
.quanto input.corto{width:42px;padding:8px 2px;text-align:center}
.quanto .passo{width:31px;height:31px;flex:0 0 auto;border:0;border-radius:50%;
  background:var(--surface-2);color:var(--verde-scuro);font-size:19px;font-weight:800;
  display:grid;place-items:center;line-height:1}
.quanto .passo:active{transform:scale(.92)}
.passo-g{width:54px;height:54px;flex:0 0 auto;border:0;border-radius:50%;
  background:var(--surface-2);color:var(--verde-scuro);font-size:26px;font-weight:800;
  display:grid;place-items:center;line-height:1}
.passo-g:active{transform:scale(.94)}
input.grande{width:112px;border:0;outline:none;background:var(--surface-2);color:var(--ink);
  text-align:center;font-family:var(--font-display);font-size:26px;font-weight:800;
  border-radius:16px;padding:10px 6px}
input.grande:focus{box-shadow:inset 0 0 0 2px var(--verde)}
.quanto b{font-size:12px;font-weight:800;color:var(--ink-2);min-width:26px}
.quanto .unit{font-size:12px;font-weight:800;color:var(--verde-scuro);min-width:34px;
  padding:7px 5px;border-radius:9px;background:var(--verde-bg);border:0;white-space:nowrap}
.stepper.sm{padding:3px;gap:2px}
.stepper.sm button{width:30px;height:30px;font-size:17px}
.stepper.sm b{min-width:24px;font-size:14px}
.ing{display:flex;align-items:center;gap:12px;padding:11px 0}
.ing+.ing{border-top:1.5px solid var(--line)}
.tick{width:28px;height:28px;flex:0 0 auto;border-radius:var(--blob2);display:grid;place-items:center;
  font-size:14px;font-weight:800}
.tick.y{background:var(--ok);color:var(--ok-su)}
.tick.n{background:var(--alert);color:#fff}
.tick.p{background:var(--terra);color:var(--verde-scuro)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:13px;margin-top:4px;padding:0}
.steps li{list-style:none;display:flex;gap:12px;font-size:14.5px;font-weight:600;line-height:1.55;color:var(--ink-2)}
.steps li::before{counter-increment:s;content:counter(s);flex:0 0 auto;width:28px;height:28px;
  border-radius:var(--blob);background:var(--salvia);color:var(--verde-scuro);
  font-family:var(--font-display);font-size:14px;display:grid;place-items:center}

/* ---------- proposte ---------- */
.deck{padding:24px 20px 20px;text-align:center;position:relative;overflow:hidden;
  border-radius:var(--blob-t)}
.deck .thumb{width:118px;height:118px;margin:0 auto 12px;font-size:64px}
.deck h2{font-size:25px;line-height:1.15}
.deck .ings{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 4px}
.deck .why{background:var(--salvia-soft);border-radius:var(--r-md);padding:11px 13px;margin-top:14px;
  font-size:13px;font-weight:700;color:var(--ink-2);text-align:left;display:flex;gap:9px;align-items:flex-start}
.facts{display:flex;justify-content:center;gap:9px;margin-top:10px;flex-wrap:wrap}
.fact{background:var(--surface-2);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:800;
  color:var(--verde-scuro)}
.swipe{display:flex;gap:14px;justify-content:center;margin-top:18px}
.swipe button{width:72px;height:72px;border-radius:var(--blob);font-size:30px;display:grid;place-items:center;
  box-shadow:var(--shadow);transition:transform .1s}
.swipe button:active{transform:scale(.93)}
.swipe .no{background:var(--surface);color:var(--alert)}
.swipe .si{background:var(--ok);color:var(--ok-su)}
.rng{width:100%;accent-color:var(--verde-scuro);height:30px}

/* ---------- spesa ---------- */
.sitem{padding:12px 14px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
/* su uno schermo stretto il nome veniva tagliato a metà ("Zucc"): lì i
   comandi scendono sotto e il nome si riprende tutta la riga */
@media (max-width:365px){
  .sitem.ingr{flex-wrap:wrap}
  .sitem.ingr .quanto{width:100%;justify-content:flex-end;margin-top:2px}
}
.box{width:28px;height:28px;flex:0 0 auto;border-radius:var(--blob2);background:var(--surface-2);
  display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--verde-scuro)}
.sitem[aria-pressed="true"] .box{background:var(--ok);color:var(--ok-su)}
.sitem[aria-pressed="true"] .name{text-decoration:line-through;color:var(--ink-3)}
.why{font-size:12px;font-weight:700;color:var(--verde-ink)}
.budget{padding:16px}
.budget .num{font-family:var(--font-display);font-size:30px;line-height:1;color:var(--verde-scuro)}

/* ---------- scontrino ---------- */
.flow{display:flex;gap:6px;margin-block:6px 16px}
.flow i{flex:1;height:7px;border-radius:99px;background:var(--surface-2)}
.flow i.on{background:var(--verde)}
.drop{padding:32px 22px;text-align:center;border-radius:var(--blob-t)}
.drop .ic{font-size:70px}
.scan{position:relative;height:230px;border-radius:var(--r-lg);background:var(--surface-2);
  overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:18px 20px}
.scan .l{height:9px;border-radius:99px;background:#FFFFFFB0}
.scan .beam{position:absolute;left:0;right:0;top:0;height:60px;will-change:transform;
  background:linear-gradient(180deg,transparent,rgba(var(--verde-rgb),.6),transparent);animation:beam 1.5s linear infinite}
@keyframes beam{0%{transform:translateY(-62px)}100%{transform:translateY(232px)}}
.scan img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pline{padding:12px 14px;display:flex;align-items:flex-start;gap:11px}
.pline .raw{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;font-weight:700;
  color:var(--ink-3);letter-spacing:-.02em;word-break:break-word}
.pline .name{font-family:var(--font-display);font-weight:700;font-size:16px;line-height:1.2;color:var(--verde-scuro)}
.pline.off{opacity:.55}
.sw{width:48px;height:29px;flex:0 0 auto;border-radius:99px;background:var(--surface-2);
  position:relative;transition:background var(--t-cambio) var(--mov)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
  background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);
  transition:transform var(--t-cambio) var(--mov-molla)}
.sw[aria-pressed="true"]{background:var(--ok)}
.sw[aria-pressed="true"]::after{transform:translateX(19px)}
.done{text-align:center;padding:28px 20px}
.done .ic{font-size:82px}

/* ---------- nuova ricetta ---------- */
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:13px}
.field label{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.field input,.field select,.field textarea{background:var(--surface);border:0;border-radius:var(--r-sm);
  padding:12px 15px;font-weight:700;font-size:16px;outline:none;font-family:var(--font-body);width:100%;
  box-shadow:inset 0 0 0 2px var(--line)}
.field input:focus-visible,.field textarea:focus-visible{box-shadow:inset 0 0 0 2px var(--verde-scuro)}
.nr-step{padding:16px;margin-bottom:13px}
.nr-num{width:30px;height:30px;border-radius:var(--blob);background:var(--verde);color:var(--su-verde);
  font-family:var(--font-display);display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.ingrow{display:grid;grid-template-columns:1fr 68px 78px 34px;gap:7px;align-items:center;margin-bottom:8px}
@media (max-width:430px){
  .ingrow{grid-template-columns:1fr 92px 38px}
  .ingrow>:first-child{grid-column:1 / -1}
}
.ingrow input,.ingrow select{padding:10px 12px;font-size:16px;border-radius:14px;background:var(--surface);
  border:0;box-shadow:inset 0 0 0 2px var(--line);outline:none;font-family:var(--font-body);font-weight:700;width:100%}
.ingrow .del{display:grid;place-items:center;height:40px;border-radius:50%;color:var(--ink-3)}
.ingnote{font-size:11.5px;font-weight:800;margin:-4px 0 10px 4px}
.ingnote:empty{display:none}
.feas{position:sticky;bottom:calc(124px + env(safe-area-inset-bottom,0px));padding:14px 16px}
.cta-scontrino{display:flex;align-items:center;gap:13px;padding:17px 24px;width:100%;text-align:left;
  border-radius:var(--blob-w2);background-color:var(--salvia);
  box-shadow:var(--shadow-sm);margin-top:4px}
.cta-scontrino strong{font-family:var(--font-display);font-size:17.5px;color:var(--verde-scuro);display:block;line-height:1.2}

/* ---------- sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:60;background:var(--velo);display:flex;align-items:flex-end;
  animation:velo .38s var(--mov) both}
@keyframes velo{from{opacity:0}to{opacity:1}}
/* mentre il pannello scende, il velo si schiarisce: se sparisse di colpo
   sembrerebbe che la pagina sotto sia saltata fuori da un'altra parte */
.sheet-wrap.via{animation:velo-via .26s var(--mov-dentro) both}
@keyframes velo-via{to{opacity:0}}
.sheet-wrap.via .sheet{animation:giu-via .26s var(--mov-dentro) both}
@keyframes giu-via{to{transform:translateY(100%)}}
/* se lo sto solo ridisegnando (una cifra che cambia, una ricerca) il
   pannello non deve rientrare da capo */
.sheet-wrap.gia:not(.via),.sheet-wrap.gia:not(.via) .sheet{animation:none}
.sheet{width:100%;max-width:480px;margin:0 auto;background:var(--crema);border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:10px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));
  max-height:82vh;overflow-y:auto;will-change:transform;
  animation:su var(--t-pannello) var(--mov) both}
@keyframes su{from{transform:translateY(100%)}to{transform:none}}
.grab{width:46px;height:5px;border-radius:99px;background:var(--line);margin:0 auto}
.sheet-top{position:sticky;top:-10px;z-index:3;display:grid;grid-template-columns:44px 1fr 44px;
  align-items:center;background:var(--crema);padding:8px 0 12px;margin:-4px 0 6px}
.sheet-top .x{width:44px;height:44px;border:0;border-radius:50%;background:var(--surface-2);
  color:var(--ink-2);font-size:16px;font-weight:800;display:grid;place-items:center}
.sheet-top .x:active{transform:scale(.94)}

/* ---------- fotocamera dal vivo ---------- */
.live{position:fixed;inset:0;z-index:80;background:#0A1020;overflow:hidden}
.live video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.live canvas.ovl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.live .freccia{position:absolute;left:50%;transform:translateX(-50%);z-index:3;
  bottom:40%;pointer-events:none;display:none;flex-direction:column;align-items:center;gap:4px}
.live .freccia.on{display:flex}
.live .freccia span{font-size:40px;line-height:.8;color:#9BE37A;
  text-shadow:0 2px 10px rgba(0,0,0,.5);animation:giu 1.1s ease-in-out infinite}
.live .freccia span:nth-child(2){animation-delay:.14s;opacity:.6}
.live .freccia b{font-family:var(--font-display);font-size:13px;color:#fff;
  background:rgba(10,16,32,.72);padding:6px 12px;border-radius:99px;margin-top:4px}
@keyframes giu{0%,100%{transform:translateY(-5px)}50%{transform:translateY(7px)}}
.live .guida{position:absolute;left:6%;right:6%;top:11%;bottom:34%;
  border:2px dashed rgba(255,255,255,.35);border-radius:20px;pointer-events:none;
  box-shadow:0 0 0 100vmax rgba(6,10,22,.55);transition:opacity .3s}
.live .guida.ok{opacity:0}
.live .guida.ok{border-color:#9BE37A}
/* la guida è l'unica cosa che ti dice cosa fare mentre inquadri: deve
   leggersi con il telefono in mano e a braccio teso, non strizzando */
.live .guidacard{position:absolute;left:12px;right:12px;z-index:3;
  top:calc(64px + env(safe-area-inset-top,0px));
  display:grid;grid-template-columns:auto 1fr;gap:0 14px;align-items:center;
  padding:15px 17px 14px;border-radius:24px;
  background:rgba(10,16,32,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 8px 28px rgba(0,0,0,.42);transition:background .3s}
.live .guidacard.ok{background:rgba(20,58,32,.85)}
.live .guidacard .ic{font-size:31px;line-height:1;flex:0 0 auto}
.live .guidacard .tx{display:flex;flex-direction:column;min-width:0}
.live .guidacard b{color:#fff;font-family:var(--font-display);font-size:19.5px;line-height:1.18}
.live .guidacard i{color:rgba(255,255,255,.82);font-style:normal;font-size:14px;
  font-weight:600;line-height:1.3;margin-top:3px}
/* quanto manca: non una percentuale inventata, ma le tappe vere */
.live .avanz{grid-column:1 / -1;margin-top:13px}
.live .barra{height:7px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.live .barra i{display:block;height:100%;width:100%;border-radius:99px;background:#fff;
  transform-origin:left;transform:scaleX(var(--p,0))}
.live .avanz.finito .barra i{background:#86E79B}
.live .tappe{display:flex;justify-content:space-between;gap:4px;margin-top:8px}
.live .tappe span{font-size:10.5px;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:rgba(255,255,255,.4);transition:color .3s}
.live .tappe span.fatta{color:rgba(255,255,255,.72)}
.live .tappe span.ora{color:#fff}
.live .quante{margin-top:7px;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.62)}
.live .chiudi{position:absolute;z-index:3;right:14px;width:40px;height:40px;border-radius:50%;
  top:calc(14px + env(safe-area-inset-top,0px));
  background:rgba(10,16,32,.72);color:#fff;font-size:20px;display:grid;place-items:center}
.live .fondo{position:absolute;left:0;right:0;bottom:0;z-index:2;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,rgba(8,13,26,.94) 68%,rgba(8,13,26,0));
  max-height:46%;display:flex;flex-direction:column;gap:10px}
.live .trovati{overflow-y:auto;display:flex;flex-direction:column;gap:7px;
  scrollbar-width:none}
.live .trovati::-webkit-scrollbar{display:none}
.live .tr{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);
  border-radius:14px;padding:8px 11px;color:#fff;animation:entra .4s var(--mov)}
.live .tr .n{font-weight:800;font-size:14px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live .tr .q{font-size:12.5px;font-weight:700;opacity:.72;flex:0 0 auto}
.live .tr.dubbia{background:rgba(255,166,77,.2)}
@keyframes entra{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.live .conta{color:#fff;font-size:12.5px;font-weight:800;opacity:.75;text-align:center}
.live .ripiego{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;
  justify-content:center;gap:12px;padding:26px;color:#fff;background:#0A1020;text-align:center}
.live .ripiego h2{color:#fff;font-size:22px}
.live .ripiego .btn{color:var(--verde-scuro)}
.live .ripiego .btn.primary{color:#fff}
.live .ripiego .btn.ghost{color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.live .ripiego p{font-size:14px;font-weight:600;opacity:.8;line-height:1.5}

/* ---------- tab bar ---------- */
/* menu flottante */
body.onboarding .tabbar,body.onboarding .tabblur{display:none}
body.onboarding .app{padding-bottom:40px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:35;pointer-events:none;
  padding-left:max(14px,env(safe-area-inset-left,0px));
  padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-bottom:calc(7px + env(safe-area-inset-bottom,0px))}
.tabbar .in{max-width:452px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);
  align-items:end;background:var(--menu-bg);border-radius:30px;padding:9px 6px 10px;
  box-shadow:0 12px 32px rgba(var(--ombra),.22);pointer-events:auto;
  /* un solo passaggio di sfocatura, senza saturazione: la saturazione è un
     secondo passaggio sull'immagine e si paga a ogni fotogramma */
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
/* sotto il menu il contenuto sfuma, così il menu si stacca. Era una seconda
   sfocatura sovrapposta alla prima: la sfumatura da sola fa lo stesso lavoro */
.tabblur{position:fixed;left:0;right:0;bottom:0;z-index:34;pointer-events:none;
  height:calc(126px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top, rgba(var(--crema-rgb),.9), rgba(var(--crema-rgb),0));
  -webkit-mask-image:linear-gradient(to top, #000 48%, rgba(0,0,0,.55) 74%, transparent 100%);
  mask-image:linear-gradient(to top, #000 48%, rgba(0,0,0,.55) 74%, transparent 100%)}
.tab{padding:4px 2px 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  gap:5px;font-size:10.5px;font-weight:800;color:var(--ink-3);border-radius:20px}
.tab .ic{font-size:24px;line-height:1;filter:grayscale(1);opacity:.45}
/* il tasto Spesa usa un'icona disegnata: l'emoji carrello spariva sul colore pieno */
.svgic{width:31px;height:31px;display:block;color:var(--su-verde)}
.cam .svgic{width:14px;height:14px;color:inherit}
.tab[aria-current="page"]{color:var(--verde-scuro)}
.tab[aria-current="page"] .ic{filter:none;opacity:1;transform:translateY(-3px) scale(1.14);
  animation:hop .42s var(--mov-molla)}
@keyframes hop{
  0%{transform:translateY(0) scale(.94);animation-timing-function:cubic-bezier(.33,1,.68,1)}
  45%{transform:translateY(-6px) scale(1.2);animation-timing-function:cubic-bezier(.65,0,.35,1)}
  100%{transform:translateY(-3px) scale(1.14)}}
.tab.key{color:var(--verde-scuro)}
.tab.key .ring{width:60px;height:60px;margin-top:-28px;border-radius:var(--blob);background:var(--verde);
  display:grid;place-items:center;font-size:28px;position:relative;
  box-shadow:0 10px 22px rgba(var(--verde-rgb),.55), 0 0 0 5px var(--surface)}
.tab.key[aria-current="page"] .ring{animation:hop .42s var(--mov-molla)}
.tab{transition:color var(--t-cambio) var(--mov)}
.tab .ic{transition:opacity var(--t-cambio) var(--mov),filter var(--t-cambio) var(--mov),
  transform .42s var(--mov-molla)}
.tab:active .ic{transform:scale(.9)}
.tab.key:active .ring{transform:scale(.93)}
.tab.key .ring{transition:transform .42s var(--mov-molla)}
.tab.key .cam{position:absolute;right:-4px;bottom:-2px;width:25px;height:25px;border-radius:50%;
  background:var(--verde-scuro);color:var(--crema);font-size:12px;display:grid;place-items:center;
  animation:pulse 1.9s var(--mov-dentro) .9s 2 both}
/* due battiti all'apertura per farsi notare, poi sta fermo */
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.11)}}

#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(18px);
  bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:70;box-shadow:0 10px 26px rgba(var(--ombra-scura),.30);
  max-width:min(420px,calc(100vw - 32px));background:var(--verde-scuro);color:var(--crema);
  font-weight:800;font-size:13.5px;padding:12px 18px;border-radius:99px;text-align:center;
  opacity:0;pointer-events:none;
  transform:translateX(-50%) translateY(16px) scale(.96);
  transition:opacity var(--t-cambio) var(--mov),transform var(--t-cambio) var(--mov-molla)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
#toast.conazione{display:flex;align-items:center;gap:14px;pointer-events:auto}

/* ---------- i mirtilli in fondo alla home ---------- */
.chip.grosso{min-width:62px;justify-content:center;font-size:19px;padding:14px 18px}
/* ---------- i mirtilli che galleggiano sotto le domande ---------- */
.coro-sec{margin-top:30px;pointer-events:none;user-select:none}
.coro{display:block;width:100%;max-width:440px;margin:0 auto}
.coro .stella{fill:#2B3585;opacity:.5}
/* ognuno con il suo tempo e la sua altezza: così non sembra un carillon */
.bacca-ferma{transform-box:fill-box;transform-origin:50% 50%;
  animation:fluttua var(--dur) cubic-bezier(.45,0,.55,1) var(--rit) infinite alternate}
@keyframes fluttua{
  from{transform:translateY(0) rotate(-3deg)}
  to{transform:translateY(calc(var(--su) * -1)) rotate(3deg)}
}
.bosco-sec{margin-top:26px;margin-bottom:0;text-align:center}
.bosco{display:block;width:100%;max-width:420px;margin:0 auto;overflow:visible}
.bosco .terra{fill:var(--verde-bg)}
.bosco .ombra-b{fill:rgba(var(--ombra-scura),.16)}
.bosco .stella{fill:#2B3585;opacity:.55}
.bosco .bacca{cursor:pointer}
.bosco .bacca,.bosco .ombra-b{transform-box:fill-box;transform-origin:50% 100%}
/* a riposo si alzano appena, ognuno con il suo tempo: se partissero
   insieme sembrerebbe un meccanismo, non cinque mirtilli */
.bosco .bacca{animation:galleggia 3.4s cubic-bezier(.45,0,.55,1) calc(var(--i) * .31s) infinite alternate}
.bosco .ombra-b{animation:ombretta 3.4s cubic-bezier(.45,0,.55,1) calc(var(--i) * .31s) infinite alternate}
@keyframes galleggia{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes ombretta{from{transform:scale(1);opacity:1}to{transform:scale(.88);opacity:.75}}
/* toccato: si schiaccia, parte, ricade e si assesta. Le curve sono scritte
   per esteso perché dentro i keyframes le variabili non vengono lette */
.bosco .bacca.salta{animation:salto .78s both}
.bosco .ombra-b.salta{animation:ombrasalto .78s both}
@keyframes salto{
  0%  {transform:translateY(0) scale(1,1);      animation-timing-function:cubic-bezier(.32,0,.67,0)}
  16% {transform:translateY(2px) scale(1.2,.8); animation-timing-function:cubic-bezier(.33,1,.68,1)}
  46% {transform:translateY(-34px) scale(.9,1.12); animation-timing-function:cubic-bezier(.32,0,.67,0)}
  74% {transform:translateY(0) scale(1.14,.88); animation-timing-function:cubic-bezier(.34,1.18,.64,1)}
  100%{transform:translateY(0) scale(1,1)}
}
@keyframes ombrasalto{
  0%  {transform:scale(1);opacity:1;   animation-timing-function:cubic-bezier(.33,1,.68,1)}
  46% {transform:scale(.5);opacity:.4; animation-timing-function:cubic-bezier(.32,0,.67,0)}
  74% {transform:scale(1.12);opacity:1;animation-timing-function:cubic-bezier(.34,1.18,.64,1)}
  100%{transform:scale(1);opacity:1}
}
.bosco .bacca.salta .stella{animation:giracalice .78s cubic-bezier(.33,1,.68,1) both;
  transform-box:fill-box;transform-origin:center}
@keyframes giracalice{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.bosco-dice{margin:10px 0 0;font-family:var(--font-display);font-weight:800;
  font-size:14px;color:var(--ink-3);min-height:19px;
  animation:none}
/* in un telefono stretto stanno comunque larghi quanto la pagina */
@media (max-width:380px){ .bosco{max-width:100%} }
.toast-az{flex:0 0 auto;color:var(--crema);font-weight:900;font-size:13.5px;
  text-decoration:underline;text-underline-offset:3px;padding:2px 0}
.pop{animation:pop .4s var(--mov-molla)}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}

/* ---------- quando una schermata si apre ---------- */
/* Le cose non arrivano tutte insieme: salgono una dopo l'altra, a cinque
   centesimi l'una, e in meno di mezzo secondo si sono posate tutte. Solo
   le prime sette: in una lista lunga il resto è già pronto quando ci
   arrivi con l'occhio, e aspettare sarebbe fastidioso. */
#view.vai-tab > *,#view.vai-avanti > *,#view.vai-indietro > *{
  animation:salita .46s var(--mov) both}
@keyframes salita{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#view > *:nth-child(1){animation-delay:0s}
#view > *:nth-child(2){animation-delay:.04s}
#view > *:nth-child(3){animation-delay:.08s}
#view > *:nth-child(4){animation-delay:.11s}
#view > *:nth-child(n+5){animation-delay:.14s}
/* le barre di livello si riempiono da sinistra quando la schermata si apre:
   in un colpo d'occhio vedi quanto ti resta di tutto */
.bar i{transform-origin:left}
#view.vai-tab .bar i,#view.vai-avanti .bar i,#view.vai-indietro .bar i{
  animation:riempi .7s var(--mov) .1s both}
@keyframes riempi{from{transform:scaleX(0)}to{transform:scaleX(var(--p,1))}}

/* ---------- il tocco ---------- */
/* Ogni cosa che si tocca risponde allo stesso modo: scende subito sotto il
   dito e risale con calma. Una regola sola, così niente si muove a modo suo. */
.chip,.stat,.sitem,.calday,.pline,.quanto .passo,.passo-g,.swipe button,
.sheet-top .x,.tile,.ingr{transition:transform .36s var(--mov-molla),
  background-color var(--t-cambio) var(--mov),
  color var(--t-cambio) var(--mov),opacity var(--t-cambio) var(--mov)}
.chip:active,.stat:active,.sitem:active,.calday:active,.pline:active,
.quanto .passo:active,.passo-g:active,.swipe button:active,.sheet-top .x:active{
  transition-duration:.1s;transition-timing-function:var(--mov-dentro)}
.chip:active,.sitem:active,.pline:active,.calday:active{transform:scale(.975)}
/* le barre di livello scorrono invece di saltare: quando salvi quanto ti
   resta di una cosa, il verde ci arriva camminando */
.bar i,.live .barra i{transition:transform .55s var(--mov),background-color var(--t-cambio) var(--mov)}

/* il numero grande fa un salto ogni volta che cambia: è lui il valore che
   stai muovendo, deve essere chiaro che ha sentito il tocco */
.quanto .grande{animation:numero .34s var(--mov-molla)}
@keyframes numero{0%{transform:scale(.86)}100%{transform:scale(1)}}
/* la spunta della lista della spesa non appare: ci salta dentro */
.sitem[aria-pressed="true"] .box,.ingr[aria-pressed="true"] .box{animation:spunta .36s var(--mov-molla)}
@keyframes spunta{0%{transform:scale(.4)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
/* gli stati vuoti respirano piano: una pagina senza niente non deve
   sembrare una pagina rotta */
.drop .ic,.band.soft .av-lg,.done .ic{animation:respiro 4.2s var(--mov-dentro) infinite}
@keyframes respiro{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(-2deg)}}

/* ---------- l'apertura ---------- */
/* Solo il mirtillo. Cade, tocca e si schiaccia un attimo come farebbe una
   cosa vera, rimbalza piano, la stella ci si posa sopra, l'ombra sotto si
   allarga e si stringe col peso. Poi la bacca si allarga verso di te e
   l'app è già lì dentro. Poco più di un secondo.
   È tutto in CSS e sta nel corpo della pagina, così parte al primo
   fotogramma e se ne va da sola anche se lo script non partisse mai. */
#avvio{position:fixed;inset:0;z-index:200;background:var(--crema);
  display:grid;place-items:center;
  animation:avvio-via .4s var(--mov-dentro) .92s both}
@keyframes avvio-via{to{opacity:0;visibility:hidden;pointer-events:none}}
#avvio .bollo{position:relative;display:grid;place-items:center;
  animation:congedo .44s var(--mov-dentro) .88s both}
/* se ne va allargandosi, come se ci entrassi dentro */
@keyframes congedo{to{transform:scale(1.9);opacity:0}}
/* l'ombra per terra: si allarga quando la bacca arriva, si stringe quando
   rimbalza. È il peso, non un effetto */
#avvio .ombra{position:absolute;bottom:-26px;width:74px;height:13px;border-radius:50%;
  background:rgba(74,86,181,.26);filter:blur(5px);
  animation:ombra .9s var(--mov) both}
@keyframes ombra{
  0%{opacity:0;transform:scale(.3);animation-timing-function:cubic-bezier(.32,0,.67,0)}
  36%{opacity:.85;transform:scale(1.12);animation-timing-function:cubic-bezier(.33,1,.68,1)}
  54%{opacity:.5;transform:scale(.8);animation-timing-function:cubic-bezier(.32,0,.67,0)}
  72%{opacity:.8;transform:scale(1.04);animation-timing-function:cubic-bezier(.33,1,.68,1)}
  100%{opacity:.6;transform:scale(1)}}
#avvio svg{width:128px;height:128px;display:block;will-change:transform;
  animation:cade .88s var(--mov) both}
/* cade, si schiaccia sul colpo, si allunga nel rimbalzo, si posa */
@keyframes cade{
  /* Una caduta sola, senza fermate in mezzo: un fotogramma intermedio
     spezzava il volo a metà e si vedeva come un'esitazione. */
  /* cade in cubic (accelera), rimbalza in cubic (decelera): le due metà di
     un volo vero, ognuna con la curva del suo verso */
  0%{opacity:0;transform:translateY(-124px) scale(.88,1.1);
     animation-timing-function:cubic-bezier(.32,0,.67,0)}
  20%{opacity:1}
  36%{transform:translateY(0) scale(1.13,.87);
     animation-timing-function:cubic-bezier(.33,1,.68,1)}
  54%{transform:translateY(-24px) scale(.96,1.04);
     animation-timing-function:cubic-bezier(.32,0,.67,0)}
  72%{transform:translateY(0) scale(1.05,.95);
     animation-timing-function:cubic-bezier(.33,1,.68,1)}
  87%{transform:translateY(-6px) scale(.99,1.01);
     animation-timing-function:cubic-bezier(.32,0,.67,0)}
  100%{transform:translateY(0) scale(1)}}
/* l'aria spostata dall'arrivo: parte nell'istante del tocco */
#avvio .onda{position:absolute;width:128px;height:128px;border-radius:50%;
  box-shadow:0 0 0 2.5px rgba(74,86,181,.42);animation:onda .8s var(--mov) .3s both}
@keyframes onda{0%{opacity:0;transform:scale(.8)}26%{opacity:.6}100%{opacity:0;transform:scale(1.75)}}
/* la stella si posa dopo il colpo, non prima */
#avvio .stella{transform-origin:center;transform-box:fill-box;
  animation:stella .5s var(--mov-molla) .34s both}
@keyframes stella{from{opacity:0;transform:scale(.2) rotate(-50deg)}to{opacity:1;transform:none}}
#avvio .luce{animation:luce .5s var(--mov) .4s both}
@keyframes luce{from{opacity:0}to{opacity:.3}}
/* l'app non compare: si apre sotto, mentre il mirtillo si allarga */
.app{animation:apri .5s var(--mov) .9s both}
@keyframes apri{from{opacity:0;transform:scale(.99)}to{opacity:1;transform:none}}
.tabbar,.tabblur{animation:menu-su .5s var(--mov) 1s both}
@keyframes menu-su{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

/* Il cambio di schermata racconta dove stai andando. Fra le cinque sezioni
   del menu è un dissolvere appena accennato, come fa iOS fra i tab: sono
   posti diversi, non uno dentro l'altro. Quando apri una ricetta o lo
   scontrino la pagina arriva da destra, e tornando indietro se ne va da
   dove era venuta. Pochi pixel: il movimento deve dire la direzione, non
   farsi guardare. */
/* la direzione la danno i figli, ognuno per conto suo */
#view.vai-avanti > *{animation-name:salita-dx}
#view.vai-indietro > *{animation-name:salita-sx}
@keyframes salita-dx{from{opacity:0;transform:translate3d(22px,0,0)}to{opacity:1;transform:none}}
@keyframes salita-sx{from{opacity:0;transform:translate3d(-22px,0,0)}to{opacity:1;transform:none}}

/* Chi ha chiesto meno movimento lo ottiene davvero: niente animazioni, ma
   nemmeno un'app che sfarfalla. Le dissolvenze restano, cortissime. */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;
    animation-delay:0ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  #view.vai-tab > *,#view.vai-avanti > *,#view.vai-indietro > *{
    animation:salita .12s linear both!important;animation-delay:0ms!important}
}
@media (min-width:720px){
  body{background-color:var(--fuori)}
  .app{background-color:var(--crema)}
}
/* ---------- due identità: il pasto è una carta, l'ingrediente è un'etichetta ---------- */
/* pasto: carta chiara sollevata, emoji in una bolla, titolo nel font display */
.dish{background-color:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
/* ingrediente: etichetta salvia piatta, bordino, emoji in un quadratino, nome nel font di testo */
.ingr{background-color:var(--salvia-soft);border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--bordo-ingr)}
.ingr .name,.ing .name{font-family:var(--font-body);font-weight:800;font-size:15.5px;color:var(--nero)}
.ingr .raw{color:var(--ink-3)}
.tile{flex:0 0 auto;display:grid;place-items:center;border-radius:12px;background:var(--surface);
  box-shadow:0 1px 3px rgba(var(--ombra),.10)}
.tile.av{width:46px;height:46px;font-size:25px;border-radius:14px}
.tile.av-sm{width:38px;height:38px;font-size:20px;border-radius:11px}
.ingr .box{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--box-ingr)}
.ingr[aria-pressed="true"]{background-color:var(--ingr-on)}
.ingr[aria-pressed="true"] .box{background:var(--ok);color:var(--ok-su);box-shadow:none}

/* "1 spicchi" e "2 vaso" si leggono male, e adesso queste unità si vedono
   dappertutto: un singolare e un plurale per ognuna */
const UNITA={
 spicchi:['spicchio','spicchi'], vaso:['vaso','vasi'],
 mazzetto:['mazzetto','mazzetti'], rametti:['rametto','rametti'],
 scatole:['scatola','scatole'], bustine:['bustina','bustine'],
 cubetti:['cubetto','cubetti'], vasi:['vaso','vasi'], mazzetti:['mazzetto','mazzetti']
};
function unitaScritta(n,u){
 const c=UNITA[u]; if(!c) return u;
 return Math.abs(n-1)<0.01 ? c[0] : c[1];
}
function qty(n,u){
 if(u==='g'&&n>=1000) return (n/1000).toFixed(n%1000?1:0).replace('.',',')+' kg';
 if(u==='ml'&&n>=1000) return (n/1000).toFixed(n%1000?1:0).replace('.',',')+' L';
 const v=Math.round(n*10)/10;
 return String(v).replace('.',',')+' '+unitaScritta(v,u);
}
const eur=n=>n.toFixed(2).replace('.',',')+' €';
function cost(r){ // costo totale della ricetta
 return r.ing.reduce((t,[k,q])=>{const i=ING[k];return i&&!i.staple?t+(q/i.f)*i.pr:t;},0);
}
const perPorz=r=>cost(r)/r.serv;
function level(k){const i=ING[k];return i?Math.min(1,i.q/Math.max(i.f,1)):0;}
function stato(k){const i=ING[k];if(!i||i.q<=0)return 'out';return level(k)<=.25?'low':'ok';}

/* simula il piano consumando la dispensa giorno per giorno */
function simula(){
 const sim={}; Object.keys(ING).forEach(k=>sim[k]=ING[k].q);
 const out=[];
 PLAN.forEach((d,di)=>SLOTS.forEach(slot=>{
  const id=d.meals[slot]; if(!id) return;
  const r=R(id); if(!r) return;
  const manca=[], f=fattore(), usati={}, tipi=tipiRicetta(r);
  const avere=id=>sim[id]||0;
  const usa=[];
  r.ing.forEach(([k,q0])=>{
   const q=Math.round(q0*f*10)/10;
   const sc=scegli(k,q,avere,usati,tipi);
   usa.push([sc.uso,sc.q]);
   const i=ING[sc.uso];
   if(!i){manca.push([k,q]);return;}
   usati[sc.uso]=1;
   if(i.staple) return;
   if((sim[sc.uso]||0)<sc.q) manca.push([sc.uso, Math.round((sc.q-(sim[sc.uso]||0))*10)/10]);
  });
  usa.forEach(([k,qq])=>{const i=ING[k];
   if(i&&!i.staple) sim[k]=Math.max(0,(sim[k]||0)-qq);});
  out.push({di,slot,r,manca});
 }));
 return out;
}
const oggiCorto=()=>new Date().toLocaleDateString('it-IT',{day:'numeric',month:'short'});
function copertura(){
 const s=simula();
 const primo=s.find(m=>m.manca.length);
 return {giorni: primo?primo.di:PLAN.length, primo};
}
function problemi(){ return simula().filter(m=>m.manca.length); }

/* lista della spesa: tutto ciò che manca al piano + quello che sta finendo */
function listaSpesa(){
 const need={}, perche={};
 problemi().forEach(m=>m.manca.forEach(([k,q])=>{
  need[k]=(need[k]||0)+q;
  (perche[k]=perche[k]||[]).push(r_name(m));
 }));
 const righe=Object.keys(need).map(k=>{
  const i=ING[k]||{n:k,e:'🛒',u:'pz',f:1,pr:2,l:'credenza'};
  const conf=Math.max(1,Math.ceil(need[k]/i.f));
  return {k,i,conf,prezzo:conf*i.pr,perche:perche[k],gruppo:i.l};
 });
 inEsaurimento().forEach(k=>{
  if(need[k]) return; const i=ING[k];
  righe.push({k,i,conf:1,prezzo:i.pr,perche:null,gruppo:i.l,basso:1});
 });
 S.extra.forEach(k=>{
  if(need[k]||righe.some(r=>r.k===k)) return; const i=ING[k]; if(!i) return;
  righe.push({k,i,conf:1,prezzo:i.pr,perche:null,gruppo:i.l,mano:1});
 });
 return righe;
}
const r_name=m=>`${dayLabel(m.di)} a ${m.slot==='cena'?'cena':m.slot==='pranzo'?'pranzo':'colazione'}`;

/* Il messaggino in basso. Con "azione" diventa anche un modo per tornare
   indietro: resta su più a lungo, perché uno deve avere il tempo di
   accorgersi di aver sbagliato e di arrivarci col dito. */
function toast(msg,azione){
 const t=el('toast');
 t.innerHTML='';
 t.classList.toggle('conazione',!!azione);
 const s=document.createElement('span'); s.textContent=msg; t.appendChild(s);
 if(azione){
  const b=document.createElement('button');
  b.className='toast-az'; b.type='button'; b.textContent=azione.testo;
  b.onclick=()=>{ t.classList.remove('on','conazione'); clearTimeout(toast.t); azione.fai(); };
  t.appendChild(b);
 }
 t.classList.add('on');
 clearTimeout(toast.t);
 toast.t=setTimeout(()=>t.classList.remove('on','conazione'),azione?6000:2800);
}

/* forme sparse, posizionate a caso: ogni tessera è grande e le tessere sono di misure diverse,
   così la ripetizione non si legge. Il seme cambia a ogni apertura. */
function semeRnd(s){let a=s>>>0;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
 t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function disegnaOrto(f,x,y,s,rot,c,o){
 return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${rot.toFixed(0)}) scale(${(s/100).toFixed(3)}) translate(-50,-50)"`
  +` fill="${c}" fill-opacity="${o}">${ORTAGGI[f]||ORTAGGI.foglia}</g>`;
}
/* griglia sfalsata: una forma per cella, spostata a caso dentro la cella.
   Niente grumi, niente allineamenti: sparse ma distribuite. */
function tessera(w,h,seme,gruppi){
 const rnd=semeRnd(seme); let body='';
 gruppi.forEach(g=>{
  const cols=Math.max(1,Math.round(Math.sqrt(g.n*w/h)));
  const rows=Math.max(1,Math.ceil(g.n/cols));
  const cw=w/cols, ch=h/rows;
  let k=0;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
   if(k++>=g.n) continue;
   const s=g.min+rnd()*(g.max-g.min);
   const x=(c+.1+rnd()*.8)*cw, y=(r+.1+rnd()*.8)*ch;
   const rot=(rnd()-.5)*2*(g.rot||28);
   const f=g.forme[Math.floor(rnd()*g.forme.length)];
   for(const dx of [-w,0,w]) for(const dy of [-h,0,h]){
    const X=x+dx, Y=y+dy;
    if(X<-s||X>w+s||Y<-s||Y>h+s) continue;
    body+=disegnaOrto(f,X,Y,s,rot,g.c,g.o);
   }
  }
 });
 return `url("data:image/svg+xml,${encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${body}</svg>`)}")`;
}

/* ===================== i mirtilli del primo avvio =====================
   Stanno solo qui, nella pagina che si apre la prima volta: è l'unico
   momento in cui uno non sa ancora cosa farsene dell'app, e una cosa che
   risponde al dito dice "si tocca" meglio di qualunque frase. Dopo non
   servono più, e infatti spariscono.
   Stanno fermi quasi sempre, si alzano di cinque pixel ogni tre secondi e
   mezzo, e se li tocchi saltano. Tutto in transform e opacity. */
function stellaPath(r){
 /* il calice del mirtillo: cinque punte, come sulla bacca vera */
 const punte=[];
 for(let i=0;i<10;i++){
  const ang=-Math.PI/2 + i*Math.PI/5;
  const rr=i%2 ? r*0.46 : r;
  punte.push((Math.cos(ang)*rr).toFixed(2)+' '+(Math.sin(ang)*rr).toFixed(2));
 }
 return 'M'+punte.join(' L')+' Z';
}
const BACCHE=[[42,21],[100,15],[158,24],[214,16],[268,19]];

   Questi non si toccano: galleggiano piano, a profondità diverse, e

   Niente eventi, niente dito: pointer-events a zero e basta. */
const CORO=[
 /* x, y, raggio, opacità, durata, ritardo, quanto sale.
    Sparsi su tutta l'area e a profondità diverse: i piccoli e chiari
    stanno dietro, i grandi e pieni davanti. Durate tutte diverse e senza
    rapporti semplici fra loro, così non tornano mai in fila. */

 [262,224,27,.95,8.2,2.4,15],[120,252,19,.7,9.8,1.8,12],[34,214,13,.55,11.2,3,8],
 [176,302,31,.9,7.2,1.3,17],[292,298,16,.6,10.2,2.7,10],[66,314,21,.8,8.8,.3,13]
];
function coroHTML(){
 /* due gruppi annidati: quello fuori mette la bacca al suo posto, quello
    dentro si muove. Se metto tutto sullo stesso gruppo, la trasformazione
    del CSS cancella quella che la posiziona e finiscono tutte in un
    angolo: è successo, e dallo schermo sembrava che non ci fossero. */
 const bacche=CORO.map(([x,y,r,op,dur,rit,su])=>`
   <g transform="translate(${x},${y})" opacity="${op}">
    <g class="bacca-ferma" style="--dur:${dur}s;--rit:${rit}s;--su:${su}px">

       rx="${(r*0.34).toFixed(1)}" ry="${(r*0.22).toFixed(1)}" fill="#fff" opacity=".3"
       transform="rotate(-26)"/>
     <path class="stella" d="${stellaPath(r*0.3)}" transform="translate(0,${(-r*0.3).toFixed(1)})"/>
    </g>

 return `
 <div class="coro-sec" aria-hidden="true">
   <svg class="coro" viewBox="0 0 320 350" preserveAspectRatio="xMidYMid meet">

const BOSCO_DICE=['Oh.','Ancora?','Uno alla volta.','Ehi.','Va bene, mi muovo.','Fermo lì.','Ancora uno?'];
let boscoTocchi=new Set(), boscoFrase=0;
function toccaBacca(g){
 const i=+g.dataset.i;
 const svg=g.closest('svg'); if(!svg) return;
 const ombra=svg.querySelectorAll('.ombra-b')[i];
 salta(g,ombra,0);
 boscoTocchi.add(i);
 const dice=el('bosco-dice');
 if(boscoTocchi.size>=BACCHE.length){
  /* toccate tutte: un'onda da sinistra a destra, e si ricomincia */
  boscoTocchi.clear();
  svg.querySelectorAll('.bacca').forEach((b,n)=>{
   if(n===i) return;
   salta(b,svg.querySelectorAll('.ombra-b')[n],60+Math.abs(n-i)*70);
  });
  if(dice) dice.textContent='Tutti insieme, allora.';
 } else if(dice){
  dice.textContent=BOSCO_DICE[boscoFrase++ % BOSCO_DICE.length];
 }
}
function salta(g,ombra,ritardo){
 const parti=(e)=>{ if(!e) return;
  e.classList.remove('salta'); void e.offsetWidth; e.classList.add('salta');
  e.addEventListener('animationend',()=>e.classList.remove('salta'),{once:true}); };
 if(ritardo){ setTimeout(()=>{parti(g);parti(ombra);},ritardo); }
 else { parti(g); parti(ombra); }
}

function mealRow(di,slot,modo){
 const id=PLAN[di].meals[slot], r=id?R(id):null;
 const p=problemi().find(x=>x.di===di&&x.slot===slot);
 if(!r) return `<button class="meal empty" data-a="swap" data-d="${di}" data-s="${slot}">
   <span class="blob av" style="background:var(--surface-2)">${SLOTIC[slot]}</span>
   <span class="col grow"><span class="slot">${SLOTNAME[slot]}</span>
   <span class="name" style="color:var(--ink-3)">Aggiungi ${slot==='colazione'?'la colazione':'un piatto'}</span></span>
   <span class="go">＋</span></button>`;
 const ko=p&&S.shopped;
 const cucina = modo==='cucina';
 return `<button class="meal ${ko?'miss':''}" ${cucina

function famigliaIgnota(nome){
 const n=normalizza(nome||'');
 if(!n) return null;
 for(const [re,rap] of INDIZI) if(re.test(n)&&ING[rap]) return rap;
 return null;
}
/* gli do il parente: stessa unità di misura, stesso scaffale, e da quel
   momento vale per tutte le ricette che usano il parente */
function adottaFamiglia(k,nome){
 const i=ING[k]; if(!i) return null;
 const rap=famigliaIgnota(nome); if(!rap||rap===k) return null;
 const p=ING[rap];
 i.fam=rap;
 i.l=p.l;
 if(i.u!==p.u){ i.u=p.u; i.q=i.q>0?p.f:0; i.f=p.f; }
 if(!i.pr) i.pr=p.pr;
 _SOST=null;
 return rap;
}
let _SOST=null;
function sostituti(k){
 if(!_SOST){
  _SOST={};
  const lega=(a,b)=>{ if(a===b||!ING[a]||!ING[b]) return;
   if(ING[a].u!==ING[b].u) return;
   if(!(_SOST[a]||[]).includes(b)) (_SOST[a]=_SOST[a]||[]).push(b); };
  FAMIGLIE.forEach(g=>g.forEach(x=>{ if(!ING[x]) return; g.forEach(a=>lega(x,a)); }));
  /* e poi le cose che non conoscevo, attaccate al loro parente: così
     "Sugo alla boscaiola" vale come sugo pronto in tutte le ricette */
  Object.keys(ING).forEach(k=>{
   const rap=ING[k]&&ING[k].fam; if(!rap||!ING[rap]) return;
   lega(k,rap); lega(rap,k);
   (_SOST[rap]||[]).slice().forEach(altro=>{ lega(k,altro); lega(altro,k); });
  });
 }
 return _SOST[k]||[];
}

/* dove si usa una ricetta: lo ricavo da come è scritta, una volta sola */
const TIPI_MEMO={};
/* queste cose vogliono l'acqua bollente, comunque sia scritta la ricetta */
/* se c'è un grasso da scaldare o un sugo, c'è una padella */
const GRASSI=new Set(['olio','burro','ghee','panna','pannacucina','besciamella',
 'passata','pelati','sugopronto','concentrato','guanciale','pancetta','bacon','lardo']);
const BOLLITI=new Set(['pasta_mista','spaghetti','pasta_lunga','pastaintegrale',
 'pastasenzaglutine','pastina','lasagne','pastafresca','tortellini','gnocchi',
 'riso','risobasmati','risosushi','orzo','farro','polenta','couscous','quinoa',
 'bulgur','noodles','lenticchie','lenticchierosse','semola']);
function tipiRicetta(r){
 if(TIPI_MEMO[r.id]) return TIPI_MEMO[r.id];
 const nome=normalizza(r.n), tag=normalizza(r.tag||'');
 const grezzi=r.steps.join(' ');          /* con gradi e accenti: "180°" */
 const passi=normalizza(grezzi);
 const T=new Set();
 /* la cottura la dicono i passaggi, e solo le parole che vogliono dire
    davvero quella cosa: "olio a crudo" sta in mezzo a mille sughi cotti,
    e "zucchero" in mezzo a mille piatti salati. La prima versione di
    questa funzione ci cascava e faceva risultare la pasta al pomodoro
    un dolce crudo. */
 /* molte ricette non dicono "forno", dicono "180° per 35 minuti": il
    grado va cercato nel testo originale, perché normalizza() lo toglie */
 if(/forno|teglia|pirofila|gratin|grill/.test(passi)||/\d{3}\s?°/.test(grezzi)) T.add('forno');
 if(/padella|rosola|soffritt|saltat|trifolat|friggi|frittura|tegame/.test(passi)) T.add('padella');
 if(/lievit|impast|frolla|sfoglia/.test(passi)) T.add('lievitato');
 if(/lessa|bollore|brodo|zuppa|minestra|acqua salata|pentola/.test(passi)) T.add('bollito');
 const dolce = tag==='dolce'
   || /torta|crostata|biscott|budino|mousse|tiramisu|panna cotta|ciambell|muffin|plumcake|pancake|strudel|salame di cioccolato|crema pasticcera|zuppa inglese|creme caramel|bigne|frittelle|macedonia|gelato|affogato|crepes dolci|cioccolata calda|frullato|smoothie/.test(nome);
 T.add(dolce?'dolce':'salato');
 if(!dolce && (tag==='pranzo freddo'
   || /insalat|carpaccio|tartare|panino|tramezzin|bruschett|caprese|panzanella|hummus|tzatziki|poke|crudo/.test(nome)))
  T.add('crudo');
 /* i passaggi non dicono sempre "padella": "aglio in olio, togli l'aglio
    quando è biondo" è una padella, ma non la nomina. Allora guardo anche
    cosa c'è dentro, e in mancanza d'altro do per buone le due cotture
    normali: qualcosa che cuoce dieci minuti non si mangia crudo. */
 if(r.ing.some(([k])=>BOLLITI.has(k))) T.add('bollito');
 /* un grasso o un sugo vogliono dire che da qualche parte c'è una padella,
    anche quando i passaggi non la nominano ("gorgonzola sciolto nella
    panna a fuoco basso") */
 if(!T.has('crudo')&&r.ing.some(([k])=>GRASSI.has(k))) T.add('padella');
 if(!T.has('crudo')&&!T.has('forno')&&!T.has('padella')&&!T.has('bollito')){
  /* un dolce che non cuoce è un dolce al cucchiaio, non una padella */
  if(dolce) T.add('crudo');
  else if(r.min>=8){ T.add('padella'); T.add('bollito'); }
 }
 TIPI_MEMO[r.id]=T;
 return T;
}
/* lo scambio buono per QUESTA ricetta, se c'è */
function scambiPer(k,tipi){
 if(!tipi) return [];
 const buoni=SCAMBI.filter(x=>x.da===k&&ING[x.a]&&x.dove.some(d=>tipi.has(d)));
 /* se il piatto è un dolce vince la riga scritta per i dolci: il burro
    sostituito in una frolla non è come il burro sostituito in padella */
 if(tipi.has('dolce')){
  const perDolci=buoni.filter(x=>x.dove.includes('dolce'));
  const resto=buoni.filter(x=>!x.dove.includes('dolce'));
  return [...perDolci,...resto];
 }
 return buoni.filter(x=>!(x.dove.length===1&&x.dove[0]==='dolce'));
}
const notaScambio=(da,a)=>NOTE_SCAMBIO[da+'>'+a]||NOTE_SCAMBIO[a+'>'+da]||'';

function scegli(k,q,avere,usati,tipi){
 /* Se avete detto che una cosa non la mangiate, non ve la posso proporre
    di nascosto come sostituto: il piatto chiedeva olio, io ci metto il
    ghee, e il ghee è burro. L'ingrediente scritto nella ricetta resta,
    perché quella ricetta l'avete scelta voi; sono le alternative che
    devono rispettare le regole. */
 const no=vietati();
 const ammesso=id=>id===k||!no.includes(id);
 const basta=(id,qq)=>{const i=ING[id]; return i&&ammesso(id)&&(i.staple?avere(id)>0:avere(id)>=qq);};
 if(!usati[k]&&basta(k,q)) return {uso:k,q};
 /* 1. gli equivalenti: stessa cosa, stessa quantità */
 const alt=sostituti(k).filter(a=>!usati[a]&&ammesso(a));
 const pieno=alt.find(a=>basta(a,q));
 if(pieno) return {uso:pieno,q,nota:notaScambio(k,pieno)};
 /* 2. gli scambi che valgono in questa preparazione, con la loro proporzione */
 for(const x of scambiPer(k,tipi)){
  if(usati[x.a]||!ammesso(x.a)) continue;
  const qq=Math.round(q*x.q*10)/10;
  if(basta(x.a,qq)) return {uso:x.a,q:qq,nota:x.nota,prop:x.q};
 }
 /* 3. ne ho un po': meglio di niente */
 if(ING[k]&&avere(k)>0) return {uso:k,q};
 const parz=alt.find(a=>avere(a)>0);
 if(parz) return {uso:parz,q,nota:notaScambio(k,parz)};
 return {uso:k,q};
}
const altrimenti=k=>{ const visti=new Set(), no=vietati();
 return sostituti(k).filter(a=>{ if(!ING[a]||no.includes(a)) return false;
  const n=normalizza(ING[a].n); if(visti.has(n)) return false; visti.add(n); return true; }); };

function check(r,scale){
 const f=(scale||r.serv)/r.serv, miss=[],part=[],have=[],need=[],usati={};
 const avere=id=>ING[id]?ING[id].q:0;
 const tipi=tipiRicetta(r);
 r.ing.forEach(([k,q0])=>{
  const q=Math.round(q0*f*10)/10;
  const sc=scegli(k,q,avere,usati,tipi);
  const i=ING[sc.uso];
  /* q = quanto ne serve DAVVERO di quello che userai: con l'olio al posto
     del burro non sono gli stessi grammi */
  const v={k,uso:sc.uso,q:sc.q,chiesta:q,nota:sc.nota||'',prop:sc.prop||1};
  need.push(v);
  if(!i){miss.push(v);return;}
  usati[sc.uso]=1;
  if(i.staple&&i.q>0){have.push(v);return;}
  if(i.q<=0) miss.push(v); else if(i.q<v.q) part.push(v); else have.push(v);
 });
 return {miss,part,have,need,gap:miss.length+part.length,
   cambi:need.filter(v=>v.uso!==v.k)};
}
/* ===================== l'elenco delle ricette =====================
   Con centosettanta ricette i quattro bottoncini di prima non bastavano
   più: adesso c'è una ricerca e un pannello dei filtri che si apre
   dall'icona. I filtri si sommano fra loro, e sul bottone si vede sempre
   quanti ne hai accesi, perché il guaio dei filtri è dimenticarseli. */
const TEMPI=[[0,'Qualsiasi'],[15,'Fino a 15 min'],[30,'Fino a 30 min'],[60,'Fino a un’ora']];
const PREZZI=[[0,'Qualsiasi'],[1.5,'Fino a 1,50 €'],[2.5,'Fino a 2,50 €'],[4,'Fino a 4 €']];
const PASTI=[['','Tutti'],['colazione','☕ Colazione'],['pranzo','🍽️ Pranzo'],['cena','🌙 Cena']];
const DISPO=[['','Tutte'],['pronte','✓ Le puoi fare adesso'],['poco','Ti manca poco'],['manca','Serve la spesa']];
const ORDINI=[['dispensa','Quello che hai'],['tempo','Più svelte'],['prezzo','Più economiche'],['facili','Più facili'],['nome','Nome']];
function filtriAttivi(){
 const F=S.rfil;
 return (F.pasto?1:0)+(F.disp?1:0)+(F.tempo?1:0)+(F.diff?1:0)+(F.prezzo?1:0)+F.tag.length;
}
function ricetteFiltrate(){
 const F=S.rfil, q=(S.recQuery||'').trim().toLowerCase();
 const list=RECIPES.map(r=>({r,c:check(r)})).filter(({r,c})=>{
  if(q){
   const nome=r.n.toLowerCase().includes(q);
   /* cercare "tonno" deve trovare anche le ricette che lo usano */
   const dentro=r.ing.some(([k])=>ING[k]&&ING[k].n.toLowerCase().includes(q));
   if(!nome&&!dentro) return false;
  }
  if(F.pasto&&!r.slots.includes(F.pasto)) return false;
  if(F.disp==='pronte'&&c.gap) return false;
  if(F.disp==='poco'&&(!c.gap||c.gap>2)) return false;
  if(F.disp==='manca'&&c.gap<=2) return false;
  if(F.tempo&&r.min>F.tempo) return false;
  if(F.diff&&dOf(r)>F.diff) return false;
  if(F.prezzo&&perPorz(r)>F.prezzo) return false;
  if(F.tag.length&&!F.tag.includes(r.tag)) return false;
  return true;
 });
 const o=S.rfil.ordine||'dispensa';
 const perNome=(a,b)=>a.r.n.localeCompare(b.r.n,'it');
 list.sort(o==='tempo'?((a,b)=>a.r.min-b.r.min||perNome(a,b))
   :o==='prezzo'?((a,b)=>perPorz(a.r)-perPorz(b.r)||perNome(a,b))
   :o==='facili'?((a,b)=>dOf(a.r)-dOf(b.r)||a.r.min-b.r.min)
   :o==='nome'?perNome
   :((a,b)=>a.c.gap-b.c.gap||(abitudine(b.r)-abitudine(a.r))||perNome(a,b)));
 return list;
}

   <button class="btn wide ${c.gap?'':'dark'}" data-a="cooked" data-id="${r.id}" ${c.gap?'disabled':''}>

/* ===================== proposte ===================== */
/* Quanto è pronta una ricetta con quello che c'è in casa ADESSO.
   1 = la fai subito, 0 = manca tutto. Gli ingredienti che ci sono ma non
   bastano contano metà, perché un etto di parmigiano in meno non è come
   non avere il pollo. Questo numero viene prima di ogni altra cosa quando
   devo consigliare: una ricetta che ti fa uscire a fare la spesa non è un
   consiglio, è un compito. */
function pronta(r,scale){
 const c=check(r,scale), n=r.ing.length||1;
 return (c.have.length+c.part.length*0.5)/n;
}
const cucinabile=(r,scale)=>check(r,scale).gap===0;
/* l'ordine dei consigli: prima quelle che puoi fare, poi quelle a cui manca
   poco, e a pari condizioni quelle con dentro le cose che usi di più */
const perConsiglio=(a,b)=>
 (cucinabile(b)-cucinabile(a)) || (pronta(b)-pronta(a)) || (abitudine(b)-abitudine(a));

/* I contorni e i dolci stanno nell'elenco delle ricette come tutto il resto,
   ma non sono un pasto: se li propongo per la cena di martedì ti ritrovi nel
   piano "patate arrosto" e basta. */
const piatto=r=>!r.extra;
function candidati(){
 const usate=new Set(); PLAN.forEach(d=>SLOTS.forEach(s=>d.meals[s]&&usate.add(d.meals[s])));
 return RECIPES.filter(r=>{
  if(r.slots.includes('colazione')) return false;
  if(!piatto(r)) return false;
  if(vietata(r)) return false;
  if(usate.has(r.id)) return false;
  if(perPorz(r)>S.budget*1.25) return false;
  if(dOf(r)>S.diffMax) return false;
  if(r.ing.some(([k])=>ING[k]&&ING[k].only&&ING[k].only!==S.store)) return false;
  return true;
 }).sort(perConsiglio);
}
function esclusi(){
 return RECIPES.filter(r=>!r.slots.includes('colazione') &&
   (perPorz(r)>S.budget*1.25 || dOf(r)>S.diffMax ||
    r.ing.some(([k])=>ING[k]&&ING[k].only&&ING[k].only!==S.store)));
}
function abitudine(r){
 const n=r.ing.filter(([k])=>ING[k]&&ING[k].fav).length;
 return n/r.ing.length;
}
function perche(r){
 const fav=r.ing.filter(([k])=>ING[k]&&ING[k].fav).map(([k])=>ING[k].n.toLowerCase());
 const incasa=r.ing.filter(([k])=>ING[k]&&ING[k].q>0).length;
 if(fav.length>=2) return `Usi spesso ${fav.slice(0,2).join(' e ')}, e ${incasa} ingredienti ce li hai già.`;
 if(perPorz(r)<=2) return `Costa ${eur(perPorz(r))} a porzione: ben sotto il tuo budget.`;
 return `${incasa} ingredienti su ${r.ing.length} sono già in dispensa.`;
}
function slotLiberi(){
 const out=[];
 PLAN.forEach((d,i)=>['pranzo','cena'].forEach(s=>{if(!d.meals[s]) out.push({i,s});}));
 return out;
}

function proposteSlot(di,slot){
 const attuale=PLAN[di].meals[slot];
 const usate=new Set(); PLAN.forEach(d=>SLOTS.forEach(s=>d.meals[s]&&usate.add(d.meals[s])));
 const ok=r=>perPorz(r)<=S.budget*1.6 && dOf(r)<=S.diffMax && !vietata(r)
   && !r.ing.some(([k])=>ING[k]&&ING[k].only&&ING[k].only!==S.store);
 let pool=RECIPES.filter(r=>r.slots.includes(slot)&&r.id!==attuale&&piatto(r)&&ok(r));
 if(!pool.length) pool=RECIPES.filter(r=>r.slots.includes(slot)&&r.id!==attuale&&piatto(r));
 pool.sort((a,b)=>(usate.has(a.id)-usate.has(b.id))||perConsiglio(a,b));
 const from=S.screen;
 closeSheet();
 S.prop={mode:'slot',di,slot,pool,i:0,accepted:[],rejected:[],step:'deck',from};
 S.screen='proposte'; render();
}

/* ===================== spesa inserita a mano =====================
   Per quando lo scontrino non c'è: si spunta quello che si è preso
   dalla lista, si aggiusta il numero di confezioni, si aggiunge il resto. */
function apriManuale(){
 const sel={};
 listaSpesa().forEach(r=>{
  const i=ING[r.k]; if(!i){ sel[r.k]=1; return; }
  /* un suggerimento, non una regola: la quantità la scrivete voi */
  sel[r.k]=aPezzi(r.k)?Math.max(1,Math.round(r.conf||1))
                      :Math.round(i.f*(r.conf||1)*10)/10;
 });
 S.man={sel,q:'',u:{}}; S.screen='manuale'; render();
}
function unitaManuale(k){
 S.man.u=S.man.u||{};
 return S.man.u[k]||(aPezzi(k)?unitaPezzo(k):ING[k].u);
}
function rigaManuale(k){
 const i=ING[k], c=S.man.sel[k]||0, preso=c>0;

 /* se si conta a pezzi puoi dire "2" invece di "250 g": l'unità si cambia

 const doppia=aPezzi(k)&&(i.u==='g'||i.u==='ml');
 return `<div class="sitem ingr" style="${preso?'':'opacity:.5'}">
   <button class="tile av-sm" data-a="mtog" data-id="${k}" aria-label="${preso?'Togli':'Metti'} ${esc(i.n)}">${i.e}</button>

       aria-label="Quantità di ${esc(i.n)}">
     ${u==='pz'?`<button class="passo" data-a="mq-passo" data-id="${k}" data-d="1"
       aria-label="Uno in più">+</button>`:''}

       aria-label="Cambia unità, ora ${u}">${esc(u)} ⇄</button>`:`<b>${esc(u)}</b>`}
   </span>

}

/* quanto propongo quando tocchi un prodotto: un pezzo se si conta, la
   confezione solita se si pesa. Resta solo una proposta: il numero è tuo. */
function propostaManuale(k){
 const i=ING[k]; if(!i) return 1;
 if(aPezzi(k)) return 1;           /* si conta a pezzi: uno, poi aggiusti */
 return confezione(k);             /* una confezione, non la dispensa piena */
}
function aggiornaTotaleManuale(){
 const n=Object.keys(S.man.sel).filter(k=>S.man.sel[k]>0).length;
 const b=document.querySelector('[data-a="mok"]');
 if(b){ b.disabled=!n;
  b.textContent=n?`Metti in dispensa · ${n} cos${n===1?'a':'e'}`:'Metti in dispensa'; }
}
function applicaManuale(){
 let n=0;
 Object.keys(S.man.sel).forEach(k=>{
  const q=S.man.sel[k], i=ING[k];
  if(!q||!i) return;
  i.q=Math.round((i.q+inUnita(k,q,unitaManuale(k)))*10)/10;
  i.f=Math.max(i.f,i.q); i.visto=1;
  if(i.exp!==undefined) i.exp=Math.max(i.exp,7);
  delete S.checked[k];
  S.extra=S.extra.filter(x=>x!==k);
  n++;
 });
 S.ultima={store:'Segnata a mano', data:oggiCorto(), righe:n, tot:0};
 S.shopped=true; S.added=n; S.man={sel:{},q:'',u:{}}; salva();
 S.screen='dispensa'; render();
 toast(`${n} cos${n===1?'a messa':'e messe'} in dispensa`);
}


/* ===================== primo avvio =====================

   Sette domande, una per schermata, una riga ciascuna. Prima c'era un
   occhiello, un titolo, una spiegazione e spesso anche un riquadro che
   diceva di nuovo la stessa cosa: chi apre un'app per la prima volta non
   legge, guarda. Quindi resta la domanda e le risposte da toccare. */

 const p=PASSI[S.onb.passo]||'via';
 const avanti=(testo='Avanti →')=>`<button class="btn primary wide" data-a="onb-avanti"

 const barra=`<div class="flow" style="margin:6px 0 22px">${PASSI.map((_,i)=>
