<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mirtillo</title>
<meta name="description" content="La dispensa, le ricette e la spesa, sempre in tasca.">
<meta name="theme-color" content="#F2F8FF">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icona-192.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mirtillo">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: colonna singola da 480px, header morbido e tab bar fissa in basso.
   Niente angoli vivi: raggi larghi, bolle organiche per le emoji, ombre diffuse. Solo tema chiaro. */
:root{
  color-scheme: light;
  --verde:#2A7BE4;        /* principale / CTA */
  --verde-scuro:#102A4C;  /* titoli ed elementi scuri */
  --crema:#F2F8FF;        /* fondo */
  --salvia:#D8E9FB;       /* card e sezioni secondarie */
  --nero:#102A4C;         /* testo */
  --terra:#FFA64D;        /* accenti e dettagli */
  --ambra:#F2711C;        /* accento forte */
  /* derivati */
  --su-verde:#FFFFFF;
  /* "ok" è separato dal brand: così il principale può essere di qualsiasi colore
     senza che una scorta piena sembri un allarme */
  --ok:#2F9158; --ok-su:#FFFFFF;
  --mirtillo:#4A56B5;      /* le bacche piene della difficoltà */
  --surface:#FFFFFF; --surface-2:#E6EFF9;
  --ink:#102A4C; --ink-2:#42587A; --ink-3:#8699B2;
  --line:#DCE7F3; --line-strong:#102A4C;
  --verde-bg:#DAF0E2; --verde-ink:#1F7045;
  --terra-bg:#FFEDD8; --terra-ink:#9A5410;
  --alert:#C2560D; --alert-bg:#FEE3CC;
  --salvia-soft:#E9F2FC;
  /* tutto il colore passa da qui: cambiare questo blocco cambia l'app intera */
  --ombra:20,60,110;
  --ombra-scura:16,42,76;
  --verde-rgb:42,123,228;
  --crema-rgb:242,248,255;
  --menu-bg:rgba(255,255,255,.86);
  --velo:rgba(16,42,76,.46);
  --fuori:#E2EDF8;
  --bordo-ingr:#CFE2F5; --box-ingr:#B9D6F0; --ingr-on:#E2F0FB;
  --pat-c1:#6FA8E0; --pat-c2:#E8B35A; --pat-c3:#8FB47A; --pat-c4:#4F8FD6;
  --pat-o1:.14; --pat-o2:.12; --pat-o3:.11; --pat-o4:.09;
  --shadow:0 8px 22px rgba(var(--ombra),.13);
  --shadow-sm:0 4px 14px rgba(var(--ombra),.10);
  --r-xl:32px; --r-lg:26px; --r-md:20px; --r-sm:16px;
  --blob:58% 42% 45% 55% / 48% 56% 44% 52%;
  --blob2:45% 55% 60% 40% / 55% 45% 55% 45%;
  /* forme larghe: stesso spirito del blob, ma per blocchi bassi e larghi */
  --blob-w:72px 44px 60px 52px / 46% 55% 45% 54%;
  --blob-w2:44px 72px 52px 60px / 55% 46% 54% 45%;
  --blob-t:54px 34px 46px 40px / 44px 58px 36px 52px;
  --blob-s:34px 16px 28px 20px / 24px 32px 18px 30px;
  --blob-s2:16px 34px 20px 28px / 32px 20px 30px 22px;
  --blob-s3:30px 24px 16px 32px / 28px 16px 32px 22px;
  /* festone: una fila di gobbe, usata sul bordo basso della fascia spesa */
  --onda:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='40'%20height='13'%20viewBox='0%200%2040%2013'%20preserveAspectRatio='none'%3E%3Cellipse%20cx='20'%20cy='0'%20rx='20'%20ry='13'%20fill='%23000'/%3E%3C/svg%3E");
  /* i pattern veri li genera lo script: forme sparse, mai la stessa griglia */
  --font-display:'Baloo 2','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{background-color:var(--crema);
  color:var(--ink);font-family:var(--font-body);font-weight:600;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--crema)}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:800;margin:0;letter-spacing:-.01em;
  color:var(--verde-scuro);text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- guscio ---------- */
/* il pattern sta qui, non su body: così scorre insieme al contenuto */
.app{max-width:480px;margin:0 auto;background-image:var(--pat-bg);
  min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  padding-top:calc(22px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
/* ---------- mattoni ---------- */
.card{background-color:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.soft{background-color:var(--salvia);border-radius:var(--r-lg)}
.sec{margin-block:24px 0}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.sec-h h2{font-size:20px}
.sec-h span{font-size:12.5px;color:var(--ink-3);font-weight:700}
.sec-h .more{margin-left:auto;font-size:13px;font-weight:800;color:var(--verde-ink)}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.muted{color:var(--ink-3);font-size:13px;font-weight:700}
.small{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;border-radius:99px;
  padding:5px 10px;max-width:100%;text-align:left;overflow-wrap:anywhere}
.pill.ok{background:var(--verde-bg);color:var(--verde-ink)}
.pill.warn{background:var(--terra-bg);color:var(--terra-ink)}
.pill.bad{background:var(--alert-bg);color:var(--alert)}
.pill.flat{background:var(--surface-2);color:var(--ink-2)}
.pill.dark{background:var(--verde-scuro);color:var(--crema)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-display);
  font-weight:800;font-size:16px;padding:14px 20px;border-radius:99px;background:var(--surface-2);
  color:var(--verde-scuro);transition:transform .1s,filter .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--verde);color:var(--su-verde);box-shadow:0 5px 16px rgba(var(--verde-rgb),.42)}
.btn.dark{background:var(--verde-scuro);color:var(--crema)}
.btn.terra{background:var(--terra);color:var(--verde-scuro)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.btn.wide{width:100%}
.btn.sm{font-size:14px;padding:10px 15px}
.btn[disabled]{opacity:.4;pointer-events:none}
.blob{flex:0 0 auto;display:grid;place-items:center;border-radius:var(--blob);background:var(--salvia-soft)}
.blob.b2{border-radius:var(--blob2)}
.av{width:52px;height:52px;font-size:28px}
.av-sm{width:42px;height:42px;font-size:22px}
.av-lg{width:76px;height:76px;font-size:42px}
.bar{height:9px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.bar.warn i{background:var(--terra)} .bar.bad i{background:var(--ambra)}
/* difficoltà: cinque mirtilli, pieni fino al livello della ricetta */
.diff{display:inline-flex;align-items:center;gap:3px}
.diff i{width:12px;height:12px;display:block;color:rgba(var(--ombra),.22)}
.diff i svg{width:100%;height:100%;display:block;fill:currentColor}
.diff i svg path{fill:rgba(255,255,255,.55)}
.diff i.on{color:var(--mirtillo)}
.diff b{margin-left:6px;font-size:11.5px;font-weight:800;color:var(--ink-2)}
.diff.big{gap:3.5px}
.diff.big i{width:14px;height:14px}
.diff.big b{font-size:12.5px;margin-left:7px}
.scroller{display:flex;gap:12px;overflow-x:auto;padding-block:4px 10px;scroll-snap-type:x mandatory;
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px));
  /* senza questo lo snap allinea la prima card al bordo dello schermo
     e si mangia il padding di sinistra */
  scroll-padding-inline:max(16px,env(safe-area-inset-left,0px))}
.scroller>*{scroll-snap-align:start}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px 10px;
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px))}
.chip{flex:0 0 auto;font-size:13.5px;font-weight:800;padding:9px 15px;border-radius:99px;
  background:var(--surface-2);color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--verde-scuro);color:var(--crema)}
.chip[aria-pressed="true"] .diff i{color:rgba(255,255,255,.34)}
.chip[aria-pressed="true"] .diff i.on{color:#8E97E8}
.chip[aria-pressed="true"] i.on{background:var(--terra)}

/* ---------- fascia scadenza spesa ---------- */
.band{position:relative;overflow:hidden;padding:19px 22px 29px;margin-top:4px;
  border-radius:22px 22px 4px 4px;
  -webkit-mask-image:linear-gradient(#000,#000),var(--onda);
  mask-image:linear-gradient(#000,#000),var(--onda);
  -webkit-mask-size:100% calc(100% - 14px),14.2857% 15px;
  mask-size:100% calc(100% - 14px),14.2857% 15px;
  -webkit-mask-position:top left,bottom left;
  mask-position:top left,bottom left;
  -webkit-mask-repeat:no-repeat,repeat-x;
  mask-repeat:no-repeat,repeat-x}
.band .big{position:absolute;right:-8px;bottom:-6px;font-size:92px;opacity:.35;transform:rotate(-8deg);pointer-events:none}
.band h3{font-size:19px;line-height:1.2;max-width:72%}
.band.urgent{background-color:var(--terra-bg)}
.days{display:flex;gap:5px;margin-top:12px;max-width:78%}
.days i{flex:1;height:10px;border-radius:99px;background:#FFFFFF9E}
.days i.on{background:var(--verde-scuro)}
.days i.today{background:var(--ambra)}

/* ---------- home ---------- */
.hello{font-size:28px;line-height:1.14;margin-bottom:2px}
.meal{display:flex;align-items:center;gap:13px;padding:13px 14px;width:100%;text-align:left;
  border-radius:var(--r-lg);background-color:var(--surface);
  box-shadow:var(--shadow-sm);margin-bottom:10px}
.meal .slot{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
.meal .name{font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.15;color:var(--verde-scuro)}
.meal .meta{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.meal .go{width:34px;height:34px;flex:0 0 auto;border-radius:50%;background:var(--surface-2);
  display:grid;place-items:center;font-size:15px;color:var(--ink-2)}
.meal.empty{background:transparent;box-shadow:none;border:2px dashed var(--line);color:var(--ink-3)}
.meal.miss{background-color:var(--alert-bg);background-image:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{padding:15px 8px 16px;border-radius:var(--blob-s);text-align:center;background-color:var(--salvia)}
.stat:nth-child(2){border-radius:var(--blob-s2)}
.stat:nth-child(3){border-radius:var(--blob-s3)}
.stat .ic{display:block;font-size:30px;line-height:1;font-style:normal;margin-bottom:5px}
.stat b{display:block;font-family:var(--font-display);font-size:23px;line-height:1.1;color:var(--verde-scuro)}
.stat span{font-size:11px;font-weight:800;line-height:1.25;display:block;margin-top:1px;color:var(--ink-2)}
.rcard{flex:0 0 216px;padding:15px;display:flex;flex-direction:column;gap:9px;text-align:left}
.rcard .thumb{height:104px;border-radius:var(--blob2);display:grid;place-items:center;font-size:58px;
  background-color:var(--salvia-soft)}
.rcard h4{font-size:16.5px;line-height:1.2}

/* ---------- piano ---------- */
.day{padding:4px 0 2px;margin-bottom:18px;scroll-margin-top:78px}
.day-h{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.day-h h3{font-size:16px;text-transform:capitalize}
.day-h .tag{font-size:11px;font-weight:800;color:var(--crema);background:var(--verde-scuro);
  border-radius:99px;padding:3px 10px}
.alert{padding:18px 26px;background-color:var(--alert-bg);border-radius:var(--blob-w2);margin-top:4px}
.alert h3{color:var(--alert)}
/* calendario della settimana */
.cal{display:flex;gap:6px;overflow-x:auto;padding-block:4px 10px;
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px))}
.calday{flex:1 0 44px;min-width:44px;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:9px 4px 9px;border-radius:19px;background-color:var(--surface);box-shadow:var(--shadow-sm)}
.calday .dow{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3)}
.calday .dnum{font-family:var(--font-display);font-size:18px;line-height:1;color:var(--verde-scuro)}
.calday.today{background-color:var(--verde-scuro)}
.calday.sel{box-shadow:0 0 0 2.5px var(--verde), var(--shadow-sm)}
.piano-list{position:relative;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.piano-inner{background-image:var(--pat-bg);padding-bottom:132px}
body.no-pad .app{padding-bottom:0;background-image:none}
.calday.today .dow{color:#FFFFFFA6}
.calday.today .dnum{color:var(--crema)}
.dot{width:7px;height:7px;border-radius:50%;background:transparent;display:block;flex:0 0 auto}
.dot.ko{background:var(--ambra)}
.dot.free{background:var(--salvia)}
.calday.today .dot.free{background:#FFFFFF59}
.callegend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;font-weight:800;color:var(--ink-3);
  margin:-2px 0 18px}
.callegend span{display:flex;align-items:center;gap:6px}
.callegend .dot{width:9px;height:9px}

/* ---------- dispensa ---------- */
/* la ricerca resta attaccata in alto mentre scorri la dispensa */
.searchbar{position:sticky;top:0;z-index:28;
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-left,0px)) 12px;
  background:rgba(var(--crema-rgb),.84);
  -webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3)}
.search{display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:99px;
  background-color:var(--surface);box-shadow:var(--shadow-sm)}
.search input{border:0;background:none;outline:none;width:100%;font-weight:700;font-size:15px}
.search input::placeholder{color:var(--ink-3)}
.group-h{display:flex;align-items:center;gap:9px;margin:22px 0 10px}
.group-h h3{font-size:16px}
.group-h .count{font-size:12px;font-weight:800;color:var(--ink-2);background:var(--surface-2);
  border-radius:99px;padding:3px 10px}
.inv{display:flex;flex-direction:column;gap:10px}
.item{padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.item .name{font-family:var(--font-display);font-weight:700;font-size:16.5px;line-height:1.15;color:var(--verde-scuro)}
.item .meta{display:flex;align-items:center;gap:7px;margin-top:3px;flex-wrap:wrap}
.item .qty{font-size:13px;font-weight:800;color:var(--ink-2)}
.item.out{opacity:.7}
.item .bar{margin-top:8px}

/* ---------- ricetta ---------- */
.rhero{padding:20px 24px;display:flex;gap:15px;align-items:center;border-radius:var(--blob-w)}
.stepper{display:flex;align-items:center;gap:4px;border-radius:99px;background:var(--surface-2);padding:4px}
.stepper button{width:36px;height:36px;border-radius:50%;background:var(--surface);
  font-size:19px;font-weight:800;display:grid;place-items:center;color:var(--verde-scuro)}
.stepper b{min-width:58px;text-align:center;font-family:var(--font-display);font-size:15px}
/* versione compatta, per le righe della spesa a mano */
.stepper.sm{padding:3px;gap:2px}
.stepper.sm button{width:30px;height:30px;font-size:17px}
.stepper.sm b{min-width:24px;font-size:14px}
.ing{display:flex;align-items:center;gap:12px;padding:11px 0}
.ing+.ing{border-top:1.5px solid var(--line)}
.tick{width:28px;height:28px;flex:0 0 auto;border-radius:var(--blob2);display:grid;place-items:center;
  font-size:14px;font-weight:800}
.tick.y{background:var(--ok);color:var(--ok-su)}
.tick.n{background:var(--alert);color:#fff}
.tick.p{background:var(--terra);color:var(--verde-scuro)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:13px;margin-top:4px;padding:0}
.steps li{list-style:none;display:flex;gap:12px;font-size:14.5px;font-weight:600;line-height:1.55;color:var(--ink-2)}
.steps li::before{counter-increment:s;content:counter(s);flex:0 0 auto;width:28px;height:28px;
  border-radius:var(--blob);background:var(--salvia);color:var(--verde-scuro);
  font-family:var(--font-display);font-size:14px;display:grid;place-items:center}

/* ---------- proposte ---------- */
.deck{padding:24px 20px 20px;text-align:center;position:relative;overflow:hidden;
  border-radius:var(--blob-t)}
.deck .thumb{width:118px;height:118px;margin:0 auto 12px;font-size:64px}
.deck h2{font-size:25px;line-height:1.15}
.deck .ings{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 4px}
.deck .why{background:var(--salvia-soft);border-radius:var(--r-md);padding:11px 13px;margin-top:14px;
  font-size:13px;font-weight:700;color:var(--ink-2);text-align:left;display:flex;gap:9px;align-items:flex-start}
.facts{display:flex;justify-content:center;gap:9px;margin-top:10px;flex-wrap:wrap}
.fact{background:var(--surface-2);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:800;
  color:var(--verde-scuro)}
.swipe{display:flex;gap:14px;justify-content:center;margin-top:18px}
.swipe button{width:72px;height:72px;border-radius:var(--blob);font-size:30px;display:grid;place-items:center;
  box-shadow:var(--shadow);transition:transform .1s}
.swipe button:active{transform:scale(.93)}
.swipe .no{background:var(--surface);color:var(--alert)}
.swipe .si{background:var(--ok);color:var(--ok-su)}
.rng{width:100%;accent-color:var(--verde-scuro);height:30px}

/* ---------- spesa ---------- */
.sitem{padding:12px 14px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.box{width:28px;height:28px;flex:0 0 auto;border-radius:var(--blob2);background:var(--surface-2);
  display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--verde-scuro)}
.sitem[aria-pressed="true"] .box{background:var(--ok);color:var(--ok-su)}
.sitem[aria-pressed="true"] .name{text-decoration:line-through;color:var(--ink-3)}
.why{font-size:12px;font-weight:700;color:var(--verde-ink)}
.budget{padding:16px}
.budget .num{font-family:var(--font-display);font-size:30px;line-height:1;color:var(--verde-scuro)}

/* ---------- scontrino ---------- */
.flow{display:flex;gap:6px;margin-block:6px 16px}
.flow i{flex:1;height:7px;border-radius:99px;background:var(--surface-2)}
.flow i.on{background:var(--verde)}
.drop{padding:32px 22px;text-align:center;border-radius:var(--blob-t)}
.drop .ic{font-size:70px}
.scan{position:relative;height:230px;border-radius:var(--r-lg);background:var(--surface-2);
  overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:18px 20px}
.scan .l{height:9px;border-radius:99px;background:#FFFFFFB0}
.scan .beam{position:absolute;left:0;right:0;height:60px;
  background:linear-gradient(180deg,transparent,rgba(var(--verde-rgb),.6),transparent);animation:beam 1.5s linear infinite}
@keyframes beam{0%{top:-62px}100%{top:232px}}
.scan img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pline{padding:12px 14px;display:flex;align-items:flex-start;gap:11px}
.pline .raw{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;font-weight:700;
  color:var(--ink-3);letter-spacing:-.02em;word-break:break-word}

.field{display:flex;flex-direction:column;gap:7px;margin-bottom:13px}

.ingrow{display:grid;grid-template-columns:1fr 68px 78px 34px;gap:7px;align-items:center;margin-bottom:8px}
.ingrow input,.ingrow select{padding:10px 12px;font-size:14px;border-radius:14px;background:var(--surface);

.ingnote{font-size:11.5px;font-weight:800;margin:-4px 0 10px 4px}

.feas{position:sticky;bottom:calc(124px + env(safe-area-inset-bottom,0px));padding:14px 16px}

/* simula il piano consumando la dispensa giorno per giorno */
function simula(){
 const sim={}; Object.keys(ING).forEach(k=>sim[k]=ING[k].q);
 const out=[];
 PLAN.forEach((d,di)=>SLOTS.forEach(slot=>{
  const id=d.meals[slot]; if(!id) return;
  const r=R(id); if(!r) return;
  const manca=[], f=fattore();
  r.ing.forEach(([k,q0])=>{
   const q=Math.round(q0*f*10)/10, i=ING[k];
   if(!i){manca.push([k,q]);return;}
   if(i.staple) return;
   if((sim[k]||0)<q) manca.push([k, Math.round((q-(sim[k]||0))*10)/10]);
  });
  r.ing.forEach(([k,q0])=>{const i=ING[k];
   if(i&&!i.staple) sim[k]=Math.max(0,(sim[k]||0)-q0*f);});
  out.push({di,slot,r,manca});
 }));
 return out;
}
function copertura(){
 const s=simula();
 const primo=s.find(m=>m.manca.length);
 return {giorni: primo?primo.di:PLAN.length, primo};
}

function disegnaOrto(f,x,y,s,rot,c,o){
 return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${rot.toFixed(0)}) scale(${(s/100).toFixed(3)}) translate(-50,-50)"`
  +` fill="${c}" fill-opacity="${o}">${ORTAGGI[f]||ORTAGGI.foglia}</g>`;
}
/* griglia sfalsata: una forma per cella, spostata a caso dentro la cella.
   Niente grumi, niente allineamenti: sparse ma distribuite. */
function tessera(w,h,seme,gruppi){
 const rnd=semeRnd(seme); let body='';
 gruppi.forEach(g=>{
  const cols=Math.max(1,Math.round(Math.sqrt(g.n*w/h)));
  const rows=Math.max(1,Math.ceil(g.n/cols));
  const cw=w/cols, ch=h/rows;
  let k=0;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
   if(k++>=g.n) continue;
   const s=g.min+rnd()*(g.max-g.min);
   const x=(c+.1+rnd()*.8)*cw, y=(r+.1+rnd()*.8)*ch;
   const rot=(rnd()-.5)*2*(g.rot||28);
   const f=g.forme[Math.floor(rnd()*g.forme.length)];
   for(const dx of [-w,0,w]) for(const dy of [-h,0,h]){
    const X=x+dx, Y=y+dy;
    if(X<-s||X>w+s||Y<-s||Y>h+s) continue;
    body+=disegnaOrto(f,X,Y,s,rot,g.c,g.o);
   }
  }
 });
 return `url("data:image/svg+xml,${encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${body}</svg>`)}")`;
}

function check(r,scale){
 const f=(scale||r.serv)/r.serv, miss=[],part=[],have=[];
 r.ing.forEach(([k,q0])=>{
  const q=Math.round(q0*f*10)/10, i=ING[k];
  if(!i){miss.push({k,q});return;}
  if(i.staple&&i.q>0){have.push({k,q});return;}
  if(i.q<=0) miss.push({k,q}); else if(i.q<q) part.push({k,q}); else have.push({k,q});
 });
 return {miss,part,have,gap:miss.length+part.length,
   need:r.ing.map(([k,q])=>({k,q:Math.round(q*f*10)/10}))};
}

/* ===================== proposte ===================== */
function candidati(){
 const usate=new Set(); PLAN.forEach(d=>SLOTS.forEach(s=>d.meals[s]&&usate.add(d.meals[s])));
 return RECIPES.filter(r=>{
  if(r.slots.includes('colazione')) return false;
  if(vietata(r)) return false;
  if(usate.has(r.id)) return false;
  if(perPorz(r)>S.budget*1.25) return false;
  if(dOf(r)>S.diffMax) return false;
  if(r.ing.some(([k])=>ING[k]&&ING[k].only&&ING[k].only!==S.store)) return false;
  return true;
 }).sort((a,b)=>abitudine(b)-abitudine(a));
}
function esclusi(){
 return RECIPES.filter(r=>!r.slots.includes('colazione') &&
   (perPorz(r)>S.budget*1.25 || dOf(r)>S.diffMax ||
    r.ing.some(([k])=>ING[k]&&ING[k].only&&ING[k].only!==S.store)));
}
function abitudine(r){
 const n=r.ing.filter(([k])=>ING[k]&&ING[k].fav).length;
 return n/r.ing.length;
}
function perche(r){

function proposteSlot(di,slot){
 const attuale=PLAN[di].meals[slot];
 const usate=new Set(); PLAN.forEach(d=>SLOTS.forEach(s=>d.meals[s]&&usate.add(d.meals[s])));
 const ok=r=>perPorz(r)<=S.budget*1.6 && dOf(r)<=S.diffMax && !vietata(r)
   && !r.ing.some(([k])=>ING[k]&&ING[k].only&&ING[k].only!==S.store);
 let pool=RECIPES.filter(r=>r.slots.includes(slot)&&r.id!==attuale&&ok(r));
 if(!pool.length) pool=RECIPES.filter(r=>r.slots.includes(slot)&&r.id!==attuale);
 pool.sort((a,b)=>(usate.has(a.id)-usate.has(b.id))||(abitudine(b)-abitudine(a)));
 const from=S.screen;
 closeSheet();
 S.prop={mode:'slot',di,slot,pool,i:0,accepted:[],rejected:[],step:'deck',from};
 S.screen='proposte'; render();
}

function applicaManuale(){
 let n=0;
 Object.keys(S.man.sel).forEach(k=>{
  const c=S.man.sel[k], i=ING[k];
  if(!c||!i) return;
  const q=Math.round(i.f*c*10)/10;
  i.q=Math.round((i.q+q)*10)/10;
  i.f=Math.max(i.f,i.q);
  if(i.exp!==undefined) i.exp=Math.max(i.exp,7);
  delete S.checked[k];
  S.extra=S.extra.filter(x=>x!==k);
  n++;
 });
 S.shopped=true; S.added=n; S.man={sel:{},q:''};
 S.screen='dispensa'; render();
 toast(`${n} cos${n===1?'a messa':'e messe'} in dispensa`);
}

   tipiche, si cerca l'ingrediente più somigliante e si scarta tutto il resto:

 prezzem:'prezzemolo',rosmar:'rosmarino',basil:'basilico',

 /^cod\./i,/^data\b/i,/^ora\b/i,/^n\.?\s?scontr/i,/^fidelity/i,/^tessera/i,
 /^euro$/i,/^€/,/^servizio/i,/^reparto/i,/^art\.\s?\d/i,/^cliente/i,/^via\b/i,

const ALIAS={uova:['uova','uovo'],latte:['latte'],yogurt:['yogurt','yoghurt'],

  .flatMap(g=>GRUPPI[g]?GRUPPI[g].k:[]);
function vietata(r){
 const no=vietati(); if(!no.length) return false;
 return r.ing.some(([k])=>no.includes(k));
}

const senzaAccenti=t=>t.normalize('NFD').replace(/[̀-ͯ]/g,'');
function normalizza(t){
 return senzaAccenti(String(t||'').toLowerCase())
  .replace(/[^a-z0-9,.\s\/x-]/g,' ').replace(/\s+/g,' ').trim();
}
/* distanza di Levenshtein, per reggere gli errori di lettura (RISQ per RISO) */
function lev(a,b){
 if(a===b) return 0;
 const m=a.length,n=b.length;
 if(!m||!n) return m||n;
 let pre=new Array(n+1), cur=new Array(n+1);
 for(let j=0;j<=n;j++) pre[j]=j;
 for(let i=1;i<=m;i++){
  cur[0]=i;
  for(let j=1;j<=n;j++){
   cur[j]=Math.min(pre[j]+1, cur[j-1]+1, pre[j-1]+(a[i-1]===b[j-1]?0:1));
  }
  const t=pre; pre=cur; cur=t;
 }
 return pre[n];
}
const somiglianza=(a,b)=>{const L=Math.max(a.length,b.length); return L?1-lev(a,b)/L:0;};

/* una parola abbreviata vale la sua versione lunga */
function espandi(parola){
 if(ABBREV[parola]) return ABBREV[parola];
 if(parola.length>=4){
  for(const k in ABBREV) if(k.length>=4 && parola.startsWith(k)) return ABBREV[k];
 }
 return parola;
}

/* quantità: x2, 500g, 1,5 kg, 0,610 (peso in kg), 1lt */
function leggiQuantita(testo){
 const t=normalizza(testo);
 let molt=1;
 const mx=t.match(/(?:^|\s)x\s?(\d{1,2})(?:\s|$)/)
   ||t.match(/(?:^|\s)(\d{1,2})\s?x(?:\s|$)/)
   ||t.match(/(?:^|\s)(\d{1,2})\s?x\s?\d/);
 if(mx) molt=Math.min(20,parseInt(mx[1],10)||1);
 const mp=t.match(/(\d+(?:[.,]\d+)?)\s?(kg|gr|g|ml|cl|lt|l)\b/);
 if(mp){
  let v=parseFloat(mp[1].replace(',','.')), u=mp[2];
  if(u==='kg'){v*=1000;u='g';} else if(u==='gr'){u='g';}
  else if(u==='lt'||u==='l'){v*=1000;u='ml';} else if(u==='cl'){v*=10;u='ml';}
  return {v:Math.round(v*molt*10)/10,u,molt,pesato:false};
 }
 const mw=t.match(/(?:^|\s)(0[.,]\d{3})(?:\s|$)/);
 if(mw) return {v:Math.round(parseFloat(mw[1].replace(',','.'))*1000),u:'g',molt,pesato:true};
 /* un numero nudo fra 50 e 2000, senza virgola, di solito è la grammatura */
 const senzaPrezzo=t.replace(/\d+[.,]\d{2}\s*[a-z]?\s*$/,'');
 const mn=senzaPrezzo.match(/(?:^|\s)(\d{2,4})(?:\s|$)(?![^]*\d{2,4}(?:\s|$))/);
 if(mn){ const v=parseInt(mn[1],10);
  if(v>=50&&v<=2000) return {v:v*molt,u:'g',molt,pesato:false}; }
 return {v:null,u:null,molt,pesato:false};
}

/* cerca l'ingrediente che somiglia di più alla descrizione */
function abbina(desc){
 const parole=normalizza(desc).split(/[\s\/-]+/)
   .filter(w=>w.length>2 && !/^\d/.test(w)).map(espandi);
 if(!parole.length) return {id:null,punti:0};
 let best={id:null,punti:0};
 for(const id in ALIAS){
  if(!ING[id]) continue;
  let migliore=0;
  for(const alias of ALIAS[id]){
   for(const w of parole){
    let p=somiglianza(w,alias);
    if(w===alias) p=1;
    else if(w.length>=5&&alias.startsWith(w)) p=Math.max(p,.92);
    else if(alias.length>=5&&w.startsWith(alias)) p=Math.max(p,.92);
    if(p>migliore) migliore=p;
   }
  }
  if(migliore>best.punti) best={id,punti:migliore};
 }
 return best;
}

/* da una riga grezza a una riga di scontrino, oppure a uno scarto motivato */
function leggiRiga(grezza){
 const raw=String(grezza||'').replace(/\s+/g,' ').trim();
 if(raw.length<3) return null;
 const n=normalizza(raw);
 const sporco=NONCIBO.find(w=>n.includes(w));
 if(sporco) return {scarto:'non è cibo',raw};
 if(NONRIGA.some(r=>r.test(n))) return {scarto:'riga non prodotto',raw};
 /* senza un prezzo in fondo, di solito è intestazione o indirizzo */
 const prezzo=n.match(/(\d+[.,]\d{2})\s*[a-z]?\s*$/);
 const desc=raw.replace(/(\d+[.,]\d{2})\s*[a-z]?\s*$/,'').trim();
 if(!prezzo && !/\d/.test(n)) return {scarto:'riga non prodotto',raw};
 const q=leggiQuantita(raw);
 const m=abbina(desc||raw);
 if(!m.id||m.punti<0.56){
  return {raw, id:null, guess:(desc||raw).toLowerCase(), q:q.v||1,
          u:q.u||'pz', c:Math.max(.2,m.punti), prezzo:prezzo?parseFloat(prezzo[1].replace(',','.')):null};
 }
 const i=ING[m.id];
 let quanti=q.v, unita=q.u;
 if(i.u==='pz'||i.u==='scatole'||i.u==='vasi'||i.u==='spicchi'||i.u==='mazzetti'){
  quanti=q.molt; unita=i.u;
 } else if(quanti==null){
  quanti=Math.round(i.f*q.molt*10)/10; unita=i.u;
 } else if(unita!==i.u){
  if(unita==='g'&&i.u==='ml') unita='ml';
  else if(unita==='ml'&&i.u==='g') unita='g';
  else { quanti=Math.round(i.f*q.molt*10)/10; unita=i.u; }
 }
 return {raw, id:m.id, q:quanti, u:unita, c:Math.min(.99,m.punti),
         prezzo:prezzo?parseFloat(prezzo[1].replace(',','.')):null};
}

/* il negozio, dalle prime righe */
function leggiNegozio(righe){
 const testa=normalizza(righe.slice(0,8).join(' '));
 for(const c of CATENE){
  const k=normalizza(c);
  if(testa.includes(k)) return c==='Ins Mercato'?"In's Mercato":c;
 }
 return null;
}

/* tutto insieme: dal testo letto dalla fotocamera alle righe della spesa */
function leggiScontrino(testo){
 const righe=String(testo||'').split(/\r?\n/).map(r=>r.trim()).filter(Boolean);
 const buone=[], scarti=[];
 righe.forEach(r=>{
  const l=leggiRiga(r);
  if(!l) return;
  if(l.scarto) scarti.push({raw:l.raw,why:l.scarto});
  else buone.push(Object.assign({on:true},l));
 });
 return {store:leggiNegozio(righe), lines:buone, other:scarti};
}

   || Object.keys(ING).find(k=>ING[k].n.toLowerCase().startsWith(s)&&s.length>2) || null;

function segnaGiorno(i){
 S.selDay=i;
 document.querySelectorAll('.calday').forEach((c,n)=>c.classList.toggle('sel',n===i));
}
function vaiAlGiorno(i){
 const list=el('planlist'), d=el('day-'+i);
 if(list&&d){
  S.scrollLock=true;
  clearTimeout(vaiAlGiorno.t);
  vaiAlGiorno.t=setTimeout(()=>{S.scrollLock=false;},1200);
  list.scrollTo({top:Math.max(0,d.offsetTop-6),behavior:'smooth'});
 }
 segnaGiorno(i);
}
function montaPiano(){
 const list=el('planlist'); if(!list) return;
 const top=list.getBoundingClientRect().top;
 list.style.height=Math.max(200,Math.round(window.innerHeight-top))+'px';
 /* spazio in coda, così anche l'ultimo giorno può salire in cima */
 const inner=list.firstElementChild;
 if(inner) inner.style.paddingBottom=Math.max(132,list.clientHeight-150)+'px';
 if(S.planScroll) list.scrollTop=S.planScroll;
 const giorni=[...list.querySelectorAll('.day')];
 list.onscroll=()=>{
  S.planScroll=list.scrollTop;
  /* mentre scorre da solo non cambio l'evidenziazione: la sblocco quando si ferma */
  if(S.scrollLock){ clearTimeout(vaiAlGiorno.t);
    vaiAlGiorno.t=setTimeout(()=>{S.scrollLock=false;},140); return; }
  let idx=0; giorni.forEach((g,i)=>{ if(g.offsetTop-list.scrollTop<=30) idx=i; });
  if(idx!==S.selDay) segnaGiorno(idx);
 };
 segnaGiorno(S.selDay||0);
}
window.addEventListener('resize',()=>{ if(S.screen==='piano') montaPiano(); });

 el('view').innerHTML=VIEWS[S.screen]();
 document.body.classList.toggle('no-pad',S.screen==='piano');
 document.body.classList.toggle('onboarding',S.screen==='benvenuto');

     ${key?`<span class="ring">${i}<span class="cam">${ICO_FOTO}</span></span>`:`<span class="ic">${i}</span>`}${l}</button>`).join('');
 window.scrollTo(0,keep?y:0);
 if(S.screen==='piano') montaPiano();
 salvaPresto();
}

function accetta(){
 const P=S.prop, r=P.pool[P.i];
 if(P.mode==='slot'){
  PLAN[P.di].meals[P.slot]=r.id;
  P.accepted=[{r,i:P.di,s:P.slot}]; P.step='fatto';
  toast(`${r.n} → ${SLOTNAME[P.slot].toLowerCase()} di ${dayLabel(P.di).toLowerCase()}`);
  render(); return;
 }
 const lib=slotLiberi()[0];
 if(!lib){ P.step='done'; render(); return; }
 PLAN[lib.i].meals[lib.s]=r.id;
 P.accepted.push({r,i:lib.i,s:lib.s});
 P.i++;
 toast(`${r.n} → ${dayLabel(lib.i).toLowerCase()} a ${lib.s}`);
 if(!slotLiberi().length||P.i>=P.pool.length) P.step='done';
 render();
}
function avviaScansione(photo){
 S.photo=photo; S.step=2; S.screen='scontrino';
 S.lines=RECEIPT.lines.map(l=>({...l,on:true}));
 S.others=RECEIPT.other.map(o=>({...o}));
 render();
 const quick=matchMedia('(prefers-reduced-motion: reduce)').matches;
 setTimeout(()=>{ S.step=3; render(); }, quick?120:1900);
}
function applicaScontrino(){
 let n=0;
 S.lines.filter(l=>l.on&&l.id&&ING[l.id]).forEach(l=>{
  const i=ING[l.id];
  i.q=Math.round((i.q+l.q)*10)/10;
  i.f=Math.max(i.f,i.q);
  if(i.exp!==undefined) i.exp=Math.max(i.exp,7);
  delete S.checked[l.id];
  S.extra=S.extra.filter(k=>k!==l.id);
  n++;
 });
 S.added=n; S.shopped=true; S.step=4; render(); toast(`${n} alimenti aggiornati in dispensa`);
}
function cucinata(id){
 const r=R(id), c=check(r,S.serv); let n=0;
 c.need.forEach(x=>{const i=ING[x.k]; if(!i||i.staple) return;
  i.q=Math.max(0,Math.round((i.q-x.q)*10)/10); n++;});
 toast(`Buon appetito! ${n} ingredienti scalati`);
 S.screen='dispensa'; render();
}
function salvaRicetta(){
 const nome=(el('nr-n')?.value||'').trim();
 const rows=S.newIng.filter(r=>r.name.trim()&&Number(r.q)>0);
 if(!nome){ toast('Dai un nome alla ricetta'); el('nr-n')?.focus(); return; }
 if(!rows.length){ toast('Serve almeno un ingrediente con la quantità'); return; }
 const serv=Math.max(1,Number(el('nr-p')?.value||2));
 const steps=(el('nr-s')?.value||'').split('\n').map(s=>s.trim()).filter(Boolean);
 const ing=rows.map(r=>{
  let k=trovaIng(r.name);
  if(!k){ k='x_'+Math.random().toString(36).slice(2,7);
   ING[k]={n:r.name.trim(),e:'🥄',u:r.u,q:0,f:Number(r.q)*2,pr:2.50,l:'credenza'}; }
  return [k,Number(r.q)];
 });
 RECIPES.unshift({id:'new'+RECIPES.length,n:nome,e:'🥄',min:Math.max(5,Number(el('nr-t')?.value||30)),
  d:S.newDiff,serv,tag:'Nostra',slots:['pranzo','cena'],ing,
  steps:steps.length?steps:['Scrivi i passaggi quando hai tempo.']});
 S.newIng=[{name:'',q:'',u:'g'},{name:'',q:'',u:'g'}]; S.newDiff=2;
 S.screen='ricette'; render(); toast(`"${nome}" salvata fra le vostre ricette`);
}

/* ===================== memoria sul dispositivo =====================
   Tutto resta nel telefono: niente account, niente server. Se il browser
   non concede spazio (finestra privata, spazio finito) l'app continua a
   funzionare, semplicemente dimentica tutto alla chiusura. */
const CHIAVE='mirtillo.v1';
const oggiISO=()=>{const d=new Date();
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const giorniTra=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);

function salva(){
 try{ localStorage.setItem(CHIAVE, JSON.stringify({
   v:1, data:S.planDate||oggiISO(), ING, RECIPES, PLAN,
   imp:{budget:S.budget,weeks:S.weeks,store:S.store,diffMax:S.diffMax,people:S.people,
        onb:S.onb,diete:S.diete,colazione:S.colazione},
   stato:{shopped:S.shopped,checked:S.checked,extra:S.extra}
 })); }catch(e){ S.senzaMemoria=true; }
}
const salvaPresto=()=>{ clearTimeout(salvaPresto.t); salvaPresto.t=setTimeout(salva,350); };

function carica(){
 let raw=null;
 try{ raw=localStorage.getItem(CHIAVE); }catch(e){ S.senzaMemoria=true; return false; }
 if(!raw) return false;
 let d; try{ d=JSON.parse(raw); }catch(e){ return false; }
 if(!d||d.v!==1) return false;
 if(d.ING) Object.keys(d.ING).forEach(k=>{ ING[k]=Object.assign({},ING[k]||{},d.ING[k]); });
 if(Array.isArray(d.RECIPES)&&d.RECIPES.length) RECIPES=d.RECIPES;
 if(Array.isArray(d.PLAN)&&d.PLAN.length) PLAN=d.PLAN;
 Object.assign(S, d.imp||{}, d.stato||{});
 S.planDate=d.data||oggiISO();
 return true;
}

/* i giorni passano: il piano scorre da solo e le scadenze si accorciano */
function avanzaGiorni(){
 const oggi=oggiISO();
 if(!S.planDate){ S.planDate=oggi; return 0; }
 const n=giorniTra(S.planDate,oggi);
 if(!(n>0)){ S.planDate=oggi; return 0; }
 for(let i=0;i<Math.min(n,PLAN.length);i++){
  PLAN.shift(); PLAN.push({meals:{colazione:null,pranzo:null,cena:null}});
 }
 if(n>=PLAN.length) PLAN=PLAN.map(()=>({meals:{colazione:null,pranzo:null,cena:null}}));
 Object.keys(ING).forEach(k=>{
  if(ING[k].exp!==undefined) ING[k].exp=Math.max(0,ING[k].exp-n); });
 S.planDate=oggi; return n;
}

function esporta(){
 let dati='{}'; try{ dati=localStorage.getItem(CHIAVE)||'{}'; }catch(e){}
 const url=URL.createObjectURL(new Blob([dati],{type:'application/json'}));
 const a=document.createElement('a');
 a.href=url; a.download='mirtillo-'+oggiISO()+'.json';
 document.body.appendChild(a); a.click(); a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),2000);
 toast('Copia salvata fra i tuoi file');
}
function importa(file){
 const fr=new FileReader();
 fr.onload=()=>{
  try{
   const d=JSON.parse(fr.result);
   if(!d||d.v!==1) throw new Error('non è una copia di Mirtillo');
   localStorage.setItem(CHIAVE,fr.result);
   location.reload();
  }catch(e){ toast('Quel file non sembra una copia di Mirtillo'); }
 };
 fr.readAsText(file);
}
function azzeraTutto(){
 try{ localStorage.removeItem(CHIAVE); }catch(e){}
 location.reload();
}
function svuotaDispensa(){
 Object.keys(ING).forEach(k=>{ ING[k].q=0; });
 S.shopped=false; S.checked={}; salva(); render();
 toast('Dispensa svuotata: ora puoi caricare la tua spesa');
}

/* installabile dalla home: il service worker tiene l'app anche senza rete.
   Dentro l'anteprima di Claude non si registra, e va benissimo così. */
if('serviceWorker' in navigator &&
   (location.protocol==='https:'||location.hostname==='localhost')){
 window.addEventListener('load',()=>{
  navigator.serviceWorker.register('sw.js').catch(()=>{});
 });
}

const avevoDati=carica();
const saltati=avanzaGiorni();
if(!S.onb||!S.onb.fatto){ S.onb=S.onb||{fatto:false,passo:0}; S.screen='benvenuto'; }
installaPattern();
render();
if(saltati>0) setTimeout(()=>toast(
  saltati===1?'È passato un giorno: ho fatto scorrere il piano'
             :`Sono passati ${saltati} giorni: ho fatto scorrere il piano`), 600);
salva();
</script>
