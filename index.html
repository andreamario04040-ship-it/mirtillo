/* ===================== fotocamera dal vivo =====================
   Apre la fotocamera, capisce quando stai inquadrando uno scontrino, e legge
   mentre muovi il telefono: ogni passaggio aggiunge solo le righe nuove, così
   puoi scendere lungo lo scontrino finché non dici "carica la spesa".
   La lettura vera la fa Tesseract, scaricato al volo la prima volta. */
const TESS_URL='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';

const L={attivo:false, video:null, stream:null, worker:null, timer:null,
 leggendo:false, trovate:[], scarti:[], negozio:null, fermi:0, fase:'avvio',
 errore:null, cand:{}, viste:{}, ritaglio:null, parole:null, livello:null, carta:null, raf:null,
 cartaOcr:null, ritaglioOcr:null, miniTrack:null, ultimoTrack:0, persa:0,
 pronto:false, visto:false, fine:false};

/* Dove finisce un punto del fotogramma elaborato sullo schermo.
   Il video è mostrato in "cover": ingrandito al massimo e centrato, quindi
   per disegnarci sopra bisogna rifare lo stesso conto a ritroso. */
function mappa(video,canvas,larg,alt){
 const vw=video.videoWidth, vh=video.videoHeight;
 const r=L.ritaglio;
 let sx,sy,sw,sh;
 if(r){ const mx=(r.x1-r.x0)*0.04, my=(r.y1-r.y0)*0.02;
  sx=Math.max(0,r.x0-mx); sy=Math.max(0,r.y0-my);
  sw=Math.min(vw-sx,(r.x1-r.x0)+mx*2); sh=Math.min(vh-sy,(r.y1-r.y0)+my*2);
 } else { sx=vw*0.07; sy=vh*0.13; sw=vw*0.86; sh=vh*0.52; }
 const k=Math.max(larg/vw, alt/vh);
 const offX=(larg-vw*k)/2, offY=(alt-vh*k)/2;
 const kx=sw/canvas.width, ky=sh/canvas.height;
 return (x,y)=>[offX+(sx+x*kx)*k, offY+(sy+y*ky)*k];
}

/* L'overlay non è più un disegno fermo: una riga di scansione scorre sullo
   scontrino e accende i caratteri che ha appena letto, con le parentesi agli
   angoli della carta. Le caselle le aggiorno a ogni lettura, l'animazione
   gira per conto suo a schermo. */
const CIANO='77,243,255', LIME='155,227,122', MAGENTA='255,77,157';

/* Il testo letto viene riscritto sopra lo scontrino. Lo disegno una volta
   sola su una tela a parte, nelle coordinate del ritaglio che ho analizzato;
   poi a ogni fotogramma mi basta ricollocarla seguendo il movimento della
   carta. Così posso inseguire la fotocamera senza ridisegnare 250 scritte
   sessanta volte al secondo. */
function componiLivello(parole,larg,alt){
 const cv=L.livello||(L.livello=document.createElement('canvas'));
 /* lo rimpicciolisco: deve essere solo bello da vedere, non leggibile al pixel */
 const k=Math.min(1,900/Math.max(1,larg));
 L.livelloK=k;
 cv.width=Math.max(1,Math.round(larg*k)); cv.height=Math.max(1,Math.round(alt*k));
 const c=cv.getContext('2d');
 c.clearRect(0,0,cv.width,cv.height);
 c.setTransform(k,0,0,k,0,0);
 c.textBaseline='alphabetic';
 parole.forEach(p=>{
  const w=p.x1-p.x0, h=p.y1-p.y0;
  if(w<6||h<8) return;
  const col=p.presa?LIME:CIANO;
  c.fillStyle='rgba('+col+',.12)';
  c.fillRect(p.x0,p.y0,w,h);
  c.strokeStyle='rgba('+col+',.5)'; c.lineWidth=1;
  c.strokeRect(p.x0+.5,p.y0+.5,w-1,h-1);
  if(!p.t) return;
  c.font='700 '+Math.max(9,Math.round(h*0.86))+'px ui-monospace,SFMono-Regular,Menlo,monospace';
  c.fillStyle='rgba('+col+',.96)';
  c.fillText(p.t,p.x0+1,p.y1-h*0.12,w-2);
 });
 return cv;
}

function disegnaOverlay(parole,carta){
 L.parole=parole||[]; L.carta=carta||null; L.quando=performance.now();
 if(L.canvasOcr&&L.parole.length)
  componiLivello(L.parole,L.canvasOcr.width,L.canvasOcr.height);
 else L.livello=null;
}

function angoli(c,x0,y0,x1,y1,col,lato){
 c.strokeStyle='rgba('+col+',.95)'; c.lineWidth=3; c.lineCap='round';
 const L2=Math.min(lato,(x1-x0)/3,(y1-y0)/3);
 [[x0,y0,1,1],[x1,y0,-1,1],[x0,y1,1,-1],[x1,y1,-1,-1]].forEach(([x,y,sx,sy])=>{
  c.beginPath();
  c.moveTo(x+sx*L2,y); c.lineTo(x,y); c.lineTo(x,y+sy*L2);
  c.stroke();
 });
}

function animaOverlay(){
 if(!L.attivo) return;
 L.raf=requestAnimationFrame(animaOverlay);
 const cv=el('live-ovl'), video=L.video;
 if(!cv||!video||!video.videoWidth) return;
 /* Rileggo il bordo della carta molte volte al secondo: costa poco (80x80)
    e mi dice quanto si è spostata e ingrandita l'inquadratura da quando ho
    letto. Le caselle le sposto di conseguenza, così restano sulle parole. */
 const ora=performance.now();
 if(!L.ultimoTrack||ora-L.ultimoTrack>33){   /* trenta volte al secondo: misurato, costa 0,06 ms */
  L.ultimoTrack=ora;
  if(!L.miniTrack) L.miniTrack=document.createElement('canvas');
  const c2=trovaCarta(video,L.miniTrack);
  if(c2) L.carta=c2; else L.persa=(L.persa||0)+1;
  if(c2) L.persa=0;
 }
 const dpr=Math.min(2,window.devicePixelRatio||1);
 const larg=cv.clientWidth, alt=cv.clientHeight;
 if(cv.width!==Math.round(larg*dpr)){ cv.width=Math.round(larg*dpr); cv.height=Math.round(alt*dpr); }
 const c=cv.getContext('2d');
 c.setTransform(dpr,0,0,dpr,0,0);
 c.clearRect(0,0,larg,alt);
 const t=performance.now();

 let y0=alt*0.2, y1=alt*0.8, x0=larg*0.1, x1=larg*0.9;
 if(L.carta){
  const vw=video.videoWidth, vh=video.videoHeight;
  const k=Math.max(larg/vw, alt/vh);
  const offX=(larg-vw*k)/2, offY=(alt-vh*k)/2;
  x0=offX+L.carta.x0*k; y0=offY+L.carta.y0*k;
  x1=offX+L.carta.x1*k; y1=offY+L.carta.y1*k;
  c.save();
  c.fillStyle='rgba('+CIANO+',.06)';
  c.fillRect(x0,y0,x1-x0,y1-y0);
  angoli(c,x0,y0,x1,y1,CIANO,26);
  c.restore();
 }

 /* la riga di scansione */
 const ciclo=2600, f=((t%ciclo)/ciclo);
 const ys=y0+(y1-y0)*f;
 c.save();
 const g=c.createLinearGradient(0,ys-46,0,ys+10);
 g.addColorStop(0,'rgba('+CIANO+',0)');
 g.addColorStop(1,'rgba('+CIANO+',.22)');
 c.fillStyle=g; c.fillRect(x0,ys-46,x1-x0,56);
 c.strokeStyle='rgba('+CIANO+',.9)'; c.lineWidth=2;
 c.beginPath(); c.moveTo(x0,ys); c.lineTo(x1,ys); c.stroke();
 c.restore();

 if(!L.livello||!L.canvasOcr||!L.ritaglioOcr) return;
 if(L.persa>6) return;           /* carta persa di vista: meglio niente che scritte a caso */
 const vw2=video.videoWidth, vh2=video.videoHeight;
 const kk=Math.max(larg/vw2, alt/vh2);
 const oX=(larg-vw2*kk)/2, oY=(alt-vh2*kk)/2;
 const r=L.ritaglioOcr;
 const kx=r.sw/L.canvasOcr.width, ky=r.sh/L.canvasOcr.height;
 let mx=1,my=1,tx=0,ty=0;
 if(L.cartaOcr&&L.carta){
  const lo=Math.max(1,L.cartaOcr.x1-L.cartaOcr.x0), ho=Math.max(1,L.cartaOcr.y1-L.cartaOcr.y0);
  mx=(L.carta.x1-L.carta.x0)/lo; my=(L.carta.y1-L.carta.y0)/ho;
  if(!isFinite(mx)||mx<=0) mx=1;
  if(!isFinite(my)||my<=0) my=1;
  tx=L.carta.x0-L.cartaOcr.x0*mx; ty=L.carta.y0-L.cartaOcr.y0*my;
 }
 const m=(cx,cy)=>{
  const vx=(r.sx+cx*kx)*mx+tx, vy=(r.sy+cy*ky)*my+ty;
  return [oX+vx*kk, oY+vy*kk];
 };
 const eta=Math.min(1,(t-(L.quando||t))/420);
 const [dx0,dy0]=m(0,0), [dx1,dy1]=m(L.canvasOcr.width,L.canvasOcr.height);
 /* la tela del testo è ridotta: la riporto alla misura del ritaglio */
 const dw=dx1-dx0, dh=dy1-dy0;
 if(!(dw>4&&dh>4)) return;
 c.save();
 /* tutto il testo, in sordina */
 c.globalAlpha=0.36*(0.4+0.6*eta);
 c.drawImage(L.livello,dx0,dy0,dw,dh);
 /* e di nuovo, acceso, solo dove la riga di scansione è già passata */
 c.globalAlpha=0.95*(0.4+0.6*eta);
 const taglio=Math.max(0,Math.min(dh,ys-dy0));
 if(taglio>0){
  c.beginPath(); c.rect(dx0,dy0,dw,taglio); c.clip();
  c.drawImage(L.livello,dx0,dy0,dw,dh);
 }
 c.restore();
}

/* il bordo della carta: cerco la zona chiara dentro la guida */
function trovaCarta(video,mini,sorgente){
 const c=mini.getContext('2d',{willReadFrequently:true});
 const w=80,h=80; mini.width=w; mini.height=h;
 const vw=sorgente?sorgente.width:video.videoWidth;
 const vh=sorgente?sorgente.height:video.videoHeight;
 if(!vw) return null;
 const sx=sorgente?0:vw*0.05, sy=sorgente?0:vh*0.10;
 const sw=sorgente?vw:vw*0.90, sh=sorgente?vh:vh*0.62;
 c.drawImage(sorgente||video,sx,sy,sw,sh,0,0,w,h);
 const d=c.getImageData(0,0,w,h).data;
 let x0=w,y0=h,x1=0,y1=0,n=0;
 for(let y=0;y<h;y++) for(let x=0;x<w;x++){
  const i=(y*w+x)*4;
  const l=d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114;
  if(l>132){ n++; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
 }
 if(n<w*h*0.14||x1-x0<w*0.2||y1-y0<h*0.2) return null;
 return {x0:sx+(x0/w)*sw, y0:sy+(y0/h)*sh, x1:sx+(x1/w)*sw, y1:sy+(y1/h)*sh};
}

/* due righe sono la stessa cosa se si somigliano molto */
function giaPresa(nuova){

 });

/* quanto è chiaro e "pieno" il riquadro: uno scontrino è pallido e occupa la guida */
function inquadrato(video,canvas){
 const c=canvas.getContext('2d',{willReadFrequently:true});
 const w=64,h=64; canvas.width=w; canvas.height=h;
 const vw=video.videoWidth,vh=video.videoHeight;
 if(!vw||!vh) return 0;
 c.drawImage(video, vw*0.09, vh*0.15, vw*0.82, vh*0.47, 0,0,w,h);
 const d=c.getImageData(0,0,w,h).data;
 let chiari=0, somma=0;
 for(let i=0;i<d.length;i+=4){
  const l=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114);
  somma+=l; if(l>142) chiari++;
 }
 const media=somma/(w*h);
 return (chiari/(w*h))*(media>95?1:0.3);
}

/* Bianco e nero con soglia LOCALE: su carta termica la luce non è mai uniforme
   (ombra della mano, riflesso, stampa sbiadita in fondo). Con una soglia unica
   per tutta l'immagine metà scontrino diventa nero e l'altra metà bianco; con
   una media calcolata attorno a ogni pixel il testo resta leggibile ovunque.
   La media mobile si ottiene da un'immagine integrale, così costa poco. */
function binarizza(d,w,h,raggio,k){
 const n=w*h, g=new Float64Array(n), S1=new Float64Array((w+1)*(h+1));
 for(let i=0,p=0;i<n;i++,p+=4) g[i]=d[p]*0.299+d[p+1]*0.587+d[p+2]*0.114;
 for(let y=0;y<h;y++){
  let riga=0;
  for(let x=0;x<w;x++){
   riga+=g[y*w+x];
   S1[(y+1)*(w+1)+(x+1)]=S1[y*(w+1)+(x+1)]+riga;
  }
 }
 const area=(x0,y0,x1,y1)=>S1[(y1+1)*(w+1)+(x1+1)]-S1[y0*(w+1)+(x1+1)]
                          -S1[(y1+1)*(w+1)+x0]+S1[y0*(w+1)+x0];
 for(let y=0;y<h;y++){
  const y0=Math.max(0,y-raggio), y1=Math.min(h-1,y+raggio);
  for(let x=0;x<w;x++){
   const x0=Math.max(0,x-raggio), x1=Math.min(w-1,x+raggio);
   const conta=(x1-x0+1)*(y1-y0+1);
   const media=area(x0,y0,x1,y1)/conta;
   const v=g[y*w+x] < media*(1-k) ? 0 : 255;
   const p=(y*w+x)*4; d[p]=d[p+1]=d[p+2]=v;
  }
 }
}

/* ritaglia la guida, ingrandisce e pulisce: l'OCR ci vede molto meglio */
function fotogramma(video,canvas,sorgente,carta){
 let sx,sy,sw,sh,vw,vh;
 if(sorgente&&sorgente.width){ vw=sorgente.width; vh=sorgente.height;
  sx=0; sy=0; sw=vw; sh=vh; }
 else { vw=video.videoWidth; vh=video.videoHeight;
  if(carta){
   /* il ritaglio segue lo scontrino, non un riquadro fisso: tutto quello che
      sta intorno (tavolo, mani, ombre) l'OCR lo leggerebbe come righe a caso */
   const mx=(carta.x1-carta.x0)*0.04, my=(carta.y1-carta.y0)*0.02;
   sx=Math.max(0,carta.x0-mx); sy=Math.max(0,carta.y0-my);
   sw=Math.min(vw-sx,(carta.x1-carta.x0)+mx*2);
   sh=Math.min(vh-sy,(carta.y1-carta.y0)+my*2);
  } else { sx=vw*0.07; sy=vh*0.13; sw=vw*0.86; sh=vh*0.52; }
 }
 /* l'OCR vuole testo alto almeno una trentina di pixel: meglio ingrandire */
 let scala=Math.max(1, Math.min(2.4, 1700/sw));
 /* tengo sotto controllo l'area: oltre, ogni passata diventa troppo lenta */
 const maxPix=2.9e6;
 if(sw*sh*scala*scala>maxPix) scala=Math.sqrt(maxPix/(sw*sh));
 canvas.width=Math.round(sw*scala); canvas.height=Math.round(sh*scala);
 if(!sorgente) L.ritaglioOcr={sx,sy,sw,sh};
 const c=canvas.getContext('2d',{willReadFrequently:true});
 c.imageSmoothingQuality='high';
 c.drawImage(sorgente||video,sx,sy,sw,sh,0,0,canvas.width,canvas.height);
 const img=c.getImageData(0,0,canvas.width,canvas.height);
 const raggio=Math.max(12,Math.round(canvas.height/26));
 binarizza(img.data,canvas.width,canvas.height,raggio,0.14);
 c.putImageData(img,0,0);
 return canvas;
}

function caricaTesseract(){
 if(window.Tesseract) return Promise.resolve(window.Tesseract);
 return new Promise((ok,no)=>{
  const sc=document.createElement('script');
  sc.src=TESS_URL; sc.onload=()=>ok(window.Tesseract);
  sc.onerror=()=>no(new Error('rete'));
  document.head.appendChild(sc);
 });
}

async function apriScanner(){
 S.screen='scanner'; render();
 L.trovate=[]; L.scarti=[]; L.negozio=null; L.fermi=0; L.attivo=true; L.errore=null;
 L.cand={}; L.viste={}; L.ritaglio=null;
 L.pronto=false; L.visto=false; L.fine=false;
 disegnaTrovate();
 const video=el('live-video'); L.video=video;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
  return ripiego('Qui la fotocamera non si può aprire',
   'Il browser non la mette a disposizione — di solito succede quando la pagina non è su <b>https</b>. Puoi comunque scegliere una foto già scattata, o inserire la spesa a mano.');
 }
 try{
  L.stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
 }catch(e){
  return ripiego('Non mi hai dato la fotocamera',
   'Per leggere lo scontrino mi serve il permesso della fotocamera. Puoi darmelo dalle impostazioni del browser, oppure fare in un altro modo.');
 }
 if(!L.attivo){ fermaScanner(); return; }
 video.srcObject=L.stream;
 try{ await video.play(); }catch(e){}
 guida('cerca');
 const canvas=document.createElement('canvas');
 const mini=document.createElement('canvas');
 try{
  const T=await caricaTesseract();
  if(!L.attivo) return;
  guida('scarico');
  L.worker=await T.createWorker('ita',1);
  await L.worker.setParameters({
   tessedit_pageseg_mode:'6',
   preserve_interword_spaces:'1',
   tessedit_char_blacklist:'{}[]|@#$%^&*_~`'
  });
 }catch(e){
  return ripiego('Non riesco a scaricare il lettore',
   'La prima volta serve la rete per scaricare il riconoscimento del testo (poi resta nel telefono). Controlla la connessione, oppure inserisci la spesa a mano.');
 }
 if(!L.attivo){ fermaScanner(); return; }
 L.pronto=true; guida('cerca'); avanzamento();
 L.timer=setInterval(()=>passata(canvas,mini), 900);
 L.raf=requestAnimationFrame(animaOverlay);
}

/* le righe di testo trovate, comunque le restituisca Tesseract */
function estraiRighe(data){
 if(Array.isArray(data.lines)&&data.lines.length) return data.lines;
 const fuori=[];
 (data.blocks||[]).forEach(b=>(b.paragraphs||[]).forEach(par=>
   (par.lines||[]).forEach(l=>fuori.push(l))));
 return fuori;
}

async function passata(canvas,mini){
 if(!L.attivo||L.leggendo||!L.video||!L.video.videoWidth) return;
 const carta=trovaCarta(L.video,mini);
 const pieno=inquadrato(L.video,mini);
 if(pieno<0.22||!carta){
  guidaOk(false); freccia(false); disegnaOverlay(null,carta);
  guida('cerca'); avanzamento(); return;
 }
 guidaOk(true); L.visto=true;
 L.leggendo=true;
 try{
  if(L.fase!=='letto') guida('legge');
  L.canvasOcr=canvas;
  L.ritaglio=carta; L.cartaOcr=carta;
  const {data}=await L.worker.recognize(fotogramma(L.video,canvas,null,carta),{},
    {text:true,blocks:true});
  if(!L.attivo) return;
  const righeOCR=estraiRighe(data);
  const letto=leggiColonne(righeOCR);
  if(!L.negozio){
   const st=leggiNegozio(righeOCR.map(r=>(r.text||'')));
   if(st){ L.negozio=st; S.store=st; }
  }
  /* la riga del totale è la fine dello scontrino: da lì so che non manca
     più niente sotto, ed è l'unica cosa che me lo dice davvero */
  if(!L.fine&&L.trovate.length){
   const coda=normalizza(righeOCR.map(r=>(r.text||'')).join(' '));
   if(/(totale|importo pagato|pagamento elettronico|contante|resto)/.test(coda)) L.fine=true;
  }
  /* Una riga entra in lista solo se la rileggo in due passate diverse.
     Il rumore dell'OCR cambia ogni volta, il testo vero no: è così che si
     smette di accumulare robaccia mentre tieni fermo il telefono. */
  /* Una riga decisa non si riconsidera più: né per rimetterla in lista, né
     per rimetterla fra gli scarti. Senza questo, ogni passata ripropone le
     stesse righe con il rumore leggermente diverso e la lista si gonfia. */
  let nuove=0; const prese=[];
  letto.lines.forEach(l=>{
   const k=chiaveRiga(l.desc||l.raw);
   if(!k||L.viste[k]||giaPresa(l)) return;
   const c=L.cand[k]||{n:0};
   c.n++; c.l=l; L.cand[k]=c;
   if(c.n>=2){
    L.viste[k]=1; L.trovate.push(l); nuove++;
    prese.push(normalizza(l.raw)); delete L.cand[k];
   }
  });
  letto.other.forEach(o=>{
   const k=chiaveRiga(o.raw);
   if(!k||L.viste[k]) return;
   L.viste[k]=1;
   if(L.scarti.length<20) L.scarti.push(o);
  });

  /* disegno sul video quello che ho letto: verde ciò che è finito in lista */
  /* le parole lette, con il loro testo: sarà riscritto sopra lo scontrino */
  const parole=[];
  estraiRighe(data).forEach(riga=>{
   const presa=prese.some(t=>somiglianza(t,normalizza(riga.text||''))>0.7);
   (riga.words||[]).forEach(w=>{
    if(!w.bbox||!w.text||!w.text.trim()) return;
    if(w.confidence!==undefined&&w.confidence<30) return;
    parole.push({x0:w.bbox.x0,y0:w.bbox.y0,x1:w.bbox.x1,y1:w.bbox.y1,
                 t:w.text.trim().slice(0,22),presa});
   });
  });
  disegnaOverlay(parole.slice(0,320),carta);

  if(nuove){
   L.fermi=0; L.fase='letto'; freccia(false);
   disegnaTrovate();
   guida(L.fine?'fondo':'nuove',L.fine?null:(nuove===1?'+1 riga letta':'+'+nuove+' righe lette'));
   if(navigator.vibrate) try{navigator.vibrate(18);}catch(e){}
  }else{
   L.fermi++;
   const inAttesa=Object.keys(L.cand).length;
   if(inAttesa&&L.fermi<3){
    guida('conferma');
   } else if(L.trovate.length&&L.fermi>=2){
    guida(L.fine?'fondo':'pronto'); freccia(!L.fine);
   } else if(!L.trovate.length&&L.fermi>=3){
    freccia(false);
    guida(caselle.length?'illeggibile':'buio');
   }
  }
  avanzamento();
 }catch(e){ /* un fotogramma venuto male: si riprova col prossimo */ }
 finally{ L.leggendo=false; }
}

function fermaScanner(){
 L.attivo=false;
 if(L.timer){ clearInterval(L.timer); L.timer=null; }
 if(L.raf){ cancelAnimationFrame(L.raf); L.raf=null; }
 L.parole=null; L.livello=null; L.carta=null; L.cartaOcr=null;
 L.ritaglioOcr=null; L.persa=0;
 if(L.stream){ L.stream.getTracks().forEach(t=>{try{t.stop();}catch(e){}}); L.stream=null; }
 if(L.worker){ const w=L.worker; L.worker=null; try{ w.terminate(); }catch(e){} }
 L.video=null; L.canvasOcr=null;
}

function chiudiScanner(){ fermaScanner(); S.screen='spesa'; render(); }

function finiScanner(){
 const righe=L.trovate.slice(), scarti=L.scarti.slice(), negozio=L.negozio;
 fermaScanner();
 S.lines=righe.map(l=>Object.assign({},l,{on:true}));
 S.others=scarti;
 if(negozio) S.store=negozio;
 S.photo=null; S.step=3; S.screen='scontrino'; render();
 toast(`${righe.length} righe lette: controlla e conferma`);
}

/* una foto sola, per chi la fotocamera dal vivo non ce l'ha */
async function leggiFoto(dataUrl){
 S.photo=dataUrl; S.step=2; S.screen='scontrino'; render();
 try{
  const T=await caricaTesseract();
  const w=await T.createWorker('ita',1);
  await w.setParameters({
    tessedit_pageseg_mode:'6',
    preserve_interword_spaces:'1',
    tessedit_char_blacklist:'{}[]|@#$%^&*_~`'
   });
  const im=new Image(); im.src=dataUrl;
  await new Promise(ok=>{ im.onload=ok; im.onerror=ok; });
  const cv=document.createElement('canvas');
  const sorgente=(im.width&&im.height)?im:null;
  let immagine=dataUrl;
  if(sorgente){
   const mini=document.createElement('canvas');
   const carta=trovaCarta(null,mini,sorgente);
   if(carta){
    /* ritaglio sulla carta anche qui: fuori c'è il tavolo, e l'OCR lo legge */
    const rit=document.createElement('canvas');
    rit.width=Math.round(carta.x1-carta.x0); rit.height=Math.round(carta.y1-carta.y0);
    rit.getContext('2d').drawImage(sorgente,carta.x0,carta.y0,rit.width,rit.height,
      0,0,rit.width,rit.height);
    immagine=fotogramma(null,cv,rit);
   } else immagine=fotogramma(null,cv,sorgente);
  }
  const {data}=await w.recognize(immagine,{},{text:true,blocks:true});
  try{ w.terminate(); }catch(e){}
  const righeOCR=estraiRighe(data);
  const letto=righeOCR.length?leggiColonne(righeOCR):leggiScontrino(data.text||'');
  letto.store=leggiNegozio(righeOCR.length?righeOCR.map(r=>r.text||''):(data.text||'').split('\n'));
  S.lines=letto.lines.map(l=>Object.assign({},l,{on:true}));
  S.others=letto.other;
  if(letto.store) S.store=letto.store;
  S.step=3; render();
  toast(letto.lines.length?`${letto.lines.length} righe lette`:'Non ho letto nessun prodotto: prova con più luce');
 }catch(e){
  S.step=1; render();
  toast('Non riesco a leggere la foto: prova a inserire a mano');
 }
}

const vietati=()=>Object.keys(S.diete||{}).filter(g=>S.diete[g])
  .flatMap(g=>GRUPPI[g]?GRUPPI[g].k:[]);

/* le risposte che dai alla revisione restano qui: la stessa riga, la volta
   dopo, viene riconosciuta subito. È l'unico modo onesto di "allenarsi sugli
   scontrini veri": impara dai vostri, non da un campione che non ho. */
const chiaveRiga=t=>normalizza(t).replace(/\d+[.,]\d{2}\s*[a-z]?\s*$/,'')
  .replace(/[0-9]/g,'').replace(/\s+/g,' ').trim().slice(0,38);
function imparata(raw){
 const k=chiaveRiga(raw);
 if(!k||!S.imparate) return undefined;
 if(k in S.imparate) return S.imparate[k];
 for(const altra in S.imparate){
  if(altra.length>8 && somiglianza(altra,k)>0.88) return S.imparate[altra];
 }
 return undefined;
}
function impara(raw,id){
 const k=chiaveRiga(raw); if(!k) return;
 S.imparate=S.imparate||{}; S.imparate[k]=id; salva();
}

/* L'OCR su una foto non restituisce mai la riga pulita: davanti e dietro ci
   finiscono pezzi di tavolo, di ombra, del retro stampato. La riga vera sta
   fra il primo pezzo di parola e il prezzo. Qui la si isola. */
function ripulisciRiga(raw){
 let t=String(raw||'').replace(/\s+/g,' ').trim();
 /* il prezzo è l'ancora: tutto quello che viene dopo è rumore */
 const m=t.match(/(\d{1,4}[.,]\d{2})(?!.*\d{1,4}[.,]\d{2})/);
 let prezzo=null, testa=t;
 if(m){ prezzo=parseFloat(m[1].replace(',','.')); testa=t.slice(0,m.index); }
 /* via la colonna IVA: "22%", "4 %" */
 testa=testa.replace(/\b\d{1,2}\s?%/g,' ');
 /* via i token iniziali che non sono parole: "3", "\"i", "=,", "‘3" */
 const pezzi=testa.split(/\s+/).filter(Boolean);
 while(pezzi.length>1){
  const p0=pezzi[0];
  /* Le parole corte in testa di solito sono sporcizia del margine, ma non
     sempre: "LT INTERO", "BEV. SOIA", "THE VERDE". Se quella parola il
     catalogo la conosce, non è sporcizia: è il nome del prodotto. */
  const pulita=normalizza(p0).replace(/[.\s]/g,'');
  if(pulita.length>=2 && (parolaNota(pulita)||ABBREV[pulita])) break;
  /* "T0NN0" e "PETT0" sembrano numeri e finirebbero nel cestino: prima
     raddrizzo le cifre lette male, poi conto le lettere */
  const dritta=cifreStorte(pulita);
  if(dritta!==pulita && (parolaNota(dritta)||(dritta.match(/[a-z]/g)||[]).length>=4)) break;
  const lettere=(p0.match(/[a-zA-ZàèéìòùÀÈÉÌÒÙ']/g)||[]).length;
  /* un token di tre lettere tutte maiuscole seguito da altro è quasi sempre
     sporcizia del margine ("pit", "Bc", "AN"): tengo solo parole vere */
  if(lettere>=3 && /^[a-zA-ZàèéìòùÀÈÉÌÒÙ'.]+$/.test(p0) && lettere>=4) break;
  if(lettere>=3 && /^[A-Za-zàèéìòù]{3,}$/.test(p0) && pezzi.length<=2) break;
  if(lettere>=5) break;
  pezzi.shift();
 }
 /* in coda resta il residuo della colonna IVA, che l'OCR legge "224", "10X" */
 for(let giri=0; giri<2 && pezzi.length>1; giri++){
  const ultimo=pezzi[pezzi.length-1];
  const lettere=(ultimo.match(/[a-zA-Zàèéìòù]/g)||[]).length;
  if(/\d/.test(ultimo) && lettere<=1) pezzi.pop(); else break;
 }
 let desc=pezzi.join(' ').replace(/[|\\\/_~^"“”‘’]+/g,' ').replace(/\s+/g,' ').trim();
 desc=desc.replace(/[^a-zA-ZàèéìòùÀÈÉÌÒÙ0-9.,'\s-]+$/,'').trim();
 return {desc,prezzo};
}

/* ha l'aria di una riga di prodotto? */
function sembraProdotto(desc,prezzo){
 if(prezzo===null) return false;
 const lettere=(desc.match(/[a-zA-ZàèéìòùÀÈÉÌÒÙ]/g)||[]).length;
 if(lettere<4) return false;
 if(lettere/Math.max(1,desc.length)<0.45) return false;
 return true;
}

/* dal testo dello scontrino a un nome presentabile: "SUGHI FRESCHI ASSOR." */
function nomePresentabile(desc){
 const t=desc.toLowerCase().replace(/\s+/g,' ').trim()
   .replace(/[.,]+$/,'');
 return t.charAt(0).toUpperCase()+t.slice(1);
}

/* "LATTE P.S." e "OLIO E.V.O.": le casse scrivono le sigle con i punti.
   Separandole diventano lettere singole, che poi butto via perche' troppo
   corte, e la sigla sparisce. Quindi prima le incollo. */
const siglePuntate=t=>String(t).replace(/\b(?:[a-zA-Z]\.){2,}/g,m=>m.replace(/\./g,''));
const senzaAccenti=t=>t.normalize('NFD').replace(/[̀-ͯ]/g,'');
function normalizza(t){
 return siglePuntate(senzaAccenti(String(t||'').toLowerCase()))
  .replace(/[^a-z0-9,.\s\/x-]/g,' ').replace(/\s+/g,' ').trim();
}
/* distanza di Levenshtein, per reggere gli errori di lettura (RISQ per RISO) */
function lev(a,b){
 if(a===b) return 0;
 const m=a.length,n=b.length;
 if(!m||!n) return m||n;
 let pre=new Array(n+1), cur=new Array(n+1);
 for(let j=0;j<=n;j++) pre[j]=j;
 for(let i=1;i<=m;i++){
  cur[0]=i;
  for(let j=1;j<=n;j++){
   cur[j]=Math.min(pre[j]+1, cur[j-1]+1, pre[j-1]+(a[i-1]===b[j-1]?0:1));
  }
  const t=pre; pre=cur; cur=t;
 }
 return pre[n];
}
const somiglianza=(a,b)=>{const L=Math.max(a.length,b.length); return L?1-lev(a,b)/L:0;};

/* una parola abbreviata vale la sua versione lunga */
function espandi(parola){
 if(ABBREV[parola]) return ABBREV[parola];
 /* "verde" comincia per "verd" e "fettine" per "fett", ma sono parole
    intere, non abbreviazioni: se le allungo, il tè verde diventa un
    contorno di verdure e le fettine di pollo diventano fette biscottate.
    Una parola che il catalogo conosce già resta com'è. */
 if(parolaNota(parola)) return parola;
 if(parola.length>=4){
  for(const k in ABBREV) if(k.length>=4 && parola.startsWith(k)) return ABBREV[k];
 }
 return parola;
}

/* quantità: x2, 500g, 1,5 kg, 0,610 (peso in kg), 1lt */
function leggiQuantita(testo){
 const t=normalizza(testo);
 let molt=1;
 const mx=t.match(/(?:^|\s)x\s?(\d{1,2})(?:\s|$)/)
   ||t.match(/(?:^|\s)(\d{1,2})\s?x(?:\s|$)/)
   ||t.match(/(?:^|\s)(\d{1,2})\s?x\s?\d/);
 if(mx) molt=Math.min(20,parseInt(mx[1],10)||1);
 /* "6 PZ", "CONF.4", "4 PEZZI": lo scontrino dice già quanti sono */
 const mz=t.match(/(?:^|\s)(\d{1,2})\s?(?:pz|pezzi|pcs)\b/)
   ||t.match(/\b(?:pz|pezzi)\.?\s?(\d{1,2})(?:\s|$)/)   /* certe catene lo scrivono al contrario: "PZ 2" */
   ||t.match(/\b(?:conf|cf)\.?\s?(\d{1,2})(?:\s|$)/);
 if(mz&&molt===1) molt=Math.min(30,parseInt(mz[1],10)||1);
 /* un numero piccolo e nudo scritto DOPO il nome ("UOVA FRESCHE 6",
    "BANANE 4") dice quante cose hai preso. Prima del nome invece è il
    numero di riga della cassa, e quello non c'entra. Lo tengo da parte:
    vale solo per le cose che si contano, e lo decide misura(). */
 const senzaPrezzo=t.replace(/\d+[.,]\d{2}\s*[a-z]?\s*$/,'');
 let conta=null;
 if(!mx&&!mz){
  const pezzi=senzaPrezzo.split(/\s+/);
  const primaParola=pezzi.findIndex(w=>(w.match(/[a-z]/g)||[]).length>=2);
  if(primaParola>=0){
   /* prendo l'ULTIMO: quando le colonne non si trovano leggo la riga due
      volte di seguito, e davanti ci può stare il numero di riga della cassa
      ("1 UOVA FRESCHE 6"). Quello che conta sta in fondo al nome. */
   const nudi=pezzi.slice(primaParola+1)
     .filter(w=>/^\d{1,2}$/.test(w)).map(w=>parseInt(w,10))
     .filter(n=>n>=1&&n<=30);
   if(nudi.length) conta=nudi[nudi.length-1];
  }
 }
 const mp=t.match(/(\d+(?:[.,]\d+)?)\s?(kg|gr|g|ml|cl|lt|l)\b/);
 if(mp){
  let v=parseFloat(mp[1].replace(',','.')), u=mp[2];
  /* "0,412 kg" con tre decimali è la bilancia, non una confezione: quel
     numero storto è giusto per forza e non va messo in discussione */
  const bilancia=/[.,]\d{3}$/.test(mp[1]);
  if(u==='kg'){v*=1000;u='g';} else if(u==='gr'){u='g';}
  else if(u==='lt'||u==='l'){v*=1000;u='ml';} else if(u==='cl'){v*=10;u='ml';}
  return {v:Math.round(v*molt*10)/10,u,molt,pesato:bilancia,conta};
 }
 const mw=t.match(/(?:^|\s)(0[.,]\d{3})(?:\s|$)/);
 if(mw) return {v:Math.round(parseFloat(mw[1].replace(',','.'))*1000),u:'g',molt,pesato:true,conta};
 /* un numero nudo fra 50 e 2000, senza virgola, di solito è la grammatura */
 const mn=senzaPrezzo.match(/(?:^|\s)(\d{2,4})(?:\s|$)(?![^]*\d{2,4}(?:\s|$))/);
 if(mn){ const v=parseInt(mn[1],10);
  if(v>=50&&v<=2000) return {v:v*molt,u:'g',molt,pesato:false,conta}; }
 return {v:null,u:null,molt,pesato:false,conta};
}

/* Cerca l'ingrediente che somiglia di più alla descrizione.
   Due regole imparate sugli scontrini veri:
   - sulle parole corte un errore cambia il significato (sughi/funghi,
     pane/panna), quindi niente tolleranza sotto le sette lettere;
   - la parola che conta è di solito la prima: "gnocchi di patate" sono
     gnocchi, non patate. Una somiglianza trovata più avanti vale meno,
     così finisce fra le cose da chiedere invece che fra le certezze. */
/* tutte le parole che il catalogo conosce. Serve per distinguere una parola
   che vuol dire qualcosa dalla sporcizia che l'OCR mette in testa alla riga. */
let NOTE=null;
function parolaNota(w){
 if(!NOTE){
  NOTE=new Set();
  for(const id in ALIAS) (ALIAS[id]||[]).forEach(a=>{ if(!a.includes(' ')) NOTE.add(a); });
 }
 if(NOTE.has(w)) return true;
 if(w.length>=6){
  const radice=w.slice(0,-1);
  for(const v of 'aeio') if(NOTE.has(radice+v)) return true;
 }
 return false;
}
/* la stessa domanda, ma allungando prima le abbreviazioni. Sta a parte
   perché espandi() chiede a sua volta se la parola è nota, e le due
   funzioni si chiamerebbero a vicenda per sempre. */
function parolaNotaOEspansa(w){ return parolaNota(w)||parolaNota(espandi(w)); }

/* Lo zero al posto della o, l'uno al posto della i: è l'errore che la
   lettura fa più spesso, e dentro una parola si vede a occhio nudo
   ("M0ZZARELLA", "T0NN0", "PATAT3"). Raddrizzo le cifre solo dentro i
   gruppi che hanno almeno tre lettere, così "1LT", "500G" e "3X80" — dove
   la cifra è un numero vero — restano come sono. */
const CIFRE_STORTE={'0':'o','1':'i','3':'e','4':'a','5':'s','6':'g','8':'b'};
function cifreStorte(w){
 if(!/\d/.test(w)) return w;
 if((w.match(/[a-z]/g)||[]).length<3) return w;
 return w.replace(/[0134568]/g,c=>CIFRE_STORTE[c]||c);
}
function abbina(desc){
 const grezze=normalizza(desc).split(/[\s\/.-]+/)
   .filter(w=>w.length>=2 && !/^\d/.test(w))
   .map(cifreStorte);
 /* Ogni parola vale due volte: per come è scritta e per come la allargo.
    "olive" resta "olive" e trova le olive, ma vale anche "oliva" e trova
    l'olio — solo un po' meno. Così la parola scritta per intero batte
    sempre la scorciatoia, e lo zucchero non diventa una zucchina. */
 const parole=[];
 grezze.forEach((w,idx)=>{
  parole.push({w,idx,peso:1});
  const e=espandi(w);
  if(e!==w) parole.push({w:e,idx,peso:0.97});
 });
 /* "la parola che conta è la prima" vale dalla prima parola vera: la
    sporcizia che l'OCR trova nel margine ("VON PASS. POMODORO") non si
    prende il posto d'onore e non fa retrocedere il nome del prodotto */
 let base=grezze.findIndex(parolaNotaOEspansa);
 if(base<0) base=0;
 if(!parole.length) return {id:null,punti:0};
 /* i punti e le barre valgono come spazi anche qui, altrimenti
    "PROSC.CRUDO" non incontra mai l'alias "prosc crudo" e il prosciutto
    crudo diventa cotto */
 /* anche la riga intera va raddrizzata, sennò le frasi non si trovano
    mai nelle righe lette male ("F0RMAGGIO GRATT.") */
 const intera=normalizza(desc).replace(/[\/.,-]+/g,' ').replace(/\s+/g,' ').trim()
   .split(' ').map(cifreStorte).join(' ');
 let best={id:null,punti:0,quante:0,proprie:0};
 for(const id in ALIAS){
  if(!ING[id]) continue;
  let migliore=0, proprie=0; const prese=new Set();
  /* le parole del mio nome, per sapere se la riga parla proprio di me */
  const mieParole=new Set(normalizza((ING[id]&&ING[id].n)||'').split(/\s+/).filter(w=>w.length>2));
  for(const alias of ALIAS[id]){
   /* un alias di più parole ("pomodori pelati", "petto di pollo") vale pieno
      ovunque compaia: è più specifico di una parola sola */
   if(alias.includes(' ')&&intera.includes(alias)){
    /* se la frase comincia dove comincia la riga, è il nome del prodotto;
       se sta in mezzo, è un complemento ("tonno all'olio di oliva") */
    const dove=intera.indexOf(alias);
    migliore=Math.max(migliore,dove<=1?1.05:0.78); prese.add(alias); continue; }
   for(const {w,idx,peso} of parole){
    let p=0;
    if(w===alias) p=1;
    /* una parola di due lettere ("PS") conta solo se è identica: troppo
       corta per permettersi un errore */
    else if(w.length>=3){
     const L=Math.max(w.length,alias.length);
     const tolleranza = L>=10 ? 2 : (L>=7 ? 1 : 0);
     const d=lev(w,alias);
     if(d<=tolleranza && tolleranza>0) p=1-(d/L)*0.55;
     /* l'OCR tronca le parole lunghe ("PARMIGIAN", "INSALA."): un prefisso
        vale solo se è quasi tutta la parola, altrimenti "verde" finisce
        per essere il limone verdello */
     if(w.length>=6&&alias.startsWith(w)&&alias.length-w.length<=3) p=Math.max(p,.9);
     if(alias.length>=6&&w.startsWith(alias)&&w.length-alias.length<=3) p=Math.max(p,.9);
     /* in italiano l'ultima vocale cambia da sola: "ramati" è "ramato",
        "pomodorini" resta diverso da "pomodoro". Chiedo almeno cinque
        lettere in comune, così "olive" non diventa "oliva". */
     if(w.length>=6&&alias.length>=6&&w.slice(0,-1)===alias.slice(0,-1)
        &&/[aeio]$/.test(w)&&/[aeio]$/.test(alias)) p=Math.max(p,.97);
    }
    if(!p) continue;
    p*=peso;
    if(p>=0.86){ prese.add(idx);
     /* la parola sta anche nel MIO nome, non solo nella mia lista di
        sinonimi? Allora quella riga parla di me. È la differenza fra la
        provola (che si chiama Provola) e la scamorza, che la teneva
        soltanto come sinonimo. */
     if(mieParole.has(w)||mieParole.has(alias)) proprie++;
    }
    if(idx>base) p*=0.8;
    if(p>migliore) migliore=p;
   }
  }
  /* a pari punteggio vince chi spiega più parole della riga: "LATTE PARZ.
     SCREMATO" è il parzialmente scremato, non il latte intero, perché del
     latte intero quella riga avrebbe spiegato solo la prima parola.
     E a pari copertura vince chi di quelle parole ne ha nel proprio nome:
     senza questo, la voce più vecchia del catalogo si teneva per sempre
     le parole delle voci aggiunte dopo. */
  if(migliore>best.punti+1e-9 ||
     (migliore>best.punti-1e-9 && prese.size>best.quante) ||
     (migliore>best.punti-1e-9 && prese.size===best.quante && proprie>best.proprie))
   best={id,punti:migliore,quante:prese.size,proprie};
 }
 return {id:best.id,punti:best.punti};
}

/* da una riga grezza a una riga di scontrino, oppure a uno scarto motivato */
function leggiRiga(grezza,colonne){
 const raw=String(grezza||'').replace(/\s+/g,' ').trim();
 if(raw.length<3) return null;
 const n=normalizza(raw);
 /* prima di tutto: me l'hai già detto tu cos'è? */
 const nota=imparata(raw);
 if(nota===false) return {scarto:'me l’hai detto tu',raw};
 const sporco=NONCIBO.find(w=>n.includes(w));
 if(sporco) return {scarto:'non è cibo',raw};
 if(NONRIGA.some(r=>r.test(n))) return {scarto:'riga non prodotto',raw};
 /* L'intestazione col nome della catena non è un prodotto — ma "CONAD
    PERCORSO QUALITA POLLO" sì, ed è il caso di tutti i prodotti a
    marchio del supermercato. La differenza è il prezzo in fondo: una
    intestazione non ce l'ha. */
 if(CATENE.some(c=>{const k=normalizza(c); return k.length>3&&n.includes(k);})
    && !/\d{1,4}[.,]\d{2}\s*[a-z]?\s*$/.test(n))
  return {scarto:'intestazione',raw};
 const pulita=colonne?{desc:colonne.desc,prezzo:colonne.prezzo}:ripulisciRiga(raw);
 const desc=pulita.desc, prezzo=pulita.prezzo;
 if(!sembraProdotto(desc,prezzo)) return {scarto:'riga non prodotto',raw};
 /* la riga ripulita può essere una di quelle di cassa */
 const dn=normalizza(desc);
 if(NONRIGA.some(r=>r.test(dn))) return {scarto:'riga non prodotto',raw};
 if(NONFRASI.some(f=>n.includes(f)||dn.includes(f))) return {scarto:'riga di cassa',raw};
 if(NONCIBO.find(w=>dn.includes(w))) return {scarto:'non è cibo',raw};
 /* La quantità la cerco solo nella descrizione, non in tutta la riga: nel
    margine l'OCR raccoglie numeri che non vogliono dire niente ("'58" letto
    sulla carta sporca diventerebbe 58 g di pesto). Se le colonne non le ho
    trovate, la riga intera è tutto quello che ho. */
 const q=leggiQuantita(colonne?desc:(desc+' '+raw));
 /* il "2 X" in testa alla riga le colonne l'hanno già tolto dal nome e
    messo da parte: se l'ho perso per strada me lo riprendo da lì */
 if(colonne&&colonne.molt>1&&q.molt===1){
  q.molt=colonne.molt;
  if(q.v) q.v=Math.round(q.v*colonne.molt*10)/10;
 }
 if(nota){ const i=ING[nota];
  if(i){ const mis=misura(nota,q);
   return {raw,id:nota,q:mis.q,u:mis.u,c:1,desc,prezzo,
           chiedi:!!mis.chiedi,
           stato:mis.pesoDubbio?'peso':(mis.chiedi?'quanti':'certa')}; } }
 const m=abbina(desc);
 if(!m.id||m.punti<0.56){
  return {raw, id:null, guess:nomePresentabile(desc), desc, q:q.v||1,
          u:q.u||'pz', c:Math.max(.2,m.punti), stato:'ignota', prezzo};
 }
 const mis=misura(m.id,q);
 const sicuro=m.punti>=0.86;
 return {raw, id:m.id, q:mis.q, u:mis.u, c:Math.min(.99,m.punti), desc, prezzo,
         chiedi:!!mis.chiedi,
         stato:sicuro?(mis.pesoDubbio?'peso':(mis.chiedi?'quanti':'certa')):'dubbia'};
}

/* il negozio, dalle prime righe */
function leggiNegozio(righe){
 const prime=righe.slice(0,12);
 const testa=normalizza(prime.join(' '));
 for(const c of CATENE){
  const k=normalizza(c);
  if(k.length>3&&testa.includes(k)) return c==='Ins Mercato'?"In's Mercato":c;
 }
 /* i nomi corti (MD, Pam, Alì) non si possono cercare dentro le parole:
    "md" sta dentro "comodo". Li voglio come parola intera. */
 for(const c of CATENE){
  const k=normalizza(c);
  if(k.length>3||k.length<2) continue;
  if(new RegExp('(?:^|\\s)'+k+'(?:\\s|$)').test(testa)) return c;
 }
 /* l'OCR sbaglia una lettera e il nome non si trova più: confronto per parola */
 const parole=testa.split(/\s+/).filter(w=>w.length>3);
 for(const c of CATENE){
  const k=normalizza(c).split(/\s+/).filter(w=>w.length>3);
  if(!k.length) continue;
  if(k.every(kw=>parole.some(w=>somiglianza(w,kw)>0.8)))
   return c==='Ins Mercato'?"In's Mercato":c;
 }
 return null;
}

/* ===== lettura per colonne =====
   Uno scontrino è una tabella: descrizione a sinistra, IVA in mezzo, prezzo a
   destra. Leggendo la riga come una stringa unica i tre pezzi si mescolano e
   il prezzo finisce nel nome. Tesseract però dà la posizione di ogni parola,
   e con quella le colonne si separano in modo netto. */
/* un prezzo letto male ha una cifra in più o un segno attaccato: mi basta
   che "assomigli" a un prezzo, la posizione conta più del valore.
   La parte intera può anche essere illeggibile ("@,89" al posto di "0,89"):
   i centesimi e la posizione nella colonna bastano per capire che è un prezzo. */
const RE_PREZZO=/^(\d{0,4})[.,](\d{2})\d?$/;
const RE_IVA=/^\d{1,2}\s?%$/;
const parolePulite=riga=>(riga.words||[]).filter(w=>w&&w.text&&w.text.trim()&&w.bbox)
  .sort((a,b)=>a.bbox.x0-b.bbox.x0);

function prezzoDi(w){
 const m=w.text.trim().replace(/[^\d.,]/g,'').match(RE_PREZZO);
 return m?parseFloat((m[1]||'0')+'.'+m[2]):null;
}

/* le colonne sono le stesse per tutte le righe: le calcolo una volta sola
   sulle righe lette bene, e le riuso su quelle lette male */
function colonneDi(righe){
 const xp=[], xi=[];
 righe.forEach(r=>{
  const ws=parolePulite(r);
  for(let i=ws.length-1;i>=0;i--){
   if(prezzoDi(ws[i])!==null){ xp.push(ws[i].bbox.x0); break; }
  }
  ws.forEach(w=>{ if(RE_IVA.test(w.text.trim())) xi.push(w.bbox.x0); });
 });
 const mediana=a=>{ if(!a.length) return Infinity;
   a.sort((x,y)=>x-y); return a[Math.floor(a.length/2)]; };
 return {prezzo:mediana(xp), iva:mediana(xi)};
}

function rigaDaColonne(riga,col){
 const ws=parolePulite(riga);
 if(ws.length<2) return null;
 let prezzo=null, xPrezzo=Infinity, xIva=Infinity;
 for(let i=ws.length-1;i>=0;i--){
  const p=prezzoDi(ws[i]);
  if(prezzo===null && p!==null){ prezzo=p; xPrezzo=ws[i].bbox.x0; }
  if(RE_IVA.test(ws[i].text.trim())) xIva=Math.min(xIva,ws[i].bbox.x0);
 }
 /* colonna di riserva, quando su questa riga il prezzo non si legge.
    Per l'IVA non lo faccio: basta una riga di sconto ("SCONTO 20%") perché
    quella colonna finisca in mezzo ai nomi e li tagli tutti. L'IVA la uso
    solo dove la vedo davvero, su quella riga. */
 if(col && xPrezzo===Infinity && col.prezzo!==Infinity) xPrezzo=col.prezzo;
 const limite=Math.min(xPrezzo,xIva)-4;
 if(!isFinite(limite)) return null;
 /* la sporcizia del margine è corta e storta; una parola di tre lettere o più
    la tengo anche se Tesseract non ne è sicuro, perché il nome del prodotto
    spesso è proprio la parola letta peggio */
 const paroluta=w=>(w.text.match(/[a-zA-Zàèéìòù]/g)||[]).length>=3;
 let testa=ws.filter(w=>w.bbox.x1<limite &&
   (w.confidence===undefined||w.confidence>=35||paroluta(w)));
 /* Il "2 X" della quantità è fatto di pezzi corti, uguali alla sporcizia
    del margine, e la pulizia qui sotto se lo porta via insieme a quella.
    Quindi me lo segno adesso, finché la riga è ancora intera. */
 const prima=testa.map(w=>w.text.trim()).join(' ');
 const mq=prima.match(/(?:^|\s)(\d{1,2})\s*[xX*](?:\s|$)/);
 /* in testa resta la sporcizia del margine: via tutto ciò che non ha lettere */
 while(testa.length>1 && !/[a-zA-Zàèéìòù]/.test(testa[0].text)) testa.shift();
 const largh=(ws[ws.length-1].bbox.x1-ws[0].bbox.x0)||1;
 while(testa.length>1){
  const a=testa[0], b=testa[1];
  const lettere=(a.text.match(/[a-zA-Zàèéìòù]/g)||[]).length;
  if(lettere<=2 && (b.bbox.x0-a.bbox.x1)/largh>0.03) testa.shift();
  else break;
 }
 /* dopo la pulizia la testa può cominciare con la quantità ("1 X SALMONE"):
    non pretendo una lettera nella prima parola, ma almeno una in tutta la testa */
 if(!testa.length||!/[a-zA-Zàèéìòù]/.test(testa.map(w=>w.text).join(''))) return null;
 let desc=testa.map(w=>w.text.trim()).join(' ').replace(/\s+/g,' ').trim();
 /* certe catene scrivono la quantità in testa: "2 X CROISSANT" */
 let molt=1;
 const mx=desc.match(/^(\d{1,2})\s*[xX*]\s+/);
 if(mx){ molt=parseInt(mx[1],10)||1; desc=desc.slice(mx[0].length).trim(); }
 else desc=desc.replace(/^[xX]\s+/,'').trim();
 if(molt===1&&mq) molt=parseInt(mq[1],10)||1;
 if(prezzo===null) return null;      /* la riga c'è, ma senza prezzo non è un acquisto */
 return {desc,prezzo,molt};
}

/* "1 x 1,59 1,59": nessun nome, solo numeri. È la seconda metà di un
   acquisto scritto su due righe, e da sola non vale niente. */
function prezzoSolo(riga,col){
 const ws=parolePulite(riga);
 let prezzo=null, x=Infinity;
 for(let i=ws.length-1;i>=0;i--){
  const p=prezzoDi(ws[i]);
  if(p!==null){ prezzo=p; x=ws[i].bbox.x0; break; }
 }
 if(prezzo===null) return null;
 if(col&&col.prezzo!==Infinity&&Math.abs(x-col.prezzo)>60) return null;
 if(ws.some(w=>w.bbox.x1<x-4&&/[a-zA-Zàèéìòù]{3}/.test(w.text))) return null;
 const mx=(riga.text||'').match(/(\d{1,2})\s*[xX*]\s/);
 return {desc:'',prezzo,molt:mx?(parseInt(mx[1],10)||1):1};
}

/* le righe lette con le colonne, più quelle che restano da buttare */
function leggiColonne(righeOCR){
 const buone=[], scarti=[];
 const righe=righeOCR||[];
 const colonne=colonneDi(righe);
 /* Alcune catene stampano la descrizione su una riga e il prezzo su quella
    dopo. Se una riga ha parole ma niente prezzo, e la successiva ha il prezzo
    senza una descrizione sua, le unisco: sono lo stesso acquisto. */
 const saltare={};
 righe.forEach((r,i)=>{
  if(saltare[i]) return;
  const col=rigaDaColonne(r,colonne);
  if(col) return;
  const succ=righe[i+1]; if(!succ) return;
  const colS=rigaDaColonne(succ,colonne)||prezzoSolo(succ,colonne);
  if(!colS) return;
  const parole=(r.words||[]).filter(w=>w.text&&/[a-zA-Zàèéìòù]{3}/.test(w.text));
  if(parole.length<1) return;
  const suaDesc=(colS.desc||'').replace(/[^a-zA-Zàèéìòù]/g,'');
  if(suaDesc.length>3) return;          /* la riga sotto ha già un nome suo */
  const mio=parole.map(w=>w.text.trim()).join(' ');
  r.__unita={desc:mio,prezzo:colS.prezzo,molt:colS.molt||1};
  saltare[i+1]=1;
 });
 righe.forEach((r,i)=>{
  if(saltare[i]) return;
  const grezza=(r.text||'').replace(/\s+/g,' ').trim();
  if(grezza.length<4 && !r.__unita) return;
  const col=r.__unita||rigaDaColonne(r,colonne);
  if(!col){ return; }                        /* niente prezzo: silenzio, non è un acquisto */
  /* i controlli "non è cibo" devono vedere la riga intera: una parola letta
     male ma decisiva (SHOPPER) sparirebbe dalla sola descrizione ripulita */
  const l=leggiRiga(grezza, col);
  if(!l) return;
  if(l.scarto){ if(l.scarto!=='riga non prodotto') scarti.push({raw:col.desc||grezza,why:l.scarto}); }
  else buone.push(Object.assign({on:true},l,{raw:col.desc,prezzo:col.prezzo}));
 });
 return {lines:buone,other:scarti};
}

/* tutto insieme: dal testo letto dalla fotocamera alle righe della spesa */
function leggiScontrino(testo){
 const righe=String(testo||'').split(/\r?\n/).map(r=>r.trim()).filter(Boolean);
 const buone=[], scarti=[];
 righe.forEach(r=>{
  const l=leggiRiga(r);
  if(!l) return;
  if(l.scarto) scarti.push({raw:l.raw,why:l.scarto});
  else buone.push(Object.assign({on:true},l));
 });
 return {store:leggiNegozio(righe), lines:buone, other:scarti};
}

   || Object.keys(ING).find(k=>ING[k].n.toLowerCase().startsWith(s)&&s.length>2) || null;

 const txt=m?(ING[m].q>0?`✓ in dispensa: ${qty(ING[m].q,ING[m].u)}`:'✕ finito, finirà in lista spesa')

/* Un pannello che sparisce di colpo lascia l'occhio senza il filo di quello
   che ha appena toccato: esce da dove è entrato, e solo dopo lo tolgo. */
let pannelloAperto=false, pannelloTok=0;
function segnaPannello(){
 const w=el('sheet').firstElementChild;
 if(w&&pannelloAperto) w.classList.add('gia');
 pannelloAperto=true; pannelloTok++;
}
function chiudiPannello(){
 const c=el('sheet'), w=c.querySelector('.sheet-wrap');
 pannelloAperto=false;
 if(!w){ c.innerHTML=''; return; }
 const mio=++pannelloTok;
 w.classList.add('via');
 setTimeout(()=>{ if(mio===pannelloTok) c.innerHTML=''; },280);
}
const closeSheet=()=>{S.sheet=null;chiudiPannello();};

function segnaGiorno(i){
 S.selDay=i;
 document.querySelectorAll('.calday').forEach((c,n)=>c.classList.toggle('sel',n===i));
}
function vaiAlGiorno(i){
 const list=el('planlist'), d=el('day-'+i);
 if(list&&d){
  S.scrollLock=true;
  clearTimeout(vaiAlGiorno.t);
  vaiAlGiorno.t=setTimeout(()=>{S.scrollLock=false;},1200);
  list.scrollTo({top:Math.max(0,d.offsetTop-6),behavior:'smooth'});
 }
 segnaGiorno(i);
}
function montaPiano(){
 const list=el('planlist'); if(!list) return;
 const top=list.getBoundingClientRect().top;
 list.style.height=Math.max(200,Math.round(window.innerHeight-top))+'px';
 /* spazio in coda, così anche l'ultimo giorno può salire in cima */
 const inner=list.firstElementChild;
 if(inner) inner.style.paddingBottom=Math.max(132,list.clientHeight-150)+'px';
 if(S.planScroll) list.scrollTop=S.planScroll;
 const giorni=[...list.querySelectorAll('.day')];
 list.onscroll=()=>{
  S.planScroll=list.scrollTop;
  /* mentre scorre da solo non cambio l'evidenziazione: la sblocco quando si ferma */
  if(S.scrollLock){ clearTimeout(vaiAlGiorno.t);
    vaiAlGiorno.t=setTimeout(()=>{S.scrollLock=false;},140); return; }
  let idx=0; giorni.forEach((g,i)=>{ if(g.offsetTop-list.scrollTop<=30) idx=i; });
  if(idx!==S.selDay) segnaGiorno(idx);
 };
 segnaGiorno(S.selDay||0);
}

 if(cambiata&&schermoPrec!==null){

  void vista.offsetWidth;          /* fa ripartire l'animazione da capo */

     su un livello a parte della scheda grafica, e si paga a ogni
     scorrimento senza che niente si muova */
  clearTimeout(render.pulizia);
  render.pulizia=setTimeout(()=>vista.classList.remove('vai-tab','vai-avanti','vai-indietro'),700);
 }

   S.screen=(S.screen==='proposte'&&S.prop&&S.prop.from)?S.prop.from
     :(S.screen==='ricetta'&&S.recFrom)?S.recFrom

 else if(a==='day'){ S.planScroll=0; S.screen='piano'; render(); vaiAlGiorno(Number(t.dataset.i)); }
 else if(a==='scrollday'){ vaiAlGiorno(Number(t.dataset.i)); }

 else if(a==='swap'){ openSheet(Number(t.dataset.d),t.dataset.s); }

 else if(a==='invf'){ S.invFilter=t.dataset.f; render(true); }

   render(true); if(el('sheet').innerHTML.trim()) apriFiltri(); }
 else if(a==='rfil-zero'){ S.rfil={pasto:'',disp:'',tempo:0,diff:0,prezzo:0,tag:[],ordine:'dispensa'}; S.rLimite=PAGINA;
   render(true); if(el('sheet').innerHTML.trim()) apriFiltri(); }
 else if(a==='rcerca-pulisci'){ S.recQuery=''; S.rLimite=PAGINA; render(true); }
 else if(a==='use'){ apriUso(t.dataset.id); }

  P.accepted=[{r,i:P.di,s:P.slot}]; P.step='fatto';
  toast(`${r.n} → ${SLOTNAME[P.slot].toLowerCase()} di ${dayLabel(P.di).toLowerCase()}`);

 if(!lib){ P.step='done'; render(); return; }
 PLAN[lib.i].meals[lib.s]=r.id;

 P.i++;

 render();
}

/* Correggere a mano una riga letta male: nome, quantità, unità, reparto.
   I campi si leggono solo al salvataggio, così scrivere non fa ridisegnare
   nulla e il testo non sparisce sotto le dita. */
function passoUso(k){
 const i=ING[k]; if(!i) return 1;
 if(i.u!=='g'&&i.u!=='ml') return 1;
 const f=i.f||500;
 return f>=1000?100:f>=400?50:f>=150?25:10;
}
function cambiaUso(v){
 if(!S.uso) return;
 const i=ING[S.uso.k];
 S.uso.q=Math.max(0,Math.round(v*10)/10);
 if(i) S.uso.q=Math.min(S.uso.q, Math.max(i.f,i.q)*4);
 disegnaUso();
}
function salvaUso(){
 const u=S.uso; if(!u||!ING[u.k]){ S.uso=null; chiudiPannello(); return; }
 const i=ING[u.k], prima=i.q;
 i.q=Math.round(u.q*10)/10;
 if(i.q>0){ i.visto=1; i.f=Math.max(i.f,i.q); }
 S.uso=null; chiudiPannello(); salva(); render(true);
 toast(i.q<=0?`${i.n}: finito, lo metto in lista`
   :i.q<prima?`${i.n}: ne resta ${qty(i.q,i.u)}`
   :`${i.n}: segnati ${qty(i.q,i.u)}`);
}
function disegnaUso(){
 const u=S.uso; if(!u) return;
 const i=ING[u.k], passo=passoUso(u.k);
 const pieno=Math.max(i.f,1), pct=Math.round(Math.min(1,u.q/pieno)*100);
 el('sheet').innerHTML=`<div class="sheet-wrap" data-a="chiudi-uso">
   <div class="sheet" data-stop="1">

         <input id="uso-q" type="number" step="any" min="0" inputmode="decimal" class="tnum grande"
           value="${Math.round(u.q*10)/10}" aria-label="Quantità rimasta">
         <span class="small">${esc(i.u)}</span>
       </span>
       <button class="passo-g" data-a="uso-passo" data-d="1" aria-label="Più ${passo} ${i.u}">+</button>
     </div>
     <div class="bar ${pct<=25?'warn':''}" style="margin:14px 0 16px"><i style="--p:${pct/100}"></i></div>
     <div class="chips" style="flex-wrap:wrap;overflow:visible;margin:0 0 16px">
       <button class="chip" data-a="uso-meta">ne resta metà</button>
       <button class="chip" data-a="uso-fine">è finito</button>
       <button class="chip" data-a="uso-pieno">confezione piena</button>
     </div>
     <button class="btn primary wide" data-a="uso-salva">Salva</button>
     <button class="btn sm ghost wide" data-a="uso-togli" style="margin-top:10px">
       🗑️ Toglilo dalla dispensa</button>
     <p class="muted" style="margin:8px 0 0;text-align:center">Se l’hai messo dentro per sbaglio.
       Diverso da «è finito», che invece lo manda nella lista della spesa.</p>
   </div></div>`;
 segnaPannello();

 if(inp) inp.oninput=()=>{ S.uso.q=Math.max(0,Number(inp.value)||0); };

/* Togliere una cosa dalla dispensa non è come dire "è finita": finita vuol
   dire che la devi ricomprare, e infatti va nella lista della spesa. Questa
   invece è per quando l'hai messa dentro per sbaglio: sparisce e basta.
   Se è una cosa che ti sei inventato tu e nessuna ricetta la usa, la
   dimentico del tutto; se la conosco, me la ricordo ma non è più in casa. */
function togliDispensa(k){
 const i=ING[k]; if(!i) return;
 const prima=JSON.parse(JSON.stringify(i));
 const eraSpuntata=S.checked[k], eraExtra=S.extra.includes(k);
 const nelCatalogo=CATALOGO.some(c=>c[0]===k);
 const inRicetta=RECIPES.some(r=>r.ing.some(([x])=>x===k));
 const inPiano=PLAN.some(d=>SLOTS.some(sl=>{const id=d.meals[sl];
   const r=id&&R(id); return r&&r.ing.some(([x])=>x===k);}));
 const miaRoba=!nelCatalogo&&!inRicetta&&!inPiano;
 if(miaRoba) delete ING[k];
 else { i.q=0; i.visto=0; }
 delete S.checked[k];
 S.extra=S.extra.filter(x=>x!==k);
 _SOST=null;
 salva(); render(true);
 toast(`${prima.n}: tolto dalla dispensa`,{testo:'Annulla',fai:()=>{
   ING[k]=prima;
   if(eraSpuntata) S.checked[k]=eraSpuntata;
   if(eraExtra&&!S.extra.includes(k)) S.extra.push(k);
   _SOST=null; salva(); render(true); toast(`${prima.n}: rimesso a posto`);
 }});
}

}

function salvaModifica(){
 const i=S.mod?S.mod.i:-1, l=S.lines[i];
 if(!l){ S.mod=null; chiudiPannello(); return; }
 const nome=(el('mod-n')?.value||'').trim();
 const q=Math.max(0,Number(el('mod-q')?.value||0));
 const u=el('mod-u')?.value||'pz';
 const rep=S.mod.rep||'credenza';
 if(!nome){ toast('Dai un nome al prodotto'); return; }
 /* se era già un ingrediente conosciuto e il nome non cambia, aggiorno solo
    la quantità; altrimenti diventa un prodotto vostro con questo nome */
 const ing=l.id?ING[l.id]:null;
 if(ing && normalizza(ing.n)===normalizza(nome)){
  l.q=q||l.q; l.u=u;
  if(ing.u!==u){ ing.u=u; }
  ing.l=rep;
 }else{
  const esistente=Object.keys(ING).find(k=>normalizza(ING[k].n)===normalizza(nome));
  const k=esistente||('mio'+Date.now().toString(36));
  if(!esistente){ ING[k]={visto:1,n:nome.slice(0,34),e:emojiPer(nome),
                          u,q:0,f:q||1,pr:l.prezzo||0,l:rep};
                  adottaFamiglia(k,nome); }
  else { ING[k].visto=1; ING[k].l=rep; }
  l.id=k; l.q=q||1; l.u=u;
 }
 l.stato='certa'; l.c=1; l.on=true;
 impara(l.raw,l.id);
 S.mod=null; chiudiPannello();
 render(true); toast('Corretto, e me lo ricordo');
}

function applicaScontrino(){
 let n=0;
 S.lines.filter(l=>l.on&&l.id&&ING[l.id]).forEach(l=>{
  const i=ING[l.id];
  i.q=Math.round((i.q+inUnita(l.id,l.q,l.u))*10)/10;
  i.f=Math.max(i.f,i.q); i.visto=1;
  if(i.exp!==undefined) i.exp=Math.max(i.exp,7);
  delete S.checked[l.id];
  S.extra=S.extra.filter(k=>k!==l.id);

 });
 S.ultima={store:S.store||'Scontrino', data:oggiCorto(), righe:n,
   tot:Math.round(S.lines.filter(l=>l.on&&l.id).reduce((a,l)=>a+(l.prezzo||0),0)*100)/100};

 toast(`${n} aliment${n===1?'o aggiornato':'i aggiornati'} in dispensa`);
}

/* ===================== memoria sul dispositivo =====================
   Tutto resta nel telefono: niente account, niente server. Se il browser
   non concede spazio (finestra privata, spazio finito) l'app continua a
   funzionare, semplicemente dimentica tutto alla chiusura. */
const CHIAVE='mirtillo.v1';
const oggiISO=()=>{const d=new Date();
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const giorniTra=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);

function salva(){
 try{ localStorage.setItem(CHIAVE, JSON.stringify({
   v:1, data:S.planDate||oggiISO(), ING, PLAN,
   /* solo le ricette scritte da voi: le mie arrivano con l'app, e se le
      salvassi tutte un aggiornamento non ve ne porterebbe mai di nuove */
   RECIPES:RECIPES.filter(r=>r.mia),
   imp:{budget:S.budget,weeks:S.weeks,store:S.store,diffMax:S.diffMax,people:S.people,
        onb:S.onb,diete:S.diete,imparate:S.imparate},
   stato:{shopped:S.shopped,checked:S.checked,extra:S.extra,ultima:S.ultima}
 })); }catch(e){ S.senzaMemoria=true; }
}
const salvaPresto=()=>{ clearTimeout(salvaPresto.t); salvaPresto.t=setTimeout(salva,350); };

function carica(){
 let raw=null;
 try{ raw=localStorage.getItem(CHIAVE); }catch(e){ S.senzaMemoria=true; return false; }
 if(!raw) return false;
 let d; try{ d=JSON.parse(raw); }catch(e){ return false; }
 if(!d||d.v!==1) return false;
 if(d.ING) Object.keys(d.ING).forEach(k=>{ ING[k]=Object.assign({},ING[k]||{},d.ING[k]); });
 if(Array.isArray(d.RECIPES)&&d.RECIPES.length){
  const mie=d.RECIPES.filter(r=>r&&r.id);
  /* le vostre in cima, senza doppioni, le mie restano sempre */
  RECIPES=[...mie, ...RECIPES.filter(r=>!mie.some(m=>m.id===r.id))];
 }
 if(Array.isArray(d.PLAN)&&d.PLAN.length) PLAN=d.PLAN;
 Object.assign(S, d.imp||{}, d.stato||{});
 S.planDate=d.data||oggiISO();
 return true;
}

/* i giorni passano: il piano scorre da solo e le scadenze si accorciano */
function avanzaGiorni(){
 const oggi=oggiISO();
 if(!S.planDate){ S.planDate=oggi; return 0; }
 const n=giorniTra(S.planDate,oggi);
 if(!(n>0)){ S.planDate=oggi; return 0; }
 for(let i=0;i<Math.min(n,PLAN.length);i++){
  PLAN.shift(); PLAN.push({meals:{colazione:null,pranzo:null,cena:null}});
 }
 if(n>=PLAN.length) PLAN=PLAN.map(()=>({meals:{colazione:null,pranzo:null,cena:null}}));
 Object.keys(ING).forEach(k=>{
  if(ING[k].exp!==undefined) ING[k].exp=Math.max(0,ING[k].exp-n); });
 S.planDate=oggi; return n;
}

function esporta(){
 let dati='{}'; try{ dati=localStorage.getItem(CHIAVE)||'{}'; }catch(e){}
 const url=URL.createObjectURL(new Blob([dati],{type:'application/json'}));
 const a=document.createElement('a');
 a.href=url; a.download='mirtillo-'+oggiISO()+'.json';
 document.body.appendChild(a); a.click(); a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),2000);

}
function importa(file){
 const fr=new FileReader();
 fr.onload=()=>{
  try{
   const d=JSON.parse(fr.result);
   if(!d||d.v!==1) throw new Error('non è una copia di Mirtillo');
   localStorage.setItem(CHIAVE,fr.result);
   location.reload();
  }catch(e){ toast('Quel file non sembra una copia di Mirtillo'); }
 };
 fr.readAsText(file);
}

/* ===================== aggiornamenti =====================
   L'app sta sulla home del telefono, quindi deve accorgersi da sola quando
   pubblico una versione nuova. Tre accorgimenti, perché uno solo non basta:
   - updateViaCache:'none' obbliga il browser a ricontrollare sw.js dalla rete
     (GitHub Pages dice "tienilo 10 minuti", e il controllo non avverrebbe);
   - a ogni apertura e a ogni rientro chiedo al service worker di aggiornarsi;
   - e controllo un segnavolta minuscolo, versione.json, che è l'unica prova
     sicura: se non combacia con quella in esecuzione, ricarico. */
const VERSIONE='20261125-1935';
let ricaricando=false;

function ricaricaPerAggiornamento(silenzioso){
 if(ricaricando) return;
 ricaricando=true;
 try{ salva(); }catch(e){}
 if(silenzioso) location.reload();
 else { toast('Aggiornamento pronto, riapro…'); setTimeout(()=>location.reload(),1100); }
}

async function controllaVersione(appenaAperta){
 try{
  const r=await fetch('versione.json?t='+Date.now(),{cache:'no-store'});
  if(!r.ok) return;
  const d=await r.json();
  if(!d||!d.v||d.v===VERSIONE) return;
  /* se ho già ricaricato per questa stessa versione e il file servito è
     ancora quello vecchio, mi fermo: meglio una versione vecchia che un
     telefono che si ricarica all'infinito */
  let tentata=null;
  try{ tentata=sessionStorage.getItem('mirtillo.aggiorna'); }catch(e){}
  if(tentata===d.v) return;
  try{ sessionStorage.setItem('mirtillo.aggiorna',d.v); }catch(e){}
  /* non interrompo una lettura dello scontrino o il primo avvio a metà */
  if(S.screen==='scanner'||S.screen==='benvenuto'){
   toast('C’è un aggiornamento: lo installo quando esci da qui');
   return;
  }
  ricaricaPerAggiornamento(appenaAperta);
 }catch(e){ /* offline: pazienza, si riproverà alla prossima apertura */ }
}

if('serviceWorker' in navigator &&
   (location.protocol==='https:'||location.hostname==='localhost')){
 window.addEventListener('load',()=>{
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'})
   .then(reg=>{
     reg.update().catch(()=>{});
     document.addEventListener('visibilitychange',()=>{
      if(!document.hidden) reg.update().catch(()=>{});
     });
   }).catch(()=>{});
 });
 /* quando il service worker nuovo prende il comando, la pagina va ricaricata */
 navigator.serviceWorker.addEventListener('controllerchange',()=>{
  if(sessionStorage.getItem('mirtillo.ricaricato')) return;
  try{ sessionStorage.setItem('mirtillo.ricaricato','1'); }catch(e){}
  ricaricaPerAggiornamento(true);
 });
}

/* il segnavolta: all'apertura in silenzio, al rientro con un avviso */
window.addEventListener('load',()=>setTimeout(()=>controllaVersione(true),800));
document.addEventListener('visibilitychange',()=>{
 if(!document.hidden) controllaVersione(false);
});

function montaCatalogo(){
 CATALOGO.forEach(([k,n,e,u,f,pr,l,parole])=>{
  if(!ING[k]) ING[k]={n,e,u,q:0,f,pr,l};
  const extra=(parole||'').split(/\s+/).filter(Boolean);
  ALIAS[k]=[...new Set([...(ALIAS[k]||[]),...extra])];
 });
 Object.keys(FRASI).forEach(k=>{ ALIAS[k]=[...(ALIAS[k]||[]),...FRASI[k]]; });
 /* le parole scritte a mano valgono più di quelle ricavate dal nome:
    "olio" è l'olio, non il tonno all'olio. Quindi una parola già assegnata
    a qualcuno non viene regalata a nessun altro. */
 const assegnate=new Set();
 Object.keys(ALIAS).forEach(k=>(ALIAS[k]||[]).forEach(w=>assegnate.add(w)));
 /* Dal nome ricavo i sinonimi, ma non tutte le parole di un nome dicono
    che cos'è una cosa: "Filetti di salmone" è salmone, non filetti, e
    "Verdure surgelate" non si prende la parola "surgelate". Se le lascio
    passare, la prima voce che le prende se le tiene per sempre e tutte le
    righe che le contengono finiscono da lei. */
 const FORMATO=new Set(['filetti','fette','fettine','pronto','pronta','fresca','fresco',
  'fresche','misto','misti','miste','naturale','classico','classica','grande','piccolo',
  'vaschetta','busta','surgelato','surgelata','surgelate','sfuso','intero','intera',
  'secche','secchi','essiccate','essiccati',
  'tagliato','affettato','grattugiato','cubetti','bustina','bottiglia','scatola','padano']);
 Object.keys(ING).forEach(k=>{
  const miei=new Set(ALIAS[k]||[]);
  const nome=normalizza(ING[k].n).split(/\s+/).filter(w=>w.length>3&&!FORMATO.has(w));
  /* la prima parola del nome è di chi porta quel nome: "Birra" è la birra,
     non il lievito di birra, anche se lui l'aveva chiesta prima */
  const dalNome=nome.filter((w,i)=>w.length>3 && (i===0||miei.has(w)||!assegnate.has(w)));
  dalNome.forEach(w=>assegnate.add(w));
  ALIAS[k]=[...new Set([...(ALIAS[k]||[]),...dalNome])];
 });
}

function emojiPer(nome){
 const n=normalizza(nome||'');
 if(!n) return '🛒';
 let vinta=null;
 for(const [w,e] of EMOJI){
  if(new RegExp('(?:^|[^a-z])'+w).test(n) && (!vinta||w.length>vinta[0].length)) vinta=[w,e];
 }
 return vinta?vinta[1]:'🛒';
}

/* ===================== quanto ne hai preso =====================
   Un alimento non si misura come capita: le uova si contano, la passata si
   versa, la mozzarella si compra a palline anche se il prezzo è al chilo.
   Per ogni alimento che si conta tengo quanto pesa (o quanto contiene) un

 limoni:'Quanti limoni?', patate:'Quante patate?', cipolla:'Quante cipolle?',
 zucchine:'Quante zucchine?', melanzane:'Quante melanzane?',
 peperoni:'Quanti peperoni?', carciofi:'Quanti carciofi?', melone:'Quanti meloni?',

 lonza:'Quanti pezzi?', costata:'Quante bistecche?',
 anguria:'Quante angurie?', ananas:'Quanti ananas?', avocado:'Quanti avocado?',
 pompelmo:'Quanti pompelmi?', lime:'Quanti lime?', limoni2:'Quanti limoni?',
 cetrioli:'Quanti cetrioli?', cipollotto:'Quanti cipollotti?', porro:'Quanti porri?',

 lattevegetale:'Quanti cartoni?', pizzapronta:'Quante basi?',
 bastoncini:'Quanti bastoncini?', salsiccia:'Quante salsicce?'

const aPezzi=id=>!!PEZZO[id];
/* Quanto ne entra in casa con UNA spesa normale, nell'unità della dispensa.
   Prima questo numero lo prendevo da "f", che è un'altra cosa: f è la
   dispensa piena. Risultato: una confezione di uova diventava dieci uova,
   un pacco di fette biscottate trenta fette, una scatoletta di tonno tre.
   Numeri che non venivano da nessuna parte. Qui invece c'è scritta la
   confezione che si compra davvero. */
const CONF={
 uova:6, yogurt:4, yogurtgreco:2, salmone:2, fagioli:1, ceci:1, tonno:1,
 lievito:4, fette:30, biscotti:30, dado:10, aglio:8, limoni:4, limoni2:4,
 basilico:1, prezzemolo:1, rosmarino:6, cipolla:3, scalogno:3, porro:2,
 mozzarella:125, burrata:125, scamorza:250, panebauletto:20
};
/* su queste la quantità cambia troppo da spesa a spesa: propongo e chiedo */
const VARIA=new Set(['uova','tonno','fagioli','ceci','cipolla','limoni','limoni2',
 'scalogno','porro','yogurt','salmone','aglio']);
/* quanto propongo quando lo scontrino non dice niente */
function confezione(id){
 const i=ING[id]; if(!i) return 1;
 /* una spesa non può riempire la dispensa più di quanto ci sta: se un
    numero qui sopra è sbagliato, almeno non diventa assurdo */
 if(CONF[id]!==undefined) return Math.min(CONF[id],i.f);
 if(i.u==='g'||i.u==='ml') return Math.round(i.f*10)/10;  /* qui f è la confezione */
 return 1;   /* si conta e non so la confezione: uno, e lo chiedo */
}
/* si conta davvero? Le uova e gli hamburger sì; le mele si pesano, anche se
   so quanto pesa una mela, perché nessuno compra "sei mele" alla cassa. */
function contaDavvero(id){
 const i=ING[id]; if(!i) return false;
 if(VARIA.has(id)) return true;
 if(!aPezzi(id)) return i.u!=='g'&&i.u!=='ml'&&CONF[id]===undefined;
 if(i.u!=='g'&&i.u!=='ml') return true;
 return pezziTipici(id)<=4;
}
const unitaPezzo=id=>{const i=ING[id];
 return i&&i.u!=='g'&&i.u!=='ml'?i.u:'pz';};
/* quanti pezzi è la confezione tipica */
function pezziTipici(id){
 const i=ING[id]; if(!i) return 1;
 if(i.u==='g'||i.u==='ml') return Math.max(1,Math.round(i.f/(PEZZO[id]||i.f)));
 return Math.max(1,Math.round(i.f));
}
/* porta una quantità nell'unità in cui la dispensa tiene quell'alimento */
function inUnita(id,q,u){
 const i=ING[id]; if(!i) return q;
 if(!u||u===i.u) return q;
 const peso=PEZZO[id];
 if((u==='g'||u==='ml')&&(i.u==='g'||i.u==='ml')) return q;
 if(u==='pz'&&(i.u==='g'||i.u==='ml')) return peso?Math.round(q*peso*10)/10:q;
 if((u==='g'||u==='ml')&&i.u!=='g'&&i.u!=='ml')
  return peso?Math.max(1,Math.round(q/peso)):q;
 return q;
}
/* la misura migliore per una riga di scontrino, e se vale la pena chiedere */
/* Un peso letto male non si vede. "125 G" diventa "1256 G" e in dispensa
   finisce un chilo e due di mozzarella senza che niente sembri strano: è un
   numero come un altro. Però le confezioni hanno misure tonde e stanno
   vicine a quella che conosco, quindi un numero che non è né tondo né
   vicino non l'ho letto bene e non me lo tengo.
   Il peso della bilancia ("0,412 kg") invece non si tocca mai: lì il numero
   dispari è giusto per forza, è un pezzo pesato davvero. */
function pesoStrano(id,let_){
 const i=ING[id]; if(!i||let_.pesato) return false;
 const q=let_.v;
 if(!q||(let_.u!=='g'&&let_.u!=='ml')) return false;
 /* nessuna confezione pesa 1256 g: un numero non tondo l'ho letto male.
    Vale anche per le cose che si contano a pezzi, dove il peso scritto
    sulla riga serve lo stesso a capire quanti sono */
 if(q%5!==0) return true;
 /* e deve stare vicino alla misura che conosco per quella cosa */
 const rif=(i.u==='g'||i.u==='ml') ? (i.f||0) : (PEZZO[id]||0)*(i.f||1);
 if(!rif) return false;
 return q>rif*6 || q<rif/5;          /* troppo lontano da quella che conosco */
}

function misura(id,let_){
 const i=ING[id]; if(!i) return {q:let_.v||1,u:let_.u||'pz'};
 const molt=let_.molt||1;
 const strano=pesoStrano(id,let_);
 /* 1. il peso c'è scritto ed è credibile: quello è un dato, non si tocca */
 if(let_.v&&(let_.u==='g'||let_.u==='ml')&&!strano){
  if(i.u==='g'||i.u==='ml') return {q:let_.v,u:i.u};
  const peso=PEZZO[id];
  if(peso) return {q:Math.max(1,Math.round(let_.v/peso)),u:i.u};
  return {q:let_.v,u:let_.u};
 }
 /* 2. "x3" sullo scontrino: tre pezzi, e non serve chiedere */
 if(molt>1&&aPezzi(id)) return {q:molt,u:unitaPezzo(id)};
 if(molt>1){
  /* su una cosa che si conta, "3X" dice quante ne hai prese, non quante
     confezioni: "TONNO 3X" sono tre scatolette, non tre confezioni da tre */
  const conta=!(i.u==='g'||i.u==='ml');
  return conta?{q:molt,u:i.u}:{q:Math.round(i.f*molt*10)/10,u:i.u};
 }
 /* 3. "UOVA FRESCHE 6": il numero è scritto lì, e per le cose che si
       contano vuol dire sei uova. Non è una stima, è un dato. */
 if(let_.conta&&(aPezzi(id)||!(i.u==='g'||i.u==='ml')))
  return {q:let_.conta,u:unitaPezzo(id)};
 /* 4. nessun numero, o un numero di cui non mi fido: la confezione solita.
       Se quella cosa si compra contandola ti chiedo quanti, perché
       "hamburger" senza grammi non vuol dire 110 g: vuol dire uno, o due,
       o quattro. E se il peso l'ho buttato via te lo dico. */
 return {q:confezione(id),u:i.u,
         chiedi:contaDavvero(id),pesoDubbio:strano};
}
